<script>
// One controller serves the Apps Script app and the local preview.
// Ownership comes from the server's `next` value. Toasts show only after the server returns ok.
(function () {
  'use strict';
  var ORDER = ['projects','dashboard','worklist','holds','directory','notifications'];
  var ROLE = {accountant:'Accountant', project_manager:'Project manager', leadership:'Leadership'};
  var MODE_LABEL = {review_all:'Review all', review_deficiencies:'Review deficiencies only', automatic:'Automatic'};
  var ACTION_LABEL = {approve:'Approve certificate', correct:'Check read values', resend:'Request a readable PDF'};
  var ACTION_SHORT = {approve:'Approve', decide:'Decide', correct:'Check', resend:'Resend'};
  var PAGE = 25;
  function remembered(key, fallback) { try { var v = window.localStorage.getItem('coi.' + key); return v == null ? fallback : v; } catch (e) { return fallback; } }
  function remember(key, value) { try { window.localStorage.setItem('coi.' + key, value); } catch (e) { /* storage blocked */ } }
  var state = { view:null, dir:'fwd', project:'PRJ-001', role:ROLE[INITIAL.role] ? INITIAL.role : 'accountant', portfolio:null, detail:null,
    worklist:null, visible:[], filter:'waiting', search:'', limit:PAGE, cursor:-1, request:0, busy:false, swelled:{}, decided:'',
    sideOpen:remembered('side','open') !== 'closed' && window.innerWidth > 900, expanded:{worklist:window.innerWidth > 900}, all:null, holdsAll:null, roi:null,
    data:null, details:{}, fetching:{}, pdfs:{} };
  var view = document.getElementById('view'), dialog = document.getElementById('editor');
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function wait(ms) { return reduce ? 0 : ms; }

  // Formatting
  function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g,function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n) {
    if (n == null) return 'Not shown';
    var whole = Math.abs(Number(n)) >= 100 || Number(n) % 1 === 0;
    return (n < 0 ? '-$' : '$') + Math.abs(Number(n)).toLocaleString('en-US',{minimumFractionDigits:whole ? 0 : 2,maximumFractionDigits:whole ? 0 : 2});
  }
  function date(iso, noYear) {
    if (!iso) return '';
    var d = new Date(String(iso).slice(0,10) + 'T00:00:00Z');
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString('en-US',noYear ? {month:'short',day:'numeric',timeZone:'UTC'} : {month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
  }
  function stamp(iso, noYear) {
    if (!iso) return '';
    var s = String(iso);
    if (s.indexOf('T') < 0) return date(s, noYear);
    var h = Number(s.slice(11,13));
    return date(s, noYear) + ', ' + ((h % 12) || 12) + ':' + s.slice(14,16) + ' ' + (h < 12 ? 'AM' : 'PM');
  }
  function newest(obj) { var out = ''; Object.keys(obj || {}).forEach(function (k) { if (obj[k] > out) out = obj[k]; }); return out; }
  function sourceName(text) {
    var names = {compliance_records:'compliance records', certificates:'certificates', pay_applications:'pay applications', roi_inputs:'ROI inputs', ai_calls:'AI calls'};
    var parts = String(text || '').split(/,\s*/).map(function (p) { return names[p] || p.replace(/_/g,' '); });
    var joined = parts.length > 1 ? parts.slice(0,-1).join(', ') + ' and ' + parts[parts.length - 1] : parts[0];
    return joined.charAt(0).toUpperCase() + joined.slice(1);
  }
  // The header shows one update time. Figure panels also show their source text for touch and keyboard users.
  function updated(text, iso, noYear) { return {text:iso ? 'Updated ' + stamp(iso, noYear) : 'No update recorded', source:'Source: ' + sourceName(text)}; }
  function source(text, iso) { var u = updated(text, iso); return '<span class="source" title="' + esc(u.source) + '">' + esc(u.text) + '</span>'; }
  function figureSource(u) { return '<span class="source figure-source">' + esc(u.source) + ' · ' + esc(u.text) + '</span>'; }
  function badge(word, extra) {
    var colors = {'Compliant':'green','On track':'green','At risk':'red','Expired':'red','Expiring soon':'amber','Watch':'amber','Needs attention':'amber',
      'In review':'blue','Needs review':'amber','Awaiting certificate':'neutral','Closed':'neutral','Waived':'violet',
      'Pass':'green','Fail':'red','Sent':'green','Waiting for approval':'amber','Not sent':'neutral'};
    return '<span class="badge ' + (colors[word] || 'neutral') + (extra ? ' ' + extra : '') + '">' + esc(word) + '</span>';
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function shortName(name) { return String(name || '').split(' ')[0]; }
  function capital(text) { text = String(text || ''); return text.charAt(0).toUpperCase() + text.slice(1); }
  function firstSentence(text) { var m = /^.*?[.!?](\s|$)/.exec(String(text || '')); return m ? m[0].trim() : String(text || ''); }
  function initials(name) { return String(name || '').split(/\s+/).filter(Boolean).slice(0,2).map(function (w) { return w.charAt(0).toUpperCase(); }).join(''); }

  // Ownership: the accountant owns approve, correct and resend; the project manager or leadership owns decide.
  function ownerOf(next) { return next === 'decide' ? 'project_manager' : 'accountant'; }
  function owned(next) { return !!next && (state.role === 'accountant' ? next !== 'decide' : next === 'decide'); }

  // Toast
  var toast = document.getElementById('toast'), toastTimer = null, toastLeft = 0, toastStart = 0;
  function hideToast() { clearTimeout(toastTimer); toast.classList.remove('on'); }
  function armToast(ms) { clearTimeout(toastTimer); toastLeft = ms; toastStart = Date.now(); toastTimer = setTimeout(hideToast,ms); }
  function say(text, ok) {
    toast.classList.remove('on'); void toast.offsetWidth;
    toast.className = 'toast' + (ok === false ? ' refused' : '');
    toast.querySelector('p').textContent = text;
    toast.classList.add('on'); armToast(4500);
  }
  toast.querySelector('button').onclick = hideToast;
  toast.addEventListener('mouseenter',function () { clearTimeout(toastTimer); toastLeft -= Date.now() - toastStart; });
  toast.addEventListener('mouseleave',function () { if (toast.classList.contains('on')) armToast(Math.max(toastLeft,800)); });

  // Demo mode (ticket 14): the server saves nothing. It returns the rows an action changed, and the page keeps
  // them in sessionStorage. Every later call sends them back, and the server lays them over fresh data. So a
  // change survives a view switch or a reload, but not a new tab.
  var DEMO = !!INITIAL.demo, DEMO_KEY = 'coi.demo.overlay';
  var OVERLAY_ARGS = {getAppData:0, getWorklist:1, getPaymentHoldList:1, getRecordDetail:1, runReviewAction:4, changeReviewMode:3,
    getDirectory:0, getTrustChecks:0, getNotifications:0};
  function demoOverlay() { try { return JSON.parse(window.sessionStorage.getItem(DEMO_KEY) || 'null'); } catch (e) { return null; } }
  function keepOverlay(overlay) { try { window.sessionStorage.setItem(DEMO_KEY, JSON.stringify(overlay)); } catch (e) { /* storage blocked: the change lasts until the next fresh copy */ } }
  function rpc(name, args, yes, no) {
    var fail = no || function () { say('That didn\'t go through. Try again.', false); };
    if (window.COIPreview) { window.COIPreview.call(name, args, yes, fail); return; }
    if (DEMO && OVERLAY_ARGS[name] !== undefined) {
      args = args.slice(0, OVERLAY_ARGS[name]);
      while (args.length < OVERLAY_ARGS[name]) args.push(null);
      args.push(demoOverlay());
      var done = yes;
      yes = function (result) { if (result && result.demo && result.overlay) keepOverlay(result.overlay); if (done) done(result); };
    }
    var run = google.script.run.withSuccessHandler(yes).withFailureHandler(fail);
    run[name].apply(run, args);
  }

  // Sidebar: four screens, a count of what waits for this role, and a short list under each screen.
  var ICONS = {projects:'M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3',
    dashboard:'M12 3a9 9 0 1 0 9 9h-9zM15 3.5A9 9 0 0 1 20.5 9H15z',
    worklist:'M10 6h10M10 12h10M10 18h10M4 6l1.2 1.2L7.5 5M4 12l1.2 1.2L7.5 11M4 18l1.2 1.2L7.5 17',
    holds:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM10 9v6M14 9v6', roi:'M3 17l6-6 4 4 8-8M15 7h6v6',
    directory:'M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19M10 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM20 19v-1.5a3.5 3.5 0 0 0-2.5-3.35M15.5 5.2a3 3 0 0 1 0 5.6',
    notifications:'M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6zM10 19a2 2 0 0 0 4 0',
    trust:'M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3zM9 12l2 2 4-4'};
  var NAV_LABEL = {projects:'Projects', dashboard:'Compliance', worklist:'Worklist', holds:'Payment holds', directory:'Subcontractors', notifications:'Notifications'};
  var side = document.getElementById('side'), sideNav = document.getElementById('side-nav');
  function mineRows() { return state.all ? state.all.rows.filter(function (r) { return owned(r.next); }) : []; }
  function sideLists() {
    var p = state.portfolio ? state.portfolio.projects.slice() : [];
    var rank = {'At risk':0,'Needs attention':1,'Watch':1,'On track':2};
    p.sort(function (a, b) { return (rank[a.word] - rank[b.word]) || (b.waiting_count - a.waiting_count); });
    var issues = state.all ? state.all.rows.filter(function (r) { return r.status === 'Expired' || r.status === 'Expiring soon'; }) : [];
    issues.sort(function (a, b) { return (Number(b.status === 'Expired') - Number(a.status === 'Expired')) || String(a.expiry).localeCompare(String(b.expiry)); });
    var holds = state.holdsAll ? state.holdsAll.rows : [];
    var lists = {
      projects:{title:'Needs attention first', all:'View all ' + plural(p.length,'project','projects'), items:p.map(function (x) {
        return {label:x.name, meta:x.waiting_count ? x.waiting_count + ' waiting' : x.word, dot:x.word === 'At risk' ? 'red' : x.word === 'On track' ? 'green' : '', project:x.project_id};
      })},
      dashboard:{title:'Expired or expiring soonest', all:'View all ' + plural(issues.length,'issue','issues'), none:'Nothing expired or expiring.', items:issues.map(function (r) {
        return {label:r.subcontractor, meta:r.status === 'Expired' ? 'Expired' : date(r.expiry,true), dot:r.status === 'Expired' ? 'red' : '', record:r.record_id};
      })},
      worklist:{title:'Waiting for you', all:'View all ' + mineRows().length, none:'Nothing waiting for you.', items:mineRows().map(function (r) {
        return {label:r.subcontractor, meta:ACTION_SHORT[r.next], dot:'', record:r.record_id};
      })},
      holds:{title:'Largest holds' + (state.holdsAll && state.holdsAll.pay_date ? ' · ' + date(state.holdsAll.pay_date,true) + ' pay run' : ''), all:'View all ' + plural(holds.length,'hold','holds'), none:'No payments on hold.',
        items:holds.map(function (r) { return {label:r.subcontractor, meta:money(r.amount_usd), dot:'red', record:r.record_id}; })}
    };
    return lists;
  }
  function renderSide() {
    var active = state.view === 'detail' ? 'worklist' : state.view === 'company' ? 'directory' : state.view, lists = sideLists();
    var counts = {worklist:state.all ? mineRows().length : 0, holds:state.holdsAll ? state.holdsAll.rows.length : 0};
    sideNav.innerHTML = ORDER.map(function (key) {
      var on = key === active, list = lists[key], open = !!list && !!state.expanded[key];
      var count = counts[key] || 0;
      return '<div class="nav-group"><div class="nav-row' + (on ? ' on' : '') + '">' +
        '<button class="nav-btn" data-view="' + key + '" aria-current="' + (on ? 'page' : 'false') + '" title="' + NAV_LABEL[key] + '">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + ICONS[key] + '"></path></svg>' +
        '<span class="nav-label">' + NAV_LABEL[key] + '</span>' + (count ? '<span class="nav-count' + (key === 'worklist' ? ' mine' : '') + '" aria-label="' + count + (key === 'worklist' ? ' waiting for you' : ' on hold') + '">' + count + '</span>' : '') + '</button>' +
        (count ? '<span class="nav-dot" aria-hidden="true"></span>' : '') +
        (list ? '<button class="nav-toggle" data-toggle="' + key + '" aria-expanded="' + open + '" aria-label="' + (open ? 'Hide' : 'Show') + ' top 5 in ' + NAV_LABEL[key] + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>' : '') + '</div>' +
        (open ? '<div class="nav-sub"><div class="nav-sub-title">' + esc(list.title) + '</div>' +
          (list.items.length ? list.items.slice(0,5).map(function (it) {
            return '<button class="item"' + (it.record ? ' data-side-record="' + esc(it.record) + '"' : it.project ? ' data-side-project="' + esc(it.project) + '"' : ' data-side-route="' + esc(it.route) + '"') + '>' +
              '<span class="d ' + it.dot + '"></span><span class="t">' + esc(it.label) + '</span><span class="m">' + esc(it.meta) + '</span></button>';
          }).join('') : '<div class="none">' + esc(list.none || 'Nothing to show.') + '</div>') +
          (list.items.length ? '<button class="all" data-side-all="' + key + '">' + esc(list.all) + ' →</button>' : '') + '</div>' : '') + '</div>';
    }).join('');
    sideNav.querySelectorAll('.nav-btn').forEach(function (b) { b.onclick = function () {
      if (b.dataset.view === 'worklist' && state.view !== 'worklist' && state.view !== 'detail') state.filter = 'waiting';
      navigate(b.dataset.view);
    }; });
    sideNav.querySelectorAll('[data-toggle]').forEach(function (b) { b.onclick = function () { state.expanded[b.dataset.toggle] = !state.expanded[b.dataset.toggle]; renderSide(); sideNav.querySelector('[data-toggle="' + b.dataset.toggle + '"]').focus(); }; });
    sideNav.querySelectorAll('[data-side-record]').forEach(function (b) { b.onclick = function () { openRecord(b.dataset.sideRecord); }; });
    prefetchOnHover(sideNav);
    sideNav.querySelectorAll('[data-side-project]').forEach(function (b) { b.onclick = function () { state.project = b.dataset.sideProject; state.filter = 'waiting'; navigate('worklist'); }; });
    sideNav.querySelectorAll('[data-side-route]').forEach(function (b) { b.onclick = function () { navigate(b.dataset.sideRoute); }; });
    sideNav.querySelectorAll('[data-side-all]').forEach(function (b) { b.onclick = function () {
      var key = b.dataset.sideAll;
      if (key === 'worklist') { state.project = 'all'; state.filter = 'waiting'; }
      if (key === 'dashboard') { state.project = 'all'; state.filter = 'Expired'; key = 'worklist'; }
      if (key === 'holds') state.project = 'all';
      navigate(key);
    }; });
  }
  // One copy of the list data: portfolio, worklist and holds for every active project, and the ROI estimate.
  // Screens read it from memory. Only a write asks the server for a fresh copy.
  function useData(data) {
    state.data = data; state.portfolio = data.portfolio; state.all = data.worklist; state.holdsAll = data.holds.all; state.roi = data.roi;
    var p = data.portfolio.projects;
    if (state.project !== 'all' && p.length && !p.some(function (x) { return x.project_id === state.project; })) state.project = p[0].project_id;
    showWho();
  }
  function loadData(yes, no) {
    rpc('getAppData',[],function (data) { useData(data); renderSide(); if (yes) yes(); },no || function () {});
  }
  // One project's worklist and hold list, cut from the all-projects copy. Null when the project is not active.
  function worklistFor(id) {
    var all = state.data.worklist;
    if (id === 'all') return all;
    var p = state.portfolio.projects.filter(function (x) { return x.project_id === id; })[0];
    if (!p) return null;
    return {project_id:id, project:p.name, review_mode:p.review_mode, review_modes:all.review_modes, mode_set:p.mode_set || null,
      rows:all.rows.filter(function (r) { return r.project_id === id; })};
  }
  function holdsFor(id) { return state.data.holds[id] || null; }
  // Record detail: one request per record at a time. A hover starts it early, so a click often finds it done.
  function fetchDetail(id, yes, no) {
    var waiting = state.fetching[id];
    if (waiting) { waiting.push([yes,no]); return; }
    waiting = state.fetching[id] = [[yes,no]];
    rpc('getRecordDetail',[id],function (data) {
      state.details[id] = data; delete state.fetching[id];
      waiting.forEach(function (w) { if (w[0]) w[0](data); });
    },function (err) {
      delete state.fetching[id];
      waiting.forEach(function (w) { if (w[1]) w[1](err); });
    });
  }
  var hoverTimer = null;
  function prefetchOnHover(root) {
    root.querySelectorAll('[data-row],[data-side-record]').forEach(function (el) {
      var id = el.dataset.row || el.dataset.sideRecord;
      el.addEventListener('mouseenter',function () {
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(function () { if (!state.details[id] && !state.fetching[id]) fetchDetail(id); },120);
      });
      el.addEventListener('mouseleave',function () { clearTimeout(hoverTimer); });
    });
  }
  // Under 900px the nav opens over the page, so that choice is not remembered for the wide layout.
  function overlay() { return !!(window.matchMedia && window.matchMedia('(max-width:900px)').matches); }
  function setSide(open) {
    state.sideOpen = open; if (!overlay()) remember('side', open ? 'open' : 'closed');
    side.classList.toggle('closed', !open);
    document.getElementById('side-expand').tabIndex = open ? -1 : 0;
    placeSeg();
  }
  document.getElementById('side-collapse').onclick = function () { setSide(false); document.getElementById('side-expand').focus(); };
  document.getElementById('side-expand').onclick = function () { if (!state.sideOpen) { setSide(true); document.getElementById('side-collapse').focus(); } };
  side.addEventListener('transitionend',placeSeg);
  setSide(state.sideOpen);
  // The scrim, a tap on a destination and Esc close the overlay. Turning the device across 900px resets it.
  document.getElementById('side-scrim').onclick = function () { setSide(false); document.getElementById('side-expand').focus(); };
  side.addEventListener('click',function (e) {
    if (overlay() && state.sideOpen && e.target.closest('.nav-btn,.nav-sub .item,.nav-sub .all,.foot-btn')) setSide(false);
  });
  var wasOverlay = overlay();
  window.addEventListener('resize',function () {
    var now = overlay(); if (now === wasOverlay) return;
    wasOverlay = now; setSide(now ? false : remembered('side','open') !== 'closed');
  });

  // Header: one row per screen. Title and context on the left, screen controls and search on the right.
  var head = {title:document.getElementById('page-title'), meta:document.getElementById('page-meta'), picker:document.getElementById('ph-picker'),
    back:document.getElementById('back'), titleBox:document.getElementById('ph-title')};
  function setHead(title, meta, picker) {
    var detail = state.view === 'detail';
    head.back.hidden = !detail; head.titleBox.hidden = detail;
    head.title.textContent = title || '';
    head.meta.textContent = meta ? meta.text || meta : '';
    head.meta.title = meta && meta.source ? meta.source : '';
    head.picker.innerHTML = picker ? projectPicker() : '';
    var p = document.getElementById('project-picker');
    if (p) p.onchange = function () { state.project = p.value; state.limit = PAGE; navigate(state.view); };
  }
  head.back.onclick = function () { navigate('worklist'); };
  function projectPicker() {
    if (!state.portfolio) return '';
    return '<select id="project-picker" aria-label="Project"><option value="all"' + (state.project === 'all' ? ' selected' : '') + '>All active projects</option>' +
      state.portfolio.projects.map(function (p) { return '<option value="' + esc(p.project_id) + '"' + (p.project_id === state.project ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') + '</select>';
  }
  function projectName(id) {
    if (id === 'all') return 'All active projects';
    var p = state.portfolio && state.portfolio.projects.filter(function (x) { return x.project_id === id; })[0];
    return p ? p.name : '';
  }

  // Search lives in the header. From any other screen it opens the worklist across every project.
  var search = document.getElementById('search'), searchBox = document.getElementById('gsearch');
  search.oninput = function () {
    state.search = search.value; searchBox.classList.toggle('has-text',!!state.search); state.cursor = -1; state.limit = PAGE;
    if (state.view === 'worklist') {
      // A search looks at every record in the view, so it lifts any status filter.
      if (state.search && state.filter !== 'all') {
        state.filter = 'all';
        view.querySelectorAll('[data-filter]').forEach(function (x) { x.setAttribute('aria-pressed',String(x.dataset.filter === 'all')); });
      }
      if (document.getElementById('work-rows')) renderRows(false);
      return;
    }
    state.project = 'all'; state.filter = 'all'; navigate('worklist');
  };

  // Navigation
  function navIndex(name) { return name === 'detail' ? 2.5 : name === 'company' ? ORDER.indexOf('directory') + 0.5 : ORDER.indexOf(name); }
  window.addEventListener('resize',function () { placeSeg(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { placeSeg(); });
  function error() {
    view.setAttribute('aria-busy','false');
    view.innerHTML = '<section class="page-enter"><div class="empty"><h3>This view didn\'t load</h3><p>Try again. Your saved records are safe.</p><p style="margin-top:14px"><button class="btn secondary" id="retry">Try again</button></p></div></section>';
    document.getElementById('retry').onclick = function () { navigate(state.view); };
  }
  function setView(html, opts) {
    var enter = opts && opts.quiet ? '' : ' page-enter' + (state.dir === 'back' ? ' back' : '');
    view.innerHTML = '<section class="page' + enter + '">' + html + '</section>';
    view.setAttribute('aria-busy','false'); bindRoutes();
  }
  function bindRoutes() {
    view.querySelectorAll('[data-record]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); openRecord(b.dataset.record); }; });
    view.querySelectorAll('[data-route]').forEach(function (b) { b.onclick = function (e) {
      e.stopPropagation();
      if (b.dataset.project) state.project = b.dataset.project;
      if (b.dataset.filterInto) state.filter = b.dataset.filterInto;
      navigate(b.dataset.route);
    }; });
  }
  function navigate(name, opts) {
    opts = opts || {};
    if (state.busy || dialog.open) return;
    var from = state.view;
    state.dir = !from || navIndex(name) >= navIndex(from) ? 'fwd' : 'back';
    if (name !== 'worklist' && name !== 'detail' && state.search) { state.search = ''; search.value = ''; searchBox.classList.remove('has-text'); }
    if (name !== from) state.limit = PAGE;
    state.view = name; state.cursor = -1;
    var request = ++state.request;
    renderSide();
    if (!opts.quiet) {
      setHead(name === 'detail' ? '' : NAV_LABEL[name], '', name === 'worklist' || name === 'holds');
      view.setAttribute('aria-busy','true');
      view.innerHTML = '<div class="loading" role="status"><span class="spin" aria-hidden="true"></span>Loading</div>';
      window.scrollTo(0,0);
    }
    function current(fn) { return function (data) { if (request === state.request) { fn(data, opts); if (opts.done) opts.done(); } }; }
    function load() {
      if (name === 'projects') current(renderProjects)(state.portfolio);
      if (name === 'dashboard') current(renderDashboard)(state.portfolio);
      // The ROI page is hidden (ticket 16): no route reaches 'roi'. Its view code stays for a later return.
      if (name === 'roi') current(renderRoi)(state.roi);
      if (name === 'worklist') {
        var w = worklistFor(state.project);

      '<div><dt>Per certificate</dt><dd class="v">' + esc(cost.ai_cost_per_certificate_usd == null && !cost.price_unknown ? 'No reads yet' : aiMoney(cost.ai_cost_per_certificate_usd)) + '</dd></div></dl>' +
      '<span class="source" title="' + esc(u.source) + '">' + esc(u.text) + ' · ' + esc(u.source) + '</span></section>';
  }
  function renderTrustRows(animate) {
    var data = state.views.trust, target = document.getElementById('trust-rows'); if (!data || !target) return;
    var ev = data.expected_vs_received;
    var list = ev.rows.map(function (r, i) { return {r:r, i:i}; }).filter(function (x) { return !state.trust.gapsOnly || x.r.gap > 0; });
    list.sort(function (a, b) { return (Number(b.r.gap > 0) - Number(a.r.gap > 0)) || (b.r.gap - a.r.gap) || (a.i - b.i); });
    var found = list.map(function (x) { return x.r; }), rows = found.slice(0,state.trust.limit), more = Math.min(PAGE, found.length - rows.length);
    var updatedText = updated(ev.source, ev.last_updated);
    target.innerHTML = (rows.length ? '<div class="table-scroll"><table class="table cardable cards-3 trust-table" aria-label="Expected vs. received"><thead><tr><th>Subcontractor</th><th class="right">Owed</th><th class="right">Received</th><th class="right">Gap</th><th>Responsible person</th></tr></thead><tbody>' +
      rows.map(function (r, i) {
        return '<tr' + (animate ? ' class="row-in" style="animation-delay:' + wait(Math.min(i,12) * 50) + 'ms"' : '') + '><td class="c-title" data-label="Subcontractor"><button class="link-btn" data-company="' + esc(r.sub_id) + '">' + esc(r.sub_name) + '</button><span class="id mono">' + esc(r.sub_id) + '</span></td>' +
          '<td class="right" data-label="Owed">' + r.expected + '</td><td class="right" data-label="Received">' + r.received + '</td><td class="right" data-label="Gap"><strong' + (r.gap ? ' style="color:var(--red)"' : ' class="zero"') + '>' + r.gap + '</strong></td>' +
          '<td class="c-full" data-label="Responsible person">' + (r.gap ? '<strong>' + esc(ev.responsible_role || r.responsible_role || '') + '</strong>' + (r.responsible && r.responsible.length ? '<span class="who">' + esc(r.responsible.join(', ')) + '</span>' : '') : '<span class="muted">Nothing owed</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' :
      '<div class="empty"><h3>' + (state.trust.gapsOnly ? 'No subcontractor has a gap' : 'No subcontractors') + '</h3><p>' + (state.trust.gapsOnly ? 'Every subcontractor has the certificates it owes.' : 'There are no open records on active projects.') + '</p></div>') +
      '<div class="table-foot">' + (found.length ? '<span>Showing ' + rows.length + ' of ' + found.length + '</span>' : '') +
      (more > 0 ? '<button class="btn secondary small" id="trust-more">Show ' + more + ' more</button>' : '') +
      '<span class="source foot-source" title="' + esc(updatedText.source) + '">' + esc(updatedText.text) + ' · ' + esc(updatedText.source) + '</span></div>';
    var moreBtn = document.getElementById('trust-more');
    if (moreBtn) moreBtn.onclick = function () { state.trust.limit += PAGE; renderTrustRows(false); };
    target.querySelectorAll('[data-company]').forEach(function (b) { b.onclick = function () { openCompany(b.dataset.company); }; });
  }

  // Notifications: a read-only preview of the automatic emails. Nothing here sends.
  function noteMatches(n) { return (state.notes.event === 'all' || n.event_type === state.notes.event) && (state.notes.status === 'all' || n.status === state.notes.status); }
  function noteSteps(n) {
    var sent = n.status === 'Sent', waiting = n.status === 'Waiting for approval', closed = n.status === 'Not sent', approval;
    if (n.approval === 'Person approves') {
      approval = waiting ? {value:n.approved_by || 'A person', sub:'Waiting for approval', st:'now'} :
        closed ? {value:'Not approved', sub:'Not sent', st:'skip'} : {value:n.approved_by || 'A person', sub:'Approved', st:'done'};
    } else if (n.approval === 'Automatic (review mode)') approval = {value:'Automatic', sub:'Review mode', st:'done'};
    else if (n.approval === 'Automatic (daily job)') approval = {value:'Automatic', sub:'Daily job', st:'done'};
    else if (n.approval === 'Automatic (on upload)') approval = {value:'Automatic', sub:'On upload', st:'done'};
    else if (n.approval === 'Not built yet') approval = {value:'Not built yet', sub:'No approval step', st:'skip'};
    else approval = {value:'Not needed', sub:'Internal', st:'skip'};
    return [{label:'Triggered', value:n.trigger, sub:stamp(n.time), st:'done'}, {label:'Approval', value:approval.value, sub:approval.sub, st:approval.st},
      sent ? {label:'Sent', value:stamp(n.time), sub:'Sent', st:'done'} : closed ? {label:'Sent', value:'Not sent', sub:'', st:'skip'} : {label:'Sent', value:'After approval', sub:'', st:'todo'}];
  }
  function renderNotes(data, opts) {
    var u = updated(data.source, data.last_updated);
    setHead('Notifications',{text:plural(data.rows.length,'email','emails') + ' · ' + u.text, source:u.source});
    var kinds = []; data.rows.forEach(function (n) { if (!kinds.some(function (k) { return k[0] === n.event_type; })) kinds.push([n.event_type, n.event]); });
    var statuses = ['Sent','Waiting for approval','Not sent'];
    state.notes.pane = state.notes.openDetail ? 'detail' : 'list'; state.notes.openDetail = false;
    setView('<div class="well notice note-banner" role="note"><span class="dot" aria-hidden="true"></span><strong>' + esc(data.banner || NOTE_BANNER) + '</strong></div>' +
      '<div class="worklist-bar note-bar"><div class="seg" role="group" aria-label="Notification status"><span class="seg-ind" aria-hidden="true"></span>' +
      [['all','All']].concat(statuses.map(function (s) { return [s,s]; })).map(function (f) {
        return '<button data-nstatus="' + esc(f[0]) + '" aria-pressed="' + (state.notes.status === f[0]) + '">' + esc(f[1]) + '<span class="n">' + data.rows.filter(function (n) { return f[0] === 'all' || n.status === f[0]; }).length + '</span></button>';
      }).join('') + '</div>' +
      '<select id="note-event" aria-label="Event"><option value="all">All events</option>' + optionList(kinds, state.notes.event) + '</select></div>' +
      '<div class="note-layout" data-pane="' + state.notes.pane + '"><div class="surface note-list" data-tour="notifications"><div id="note-items"></div></div><article class="surface note-preview" id="note-preview" aria-label="Email preview"></article></div>', opts);
    view.querySelectorAll('[data-nstatus]').forEach(function (b) { b.onclick = function () {
      state.notes.status = b.dataset.nstatus; setNotePane('list');
      view.querySelectorAll('[data-nstatus]').forEach(function (x) { x.setAttribute('aria-pressed',String(x === b)); });
      placeSeg(); renderNoteBody(false);
    }; });
    document.getElementById('note-event').onchange = function (e) { state.notes.event = e.target.value; setNotePane('list'); renderNoteBody(false); };
    placeSeg(); renderNoteBody(!(opts && opts.quiet));
  }
  // On a narrow screen the list and the email are two steps: the list first, then the email with a way back.
  function narrowNotes() { return !!(window.matchMedia && window.matchMedia('(max-width:759px)').matches); }
  function setNotePane(pane) {
    state.notes.pane = pane;
    var layout = view.querySelector('.note-layout'); if (layout) layout.setAttribute('data-pane',pane);
  }
  function renderNoteBody(animate) {
    var data = state.views.notifications, list = document.getElementById('note-items'); if (!data || !list) return;
    var found = data.rows.filter(noteMatches).sort(function (a, b) { return String(b.time).localeCompare(String(a.time)); });
    var chosen = found.filter(function (n) { return n.id === state.notes.id; })[0] || found[0] || null;
    state.notes.id = chosen ? chosen.id : '';
    var u = updated(data.source, data.last_updated);
    list.innerHTML = (found.length ? '<ul class="note-items" aria-label="Notifications">' + found.map(function (n, i) {
      return '<li' + (animate ? ' class="row-in" style="animation-delay:' + wait(Math.min(i,12) * 40) + 'ms"' : '') + '><button class="note-item" data-note="' + esc(n.id) + '"' + (chosen && n.id === chosen.id ? ' aria-current="true"' : '') + '>' +
        '<span class="note-top"><strong>' + esc(n.event) + '</strong>' + badge(n.status) + '</span>' +
        '<span class="note-sub">' + esc(n.sub_name ? n.sub_name + ' · ' : '') + 'To ' + esc(n.to_name) + '</span><span class="note-sub">' + esc(stamp(n.time)) + (n.project ? ' · ' + esc(n.project) : '') + '</span></button></li>';
    }).join('') + '</ul>' : '<div class="empty"><h3>No matching emails</h3><p>Change the status or the event to see other emails.</p></div>') +
      '<div class="table-foot"><span>' + plural(found.length,'email','emails') + '</span><span class="source foot-source" title="' + esc(u.source) + '">' + esc(u.text) + ' · ' + esc(u.source) + '</span></div>';
    list.querySelectorAll('[data-note]').forEach(function (b) { b.onclick = function () {
      state.notes.id = b.dataset.note; renderNoteBody(false);
      if (narrowNotes()) { state.notes.scrollY = window.scrollY; setNotePane('detail'); document.getElementById('note-preview').scrollIntoView({block:'start'}); }
    }; });
    var pane = document.getElementById('note-preview');
    if (!chosen) { pane.innerHTML = '<div class="empty"><h3>Nothing selected</h3><p>No email matches these filters.</p></div>'; return; }
    var n = chosen, steps = noteSteps(n), ai = n.drafted_by === 'AI';
    pane.innerHTML = '<button type="button" class="btn back note-back" id="note-back">← Notifications</button><div class="note-meta"><span class="note-event">' + esc(n.event) + '</span>' + badge(n.status) + '<span class="mark' + (ai ? ' ai' : '') + '">' + (ai ? 'Drafted by AI' : 'Template') + '</span></div>' +
      '<h2>' + esc(n.subject) + '</h2>' +
      '<p class="note-to">To <strong>' + esc(n.to_name) + '</strong>' + (n.to_role ? ' (' + esc(n.to_role) + ')' : '') + ' · ' + esc(n.to_email) + '</p>' +
      '<dl class="note-facts"><div><dt>Trigger</dt><dd>' + esc(n.trigger) + '</dd></div><div><dt>Approval step</dt><dd>' + esc(n.approval) + '</dd></div></dl>' +
      '<ol class="note-track" aria-label="Progress">' + steps.map(function (s) {
        return '<li class="' + s.st + '"' + (s.st === 'now' ? ' aria-current="step"' : '') + '><span class="mk" aria-hidden="true">' + (s.st === 'done' ? '✓' : s.st === 'skip' ? '–' : '') + '</span><span class="lb">' + esc(s.label) + '</span><span class="vl">' + esc(s.value) + '</span><span class="sb">' + esc(s.sub) + '</span></li>';
      }).join('') + '</ol>' +
      '<div class="email" aria-label="Email text"><div class="email-head"><span>Subject</span><strong>' + esc(n.subject) + '</strong></div><div class="email-body">' + esc(n.body) + '</div></div>' +
      '<p class="footnote">' + esc(data.banner || NOTE_BANNER) + '</p>';
    document.getElementById('note-back').onclick = function () { setNotePane('list'); window.scrollTo(0,state.notes.scrollY); };
  }

  // Keyboard: ↑ ↓ (or j k) move, Enter opens, / searches, Esc blurs a field or goes back from a record.
  document.addEventListener('keydown',function (e) {
    if (dialog.open) return;
    var t = e.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
    if (e.key === 'Escape') {
      if (overlay() && state.sideOpen) { setSide(false); document.getElementById('side-expand').focus(); return; }
      if (typing) { t.blur(); return; }
      if (state.view === 'detail' && !state.busy) navigate('worklist');
      if (state.view === 'company' && !state.busy) navigate('directory');
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); search.focus(); return; }
    if (state.view !== 'worklist') return;
    var count = state.visible.length;
    if ((e.key === 'ArrowDown' || e.key === 'j') && count) { e.preventDefault(); state.cursor = Math.min(count - 1,state.cursor + 1); drawCursor(); scrollCursor(); }
    else if ((e.key === 'ArrowUp' || e.key === 'k') && count) { e.preventDefault(); state.cursor = Math.max(0,state.cursor - 1); drawCursor(); scrollCursor(); }
    else if (e.key === 'Enter' && state.cursor >= 0 && t.tagName !== 'BUTTON' && t.tagName !== 'A') { e.preventDefault(); openRecord(state.visible[state.cursor].record_id); }
  });
  function scrollCursor() { var row = view.querySelector('#work-rows tr.cursor'); if (row) row.scrollIntoView({block:'nearest'}); }

  // About view. It is reached from the sidebar foot, not from ORDER.
  NAV_LABEL.about = 'About';
  function showAbout() {
    if (state.busy || dialog.open) return;
    state.dir = 'fwd'; state.view = 'about'; state.cursor = -1; state.request++;
    if (state.search) { state.search = ''; search.value = ''; searchBox.classList.remove('has-text'); }
    renderSide(); setHead(NAV_LABEL.about, '', false); window.scrollTo(0,0);
    setView('<div class="surface about" style="padding:28px 32px">' +
      '<h2>How it works</h2>' +
      '<p class="thesis">AI reads, routes and drafts. Code calculates and decides. A person approves what matters. The model never does arithmetic.</p>' +
      '<h2>The 0.85 rule</h2>' +
      '<p>When the model reads a certificate with confidence below 0.85, a person checks the reading first. It never approves on its own.</p>' +
      '<p class="about-sample">All names are fictional.</p>' +
      '<p class="about-credit">Designed and built by Lucas Layden.</p></div>');
  }
  document.getElementById('about-link').onclick = showAbout;

  // Host API for the guided tour (Tour.html). The tour calls go() to switch screens and screen() to read the current one.
  // The record screen is the detail of a reading below the 0.85 gate. Worklist rows carry no confidence,
  // so a row the server routed to "Check the reading" stands in for it.
  function lowConfidenceRecord() {
    var rows = state.all ? state.all.rows : [];
    var row = rows.filter(function (r) { return r.next === 'correct' && r.status === 'Needs review'; })[0];
    if (row) return row.record_id;
    var seen = Object.keys(state.details).filter(function (id) { var d = state.details[id]; return d && typeof d.confidence === 'number' && d.confidence < 0.85; })[0];
    if (seen) return seen;
    row = rows.filter(function (r) { return !!r.waiting; })[0];
    return row ? row.record_id : null;
  }
  window.coiApp = {
    screen: function () { return state.view === 'detail' ? 'record' : state.view; },
    go: function (name) {
      if (name === 'record') { var id = lowConfidenceRecord(); if (id) openRecord(id); else navigate('worklist'); return; }
      if (name === 'about') { showAbout(); return; }
      // A screen this build does not have yet is ignored, and the tour shows the step's card in the centre.
      // The tour shows the whole portfolio, as the sidebar's "View all" does. Without this, a list keeps the
      // project of the record the tour opened before it, and Payment holds can show $0.
      if (name === 'worklist') { state.project = 'all'; state.filter = 'waiting'; }
      if (name === 'holds') state.project = 'all';
      if (ORDER.indexOf(name) >= 0) navigate(name);
    },
    // Asks the server for every screen the tour opens, in the background, so each tour step finds its data
    // already in the page. fetchView and fetchDetail share one request per screen, so a later visit waits on it.
    warm: function () {
      fetchView('directory',askDirectory,'rows',null,null);
      fetchView('notifications',askNotifications,'rows',null,null);
      var id = lowConfidenceRecord();
      if (id && !state.details[id] && !state.fetching[id]) fetchDetail(id);
    }
  };

  // Figures show at once from the data in the page, in both modes. In Share Proj with saved changes, one quiet
  // refresh then lays this tab's changes over them.
  if (INITIAL.data) useData(INITIAL.data);
  if (INITIAL.record) openRecord(INITIAL.record);
  else navigate(state.role === 'leadership' ? 'projects' : 'worklist');
  // A write after start-up brings its own fresh copy, so this refresh drops its answer: a late reply must not undo the write.
  if (INITIAL.data && DEMO && demoOverlay()) {
    var writesAtStart = state.writes || 0;
    rpc('getAppData',[],function (data) {
      if ((state.writes || 0) !== writesAtStart) return;
      useData(data); renderSide();
      if (!state.busy && !dialog.open && state.view !== 'detail') navigate(state.view,{quiet:true});
    },function () {});
  }
  setTimeout(function () { withPdfLib(function () {},function () {}); },1500);
})();
</script>
