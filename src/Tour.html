<style>
/* COI Check guided tour. Colours, type and easing come from the tokens in Styles.html. */
.ct-off{display:none!important}
.ct-ring{position:fixed;left:0;top:0;z-index:60;pointer-events:none;border-radius:14px;transform-origin:0 0;
  box-shadow:0 0 0 2px var(--accent),0 0 0 7px rgba(70,99,47,.16),0 26px 50px -18px rgba(60,45,25,.42),0 0 0 200vmax rgba(235,229,217,.5);
  transition:opacity 220ms var(--ease)}
.ct-ring.ct-dim{opacity:0}
.ct-card{position:fixed;left:0;top:0;z-index:61;width:min(372px,calc(100vw - 32px));padding:18px 20px 16px;
  background:var(--surface);color:var(--ink);border-radius:16px;outline:none;
  font-family:var(--sans);font-size:14.5px;line-height:1.55;font-weight:450;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(60,45,25,.08),0 6px 16px -4px rgba(60,45,25,.12),0 30px 60px -24px rgba(60,45,25,.38);
  transition:transform 320ms var(--ease),opacity 220ms var(--ease)}
.ct-card.ct-out{opacity:0;pointer-events:none}
.ct-card:focus-visible{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 3px rgba(70,99,47,.35),0 30px 60px -24px rgba(60,45,25,.38)}
.ct-card.ct-docked{left:12px;right:12px;top:auto;bottom:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:auto;transform:none!important;max-height:min(62vh,440px);max-height:min(44dvh,360px);overflow:auto}
.ct-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ct-count{font:500 12px/1 var(--mono);color:var(--muted);white-space:nowrap}
.ct-dots{display:flex;gap:3px;flex:1;min-width:40px}
.ct-dots i{flex:1;height:3px;border-radius:2px;background:var(--well);transition:background-color 220ms var(--ease)}
.ct-dots i.done{background:#9DB386}
.ct-dots i.on{background:var(--accent)}
.ct-skip,.ct-play{border:0;background:none;font:inherit;font-size:13px;font-weight:500;color:var(--muted);height:30px;padding:0 8px;border-radius:7px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;transition:background-color 140ms,color 140ms,transform 140ms}
@media (hover:hover) { .ct-skip:hover,.ct-play:hover{color:var(--ink);background:rgba(30,27,22,.06)} }
.ct-skip:active,.ct-play:active{transform:scale(.97);background:rgba(30,27,22,.1)}
.ct-play[aria-pressed="true"]{color:var(--done-fg);background:var(--done-bg)}
.ct-title{margin:0 0 6px;font-size:19px;line-height:1.25;font-weight:650;letter-spacing:-.015em;text-wrap:balance}
.ct-body{margin:0;color:var(--ink-2);text-wrap:pretty}
.ct-bar{height:2px;margin:14px 0 12px;border-radius:2px;background:rgba(30,27,22,.08);overflow:hidden}
.ct-bar span{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.ct-actions{display:flex;align-items:center;gap:8px}
.ct-sp{flex:1}
.ct-btn{height:36px;min-width:44px;padding:0 15px;border:0;border-radius:9px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:transform 140ms var(--ease),box-shadow 140ms,background-color 140ms}
.ct-back{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(30,27,22,.45),0 1px 2px rgba(60,45,25,.08)}
@media (hover:hover) { .ct-back:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--ink),0 3px 8px -3px rgba(60,45,25,.3)} }
.ct-back:active{transform:scale(.98);background:#F1ECE2}
.ct-next{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(46,66,32,.3)}
@media (hover:hover) { .ct-next:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px -6px rgba(46,66,32,.7)} }
.ct-next:active{transform:scale(.98);background:var(--accent-press)}
.ct-btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:inset 0 0 0 1px rgba(30,27,22,.2)}
.ct-card button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ct-next:focus-visible{outline-color:var(--ink)}
.ct-live{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
/* Finale */
.ct-card.ct-final{width:min(340px,calc(100vw - 32px));text-align:center;padding:26px 24px 20px}
.ct-fin .ct-check{display:inline-flex;margin-bottom:10px}
.ct-fin .ct-c1,.ct-fin .ct-c2{stroke:var(--accent);stroke-dasharray:100;stroke-dashoffset:0}
.ct-fin.ct-play-in .ct-c1{animation:ctDraw 520ms cubic-bezier(.65,0,.35,1) both}
.ct-fin.ct-play-in .ct-c2{animation:ctDraw 360ms cubic-bezier(.65,0,.35,1) 420ms both}
.ct-fin.ct-play-in .ct-check{animation:ctPop 420ms var(--ease) both}
.ct-fin-title{font-size:22px}
.ct-orbit{position:fixed;z-index:62;width:46px;height:46px;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 0 1.5px rgba(70,99,47,.55);opacity:0}
.ct-card.ct-final .ct-body{font-size:13.5px;color:var(--muted)}
@keyframes ctDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes ctPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* Welcome */
.ct-welcome{position:fixed;inset:0;z-index:64;display:grid;place-items:center;padding:16px;perspective:1200px;--px:0px;--py:0px}
.ct-veil{position:absolute;inset:0;overflow:hidden;background:rgba(241,236,226,.38);-webkit-backdrop-filter:blur(0px) saturate(1);backdrop-filter:blur(0px) saturate(1);opacity:0;
  transition:opacity 420ms var(--ease),backdrop-filter 620ms var(--ease),-webkit-backdrop-filter 620ms var(--ease)}
.ct-welcome.ct-in .ct-veil{opacity:1;-webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25)}
.ct-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;mix-blend-mode:multiply;transform:translate(var(--px),var(--py))}
.ct-orb-a{width:46vmax;height:46vmax;left:-12vmax;top:-16vmax;background:radial-gradient(circle,rgba(157,179,134,.55),transparent 65%);animation:ctDrift 18s ease-in-out infinite alternate}
.ct-orb-b{width:40vmax;height:40vmax;right:-14vmax;bottom:-18vmax;background:radial-gradient(circle,rgba(214,170,92,.42),transparent 65%);animation:ctDrift 22s ease-in-out -6s infinite alternate-reverse}
.ct-orb-c{width:26vmax;height:26vmax;left:54%;top:8%;background:radial-gradient(circle,rgba(255,253,249,.9),transparent 70%);mix-blend-mode:normal;opacity:.6;animation:ctDrift 16s ease-in-out -3s infinite alternate}
@keyframes ctDrift{from{translate:0 0}to{translate:4vmax 3vmax}}
.ct-wcard{position:relative;width:min(468px,100%);overflow:hidden;border-radius:24px;color:var(--ink);
  font-family:var(--sans);font-size:14.5px;line-height:1.55;font-weight:450;
  background:linear-gradient(180deg,rgba(255,253,249,.94),var(--surface) 46%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 1px rgba(60,45,25,.06),0 2px 4px rgba(60,45,25,.06),0 24px 48px -20px rgba(60,45,25,.28),0 60px 120px -40px rgba(70,99,47,.35);
  --rx:0deg;--ry:0deg;--gx:50%;--gy:30%;
  opacity:0;translate:0 22px;scale:.96;transform:rotateX(var(--rx)) rotateY(var(--ry));
  transition:opacity 360ms var(--ease),translate 620ms var(--ease),scale 620ms var(--ease)}
.ct-welcome.ct-in .ct-wcard{opacity:1;translate:0 0;scale:1}
.ct-welcome.ct-leaving .ct-wcard{opacity:0;translate:0 -8px;scale:.98;transition-duration:260ms,320ms,320ms}
.ct-welcome.ct-leaving .ct-veil{opacity:0}
.ct-w-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--gx) var(--gy),rgba(157,179,134,.22),transparent 60%);z-index:0}
.ct-w-hero{position:relative;z-index:1;margin:10px 10px 0;padding:14px 14px 12px;border-radius:16px;
  background:linear-gradient(160deg,#3F5A2A 0%,#2F4620 100%);color:#EEF2E6;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.2),0 10px 24px -12px rgba(46,66,32,.6)}
.ct-w-hero::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 45%,transparent 60%);background-size:250% 100%;background-position:120% 0;animation:ctSheen 1.4s var(--ease) 2.8s both}
@keyframes ctSheen{to{background-position:-60% 0}}
.ct-w-hero-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ct-w-live{display:inline-flex;align-items:center;gap:7px;font:500 11.5px/1 var(--mono);color:rgba(238,242,230,.78)}
.ct-w-live i{width:6px;height:6px;border-radius:50%;background:#B9D39C;box-shadow:0 0 0 0 rgba(185,211,156,.6);animation:ctLive 2s ease-out infinite}
@keyframes ctLive{0%{box-shadow:0 0 0 0 rgba(185,211,156,.55)}80%,100%{box-shadow:0 0 0 7px rgba(185,211,156,0)}}
.ct-w-rows{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ct-w-row{display:flex;align-items:center;gap:10px;height:34px;padding:0 6px 0 10px;border-radius:9px;background:rgba(255,253,249,.07);
  opacity:0;transform:translateY(6px);animation:ctRowIn 520ms var(--ease) calc(260ms + var(--i) * 110ms) both}
@keyframes ctRowIn{to{opacity:1;transform:none}}
.ct-w-co{flex:1;min-width:0;font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-w-st{position:relative;flex:none;display:grid;justify-items:end}
.ct-w-from,.ct-w-to{grid-area:1/1;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;
  transition:opacity 280ms var(--ease),transform 420ms var(--ease),filter 280ms}
.ct-w-from{background:rgba(255,253,249,.1);color:rgba(238,242,230,.72)}
.ct-w-to{opacity:0;transform:translateY(8px) scale(.9);filter:blur(3px);background:var(--done-bg);color:var(--done-fg)}
.ct-w-row[data-tone="amber"] .ct-w-to{background:#F4E4C6;color:#6B4708}
.ct-w-to svg{stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset 360ms cubic-bezier(.65,0,.35,1) 160ms}
.ct-w-row[data-tone="amber"] .ct-w-to svg{display:none}
.ct-w-row.ct-done .ct-w-from{opacity:0;transform:translateY(-8px);filter:blur(3px)}
.ct-w-row.ct-done .ct-w-to{opacity:1;transform:none;filter:none}
.ct-w-row.ct-done .ct-w-to svg{stroke-dashoffset:0}
.ct-w-row.ct-done{animation:ctRowIn 520ms var(--ease) calc(260ms + var(--i) * 110ms) both,ctRowLit 900ms var(--ease)}
@keyframes ctRowLit{0%{background:rgba(255,253,249,.07)}30%{background:rgba(185,211,156,.22)}100%{background:rgba(255,253,249,.07)}}
.ct-w-row[data-tone="amber"].ct-done{animation:ctRowIn 520ms var(--ease) calc(260ms + var(--i) * 110ms) both,ctRowAmb 900ms var(--ease)}
@keyframes ctRowAmb{30%{background:rgba(214,170,92,.24)}}
.ct-w-copy{position:relative;z-index:1;padding:22px 28px 22px}
.ct-w-copy>*{opacity:0;transform:translateY(8px);animation:ctRowIn 560ms var(--ease) both}
.ct-w-copy>:nth-child(1){animation-delay:120ms}.ct-w-copy>:nth-child(2){animation-delay:180ms}.ct-w-copy>:nth-child(3){animation-delay:240ms}.ct-w-copy>:nth-child(4){animation-delay:300ms}.ct-w-copy>:nth-child(5){animation-delay:360ms}
.ct-w-eyebrow{font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:.01em}
.ct-w-title{margin:6px 0 8px;font-size:27px;line-height:1.12;font-weight:650;letter-spacing:-.028em;text-wrap:balance}
.ct-w-body{margin:0;color:var(--ink-2);font-size:15px;text-wrap:pretty}
.ct-w-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px}
.ct-w-actions .ct-btn{height:42px;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.ct-w-go{position:relative;overflow:hidden;padding:0 16px 0 18px}
.ct-w-go::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);transition:transform 620ms var(--ease)}
@media (hover:hover) { .ct-w-go:hover::after{transform:translateX(120%)} }
.ct-w-go svg{transition:transform 220ms var(--ease)}
@media (hover:hover) { .ct-w-go:hover svg{transform:translateX(3px)} }
.ct-ghost{background:transparent;color:var(--ink-2)}
@media (hover:hover) { .ct-ghost:hover{background:rgba(30,27,22,.06);color:var(--ink)} }
.ct-ghost:active{transform:scale(.98);background:rgba(30,27,22,.1)}
.ct-w-meta{margin-top:16px;font:500 11.5px/1 var(--mono);color:var(--faint)}
.ct-wcard button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ct-w-go:focus-visible{outline-color:var(--ink)}
@media (max-width:480px){.ct-w-copy{padding:18px 20px 20px}.ct-w-title{font-size:23px}}
/* Replay hint */
  font:500 13px/1.4 var(--sans);box-shadow:0 14px 30px -12px rgba(30,27,22,.55);
  opacity:0;transform:translateY(-4px);transition:opacity 220ms var(--ease),transform 220ms var(--ease);pointer-events:none}
.ct-hint-ring{position:fixed;z-index:63;border-radius:12px;pointer-events:none;box-shadow:0 0 0 2px var(--accent),0 0 0 6px rgba(70,99,47,.18);opacity:0}
.ct-hint-ring.ct-in{animation:ctRing 1.6s var(--ease) 2 both}
@keyframes ctRing{0%{opacity:0;transform:scale(1.25)}30%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.08)}}
@media (max-width:640px){.ct-title{font-size:17.5px}.ct-card{padding:16px 16px 14px}}
@media (prefers-reduced-motion:reduce){.ct-ring,.ct-card,.ct-dots i,.ct-btn,.ct-skip,.ct-play,.ct-veil,.ct-wcard{transition:none!important}.ct-fin *,.ct-fin,.ct-hint-ring,.ct-orb,.ct-w-row,.ct-w-copy>*,.ct-w-hero::after,.ct-w-live i{animation:none!important}.ct-w-row,.ct-w-copy>*{opacity:1;transform:none}.ct-w-from,.ct-w-to,.ct-w-to svg{transition:none!important}.ct-hint-ring.ct-in{opacity:1}}
/* Sidebar foot: replay and About */
.foot-links{display:grid;gap:2px;margin-top:8px}
.foot-btn{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:9px;background:none;color:var(--ink-2);font:inherit;font-size:13px;font-weight:550;text-align:left;cursor:pointer;
  transition:background-color var(--t1),color var(--t1)}
@media (hover:hover) { .foot-btn:hover{background:rgba(30,27,22,.06);color:var(--ink)} }
.foot-btn:active{background:rgba(30,27,22,.1)}
.foot-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot-btn svg{flex:none}
.side.closed .foot-btn{justify-content:center;padding:0}
.side.closed .foot-label{display:none}
/* About view */
.about{max-width:640px}
.about h2{margin:0 0 8px;font-size:19px;line-height:1.25;font-weight:650;letter-spacing:-.015em}
.about p{margin:0 0 12px;color:var(--ink-2)}
.about .thesis{font-size:17px;line-height:1.5;color:var(--ink);font-weight:550}
.about .about-credit{margin-top:20px;font-weight:550;color:var(--ink)}
.about .about-sample{color:var(--muted);font-size:13px}
/* Touch screens (ticket R12): every tour control is 44px high. */
@media (pointer:coarse){.ct-btn,.ct-skip,.ct-play{height:44px}.ct-skip,.ct-play{min-width:44px;padding:0 12px}.ct-w-actions .ct-btn{height:48px}}
</style>
<script>
/* COI Check guided tour engine. Plain JavaScript, no dependencies.

   HOW TO START IT
   - First visit: a welcome card offers the tour. Closing it (or the tour) points to the Tour button once.
     The card does not show when the page opens a record from an email link.
   - Replay: click any element with [data-tour-replay], or call CoiTour.start().
   - AUTOPLAY for screen recording, two ways:
       1. Open the web app address with ?tour=play at the end. In an Apps Script web app the page
          runs inside an iframe, so the page address does not carry the visitor's query string.
          doGet in Code.gs reads e.parameter.tour, and passes tour:'play' to the page as INITIAL.tour
          only when the value is exactly "play". This engine starts autoplay from INITIAL.tour.
          No other value does anything.
       2. Press P while the tour is open. P also pauses and resumes autoplay.
     Each step's time is "ms" in TourSteps.html.
   - Keys while open: Right/Left arrows move between steps, Esc closes, P toggles autoplay.

   The host (AppClient.html) exposes window.coiApp = { go(view), screen() } so steps can switch views.
   A view the host does not have yet is skipped, and the step shows its card centred.
   All copy, targets and timings live in TourSteps.html. */
(function () {
  var C = window.TOUR_CONFIG;
  if (!C || !C.steps || !C.steps.length || window.CoiTour) return;
  var L = C.labels || {}, W = C.welcome || {}, FIN = C.finale || {};
  var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var D = rm ? 0 : 320, EASE = 'cubic-bezier(.16,1,.3,1)', PAD = 8;
  var ring, card, live, titleEl, bodyEl, countEl, dotsEl, barEl, backBtn, nextBtn, playBtn, skipBtn, finEl, finBtn;
  var welcome, hintEl, hintRing;
  var idx = -1, isOpen = false, playing = false, timer = 0, raf = 0, token = 0, last = null, moving = false, returnTo = null, target = null, finished = false;

  function app() { return window.coiApp || null; }
  // Fetch the tour's screens early, so a step does not wait on the server.
  // A failed early fetch must never stop the tour, so an error here is logged and ignored.
  function warm() { var a = app(); try { if (a && a.warm) a.warm(); } catch (e) { if (window.console) console.warn('Tour: early fetch failed', e); } }
  function q(s) { try { return s ? document.querySelector(s) : null; } catch (e) { return null; } }
  function fmt(t, o) { return String(t || '').replace(/\{(\w+)\}/g, function (_, k) { return o[k]; }); }
  function mobile() { return window.innerWidth <= 640; }
  function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function markSeen() { try { localStorage.setItem(C.storageKey, '1'); } catch (e) {} }

  function build() {
    if (card) return;
    ring = document.createElement('div'); ring.className = 'ct-ring ct-off'; ring.setAttribute('aria-hidden', 'true');
    card = document.createElement('div'); card.className = 'ct-card ct-off ct-out';
    card.setAttribute('role', 'dialog'); card.setAttribute('aria-modal', 'false');
    card.setAttribute('aria-label', L.region); card.tabIndex = -1;
    card.innerHTML =
      '<div class="ct-main"><div class="ct-top"><span class="ct-count" id="ct-count"></span><span class="ct-dots" aria-hidden="true"></span>' +
      '<button type="button" class="ct-skip" data-ct="skip"></button></div>' +
      '<h2 class="ct-title" id="ct-title"></h2><p class="ct-body" id="ct-body"></p>' +
      '<div class="ct-bar" aria-hidden="true"><span></span></div>' +
      '<div class="ct-actions"><button type="button" class="ct-play" data-ct="play" aria-pressed="false"></button>' +
      '<span class="ct-sp"></span><button type="button" class="ct-btn ct-back" data-ct="back"></button>' +
      '<button type="button" class="ct-btn ct-next" data-ct="next"></button></div></div>' +
      '<div class="ct-fin" hidden><span class="ct-check" aria-hidden="true"><svg viewBox="0 0 48 48" width="48" height="48"><circle cx="24" cy="24" r="21" fill="none" stroke-width="3" pathLength="100" class="ct-c1"/><path d="M15 24.5l6.5 6.5L33.5 18" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" pathLength="100" class="ct-c2"/></svg></span>' +
      '<h2 class="ct-title ct-fin-title" id="ct-fin-title">' + esc(FIN.title) + '</h2><p class="ct-body">' + esc(FIN.body) + '</p>' +
      '</div>';
    live = document.createElement('div'); live.className = 'ct-live'; live.setAttribute('role', 'status'); live.setAttribute('aria-live', 'polite');
    document.body.appendChild(ring); document.body.appendChild(card); document.body.appendChild(live);
    titleEl = card.querySelector('#ct-title'); bodyEl = card.querySelector('#ct-body'); countEl = card.querySelector('#ct-count');
    dotsEl = card.querySelector('.ct-dots'); barEl = card.querySelector('.ct-bar'); backBtn = card.querySelector('[data-ct="back"]');
    nextBtn = card.querySelector('[data-ct="next"]'); playBtn = card.querySelector('[data-ct="play"]'); skipBtn = card.querySelector('[data-ct="skip"]');
    finEl = card.querySelector('.ct-fin');
    card.setAttribute('aria-labelledby', 'ct-title'); card.setAttribute('aria-describedby', 'ct-body');
    skipBtn.textContent = L.skip; backBtn.textContent = L.back;
    dotsEl.innerHTML = C.steps.map(function () { return '<i></i>'; }).join('');
    card.addEventListener('click', function (e) {
      var b = e.target.closest('[data-ct]'); if (!b) return;
      var a = b.getAttribute('data-ct');
      if (a === 'next') next(); else if (a === 'back') go(idx - 1); else if (a === 'skip') close(); else if (a === 'play') setPlay(!playing);
      else if (a === 'finish') { var ap = app(); if (FIN.view && ap) ap.go(FIN.view); close(true); }
    });
  }

  function setPlay(on) {
    playing = on;
