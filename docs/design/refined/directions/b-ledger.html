<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction B · Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* Direction B: Ledger. Quiet precision for money decisions: few borders, exact figures, one elevated object.
   Layout: three panes. Certificate left, values as a ledger in the middle, a decision rail on the right. */
:root {
  /* Type */
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-id: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --num-features: "tnum", "zero";
  --fs-xs: 12px; --fs-sm: 13px; --fs-base: 14px; --lh-base: 22px; --fs-md: 15px; --fs-h1: 28px; --fw-regular: 400;
  /* Neutrals: near-white with a faint cool cast */
  --bg: #F6F7F9; --surface: #FFFFFF; --sunken: #EEF0F3; --hover: #F8F9FB;
  --line: #E6E8EC; --line-strong: #858B96;
  --ink: #0F1115; --ink-2: #565C68; --ink-3: #6B7180;
  /* Action: ink buttons, one cobalt for links and focus */
  --primary: #111318; --primary-hover: #2B2F37; --on-primary: #FFFFFF; --focus: #3358D4; --link: #2F51C4;
  --select: #EEF2FD; --select-edge: #3358D4;
  /* Status families */
  --green: #1D6B3A; --green-tint: #E8F3EB; --amber: #8A5100; --amber-tint: #FCF1DE; --red: #B42318; --red-tint: #FDECE9;
  --blue: #1D57A6; --blue-tint: #E9F0FA; --violet: #6435B5; --violet-tint: #F1ECFA; --neutral: #555B63; --neutral-tint: #EEF0F3;
  --changed-bg: #E3F2E7;
  /* Shape */
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
  --shadow-raise: 0 1px 1px rgba(15,17,21,.04), 0 2px 6px rgba(15,17,21,.05), 0 12px 32px -8px rgba(15,17,21,.12);
  --shadow-float: 0 2px 6px rgba(15,17,21,.08), 0 18px 48px -12px rgba(15,17,21,.28);
  /* Layout */
  --page-max: 1440px; --page-pad-top: 20px; --page-pad-x: 32px; --gap-section: 20px; --gap-pane: 20px;
  --cols: minmax(0, 3.3fr) minmax(0, 6fr) 344px;
  --areas: "pdf values step" "pdf values w9" "pdf values timeline";
  --res-w: 84px; --num-align: right; --num-flex: flex-end;
  /* Motion: soft landing, never bouncy */
  --dur-1: 120ms; --dur-2: 220ms; --dur-3: 360ms;
  --ease-out: cubic-bezier(.16, 1, .3, 1); --ease-inout: cubic-bezier(.65, 0, .35, 1);
  --rise: 6px; --skel-dur: 1.6s;
}

/* Top bar */
.chrome { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "demo demo demo" "brand nav sample"; align-items: center; gap: 0 28px; padding: 0 32px 0; background: rgba(255,255,255,.94); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); }
.brand { grid-area: brand; padding: 10px 0; }
.nav { grid-area: nav; }
.chrome-util { display: contents; }
.brand-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); position: relative; }
.brand-mark::after { content: ""; position: absolute; left: 6px; top: 7px; width: 12px; height: 10px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; border-radius: 0 0 0 2px; transform: skewX(-8deg); }
.brand-text strong { font-size: var(--fs-base); font-weight: 600; letter-spacing: -.01em; }
.brand-text span { font-size: var(--fs-xs); color: var(--ink-2); }
.nav ul { gap: 2px; }
.nav-item { color: var(--ink-2); font-size: var(--fs-sm); font-weight: 500; padding: 7px 10px; border-radius: var(--r-sm); transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out); }
.nav-item .ic { display: none; }
.nav-item:hover { color: var(--ink); background: var(--sunken); }
.nav-item[aria-current="page"] { color: var(--ink); background: var(--sunken); }
.chrome .sample-chrome { grid-area: sample; }
.demo { grid-area: demo; margin: 0 -32px; padding: 5px 32px !important; border: 0 !important; border-bottom: 1px dashed var(--line-strong) !important; border-radius: 0 !important; background: repeating-linear-gradient(135deg, var(--bg) 0 6px, var(--sunken) 6px 12px); }
.chrome .sample-chrome { font-size: var(--fs-xs); font-weight: 500; color: var(--ink-2); }
.demo-tag { font: 500 11px/18px var(--font-id); letter-spacing: .02em; color: var(--ink-2); padding: 0 6px; }
.demo-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.seg { background: var(--sunken); border-radius: 999px; padding: 2px; }
.seg-btn { border: 0; background: transparent; border-radius: 999px; padding: 3px 10px; font-size: var(--fs-xs); font-weight: 500; color: var(--ink-2); transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out); }
.seg-btn:hover { color: var(--ink); }
.seg-btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(15,17,21,.12); }
.demo-select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 8px; font-size: var(--fs-xs); max-width: 220px; }
.demo-reset { margin-left: auto; border: 0; background: transparent; font-size: var(--fs-xs); color: var(--link); padding: 3px 8px; border-radius: 999px; }
.demo-reset:hover { background: var(--select); }

/* Head: sits on the canvas, no card */
.back { color: var(--ink-2); font-size: var(--fs-sm); font-weight: 500; padding: 4px 8px 4px 4px; margin-left: -4px; border-radius: var(--r-sm); transition: color var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out); }
.back:hover { color: var(--ink); background: var(--sunken); }
.rec-head { gap: 16px 32px; padding-bottom: 4px; }
.eyebrow { font-size: var(--fs-sm); color: var(--ink-2); }
.eyebrow .dot { color: var(--line-strong); margin: 0 3px; }
.rid { font-family: var(--font-id); font-size: var(--fs-xs); color: var(--ink-3); margin-left: 6px; }
.rec-title { font-size: var(--fs-h1); line-height: 34px; font-weight: 600; letter-spacing: -.022em; }
.sample { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 500; color: var(--ink); background: repeating-linear-gradient(135deg, var(--surface) 0 4px, var(--sunken) 4px 8px); box-shadow: inset 0 0 0 1px var(--line-strong); white-space: nowrap; }
.waiting { font-size: var(--fs-base); font-weight: 500; }
.facts { gap: 0; }
.fact { flex-direction: column-reverse; gap: 2px; padding: 0 24px; border-left: 1px solid var(--line); }
.fact:first-child { padding-left: 0; border-left: 0; }
.fact dt { font-size: var(--fs-xs); color: var(--ink-2); }
.fact dd { font-size: var(--fs-md); font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.005em; }
.trust { font-size: var(--fs-xs); color: var(--ink-2); }

/* Status: soft pill, icon + word */
[data-tone="green"] { --t: var(--green); --tt: var(--green-tint); } [data-tone="amber"] { --t: var(--amber); --tt: var(--amber-tint); }
[data-tone="red"] { --t: var(--red); --tt: var(--red-tint); } [data-tone="blue"] { --t: var(--blue); --tt: var(--blue-tint); }
[data-tone="violet"] { --t: var(--violet); --tt: var(--violet-tint); } [data-tone="neutral"] { --t: var(--neutral); --tt: var(--neutral-tint); }
.pill { height: 26px; padding: 0 11px 0 8px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 500; color: var(--t); background: var(--tt); transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out); }
.pill .ic { width: 14px; height: 14px; }
.hold-flag { height: 26px; padding: 0 11px 0 9px; border-radius: 999px; background: var(--ink); color: #fff; font-size: var(--fs-sm); font-weight: 500; }
.hold-reasons { font-size: var(--fs-sm); }

/* Panes: hairline, no shadow; the next step is the one raised object */
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.pane-head { padding: 16px 20px 12px; }
.pane-title { font-size: var(--fs-md); line-height: 22px; font-weight: 600; letter-spacing: -.01em; }
.pane-sub { font-size: var(--fs-sm); color: var(--ink-2); }
.pane-hint { display: none; }
.link { color: var(--link); font-size: var(--fs-sm); font-weight: 500; text-decoration: none; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* PDF */
.pane.pdf { overflow: hidden; }
.pdf-head { border-bottom: 1px solid var(--line); flex-direction: column; gap: 8px; }
.pdf-scroll { background: var(--sunken); padding: 16px; }
.cert-page { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(15,17,21,.08), 0 6px 16px -6px rgba(15,17,21,.14); border-radius: 2px; font-size: 9px; }
.cert-top { border-bottom: 1.5px solid var(--ink); }
.cert-top strong { font-size: 11px; }
.cert-top span { color: var(--ink-2); }
.cert-stamp { border: 1.5px solid var(--ink); color: var(--ink) !important; font-size: 8px; }
.cert-cap { color: var(--ink-2); font-size: 7px; }
.cert-table { border: 1px solid var(--line-strong); }
.cert-th { background: var(--sunken); font-weight: 600; }
.cert-row + .cert-row { border-top: 1px solid var(--line); }
.cert-bar { background: var(--sunken); }
.cert-water { color: var(--ink); opacity: .04; font-size: 52px; }
.cert-skel { background: #FBFBFC; box-shadow: none; }
.cert-page .is-linked { background: var(--select); box-shadow: 0 0 0 1.5px var(--select-edge); border-radius: 3px; }

/* Step panel (raised, sticky in the rail) */
.pane.step { position: sticky; top: 112px; z-index: 2; border-color: transparent; box-shadow: var(--shadow-raise); }
.step-head { padding: 18px 20px 0; }
.step-head .eyebrow { font-size: var(--fs-xs); font-weight: 500; color: var(--ink-2); }
.step-title { font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -.015em; }
.step-body { padding: 12px 20px 20px; gap: 14px; font-size: var(--fs-base); }
.step-body > p:first-child { color: var(--ink-2); }
.fine { font-size: var(--fs-xs); color: var(--ink-2); }
.quiet { color: var(--ink-2); }
.btn { height: 38px; padding: 0 16px; border-radius: var(--r-md); font-size: var(--fs-base); font-weight: 500; border: 1px solid transparent; }
.btn kbd { display: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 1px 2px rgba(15,17,21,.2), inset 0 1px 0 rgba(255,255,255,.08); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover:not(:disabled) { background: var(--hover); border-color: var(--ink); }
.btn-quiet { background: transparent; color: var(--link); height: 32px; padding: 0 10px; }
.btn-quiet:hover:not(:disabled) { background: var(--select); }
.btn:disabled:not(.is-busy) { background: var(--sunken); color: var(--ink-3); border-color: transparent; box-shadow: none; }
.btn.is-busy { background: var(--primary-hover); color: #fff; }
.btn-secondary.is-busy { background: var(--sunken); color: var(--ink); }
.btn-progress { background: rgba(255,255,255,.7); }
.btn-secondary .btn-progress { background: var(--ink); }
.actions .btn-primary { flex: 1 1 auto; }
.defs { gap: 10px; }
.defs li { padding: 10px 12px; border-radius: var(--r-md); background: var(--red-tint); font-size: var(--fs-sm); }
.defs .ic { color: var(--red); }
.def-fail { color: var(--red); font-weight: 600; }
.def-sub { font-size: var(--fs-xs); color: var(--ink-2); margin-top: 2px; }
.field-label { font-size: var(--fs-sm); font-weight: 500; margin-bottom: -8px; }
.field-label span { color: var(--ink-2); font-weight: 400; }
.field { border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); padding: 8px 10px; transition: border-color var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out); }
.field:hover { border-color: var(--ink-2); }
.field:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 4px rgba(51,88,212,.14); }
.field[aria-invalid="true"] { border-color: var(--ink); }
.refusal { padding: 12px; background: var(--sunken); border-radius: var(--r-md); font-size: var(--fs-sm); }
.refusal > span > span { color: var(--ink-2); font-size: var(--fs-xs); }
.disclose { border-top: 1px solid var(--line); padding-top: 12px; }
.disclose summary { font-size: var(--fs-sm); font-weight: 500; color: var(--link); }
.email { padding: 12px; background: var(--bg); border-radius: var(--r-md); font-size: var(--fs-sm); line-height: 20px; }

/* Values as a ledger */
.values .pane-head { padding-bottom: 4px; }
.conf { padding: 12px 20px 6px; }
.conf-label { font-size: var(--fs-sm); color: var(--ink-2); }
.conf-val { font-size: 22px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.conf-track { height: 4px; background: var(--sunken); border-radius: 999px; }
.conf-fill { background: var(--ink); border-radius: 999px; }
.conf[data-band="below"] .conf-fill { background: var(--amber); }
.conf-mark { background: var(--ink); width: 1.5px; top: -5px; bottom: -5px; }
.conf-mark span { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.conf-text { font-size: var(--fs-sm); color: var(--ink-2); }
.conf[data-band="below"] .conf-text strong { color: var(--amber); font-weight: 600; }
.summary { margin: 12px 20px 4px; font-size: var(--fs-sm); color: var(--t); display: flex; }
.summary strong { font-weight: 600; }
.lines { padding: 4px 8px 4px; }
.line { min-height: 50px; padding: 8px 12px; border-radius: var(--r-md); font-size: var(--fs-base); position: relative; transition: background-color var(--dur-1) var(--ease-out); }
.line:not(.line-head) + .line::before { content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 1px; background: var(--line); }
.line-head { min-height: 32px; font-size: var(--fs-xs); font-weight: 500; color: var(--ink-2); }
.line-head span:nth-child(2), .line-head span:nth-child(3) { text-align: right; }
.line-head span:nth-child(4) { justify-self: end; }
.line[data-k]:hover { background: var(--hover); }
.line.is-linked, .line:focus-visible { background: var(--select); outline: none; }
.line.is-linked::before, .line.is-linked + .line::before, .line:focus-visible::before, .line:focus-visible + .line::before { opacity: 0; }
.c-label > span:first-child { font-weight: 500; }
.line-sub { font-size: var(--fs-xs); color: var(--ink-2); line-height: 18px; }
.c-found .num, .c-req .num { font-size: var(--fs-md); letter-spacing: -.01em; }
.c-req { color: var(--ink-2); }
.line[data-result="fail"] .c-found { color: var(--red); font-weight: 600; }
.res { font-size: var(--fs-sm); font-weight: 500; color: var(--t); }
.res .ic { width: 14px; height: 14px; }
.cell-field { height: 34px; text-align: right; font-variant-numeric: tabular-nums; font-size: var(--fs-md); }
select.cell-field { text-align: left; }
.edit-note { font-size: var(--fs-xs); color: var(--ink-3); }
.edit-note.is-changed { color: var(--link); font-weight: 500; }
.line.is-changed { background: var(--select); }
.values > .trust { padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.line-skel { padding: 14px 12px; }

/* W-9 + timeline */
.w9 { padding: 14px 20px; }
.w9-text p { font-size: var(--fs-sm); color: var(--ink-2); }
.w9-text p .ic { color: var(--green); }
.w9-refused { font-size: var(--fs-xs); color: var(--ink-2); }
.tl { padding: 0 20px 18px; }
.tl-item { padding: 0 0 16px; gap: 12px; grid-template-columns: 22px minmax(0, 1fr); }
.tl-item:not(:last-child)::before { content: ""; position: absolute; left: 10.5px; top: 24px; bottom: 0; width: 1px; background: var(--line); }
.tl-mark { width: 22px; height: 22px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); }
.tl-item[data-kind="decision"] .tl-mark { background: var(--ink); color: #fff; box-shadow: none; }
.tl-item[data-kind="correction"] .tl-mark { background: var(--select); color: var(--link); box-shadow: none; }
.tl-meta { font-size: var(--fs-xs); color: var(--ink-2); }
.tl-who { font-weight: 500; color: var(--ink); }
.tl-who span { font-weight: 400; color: var(--ink-2); }
.tl-text { font-size: var(--fs-sm); line-height: 20px; }
.tl-change { font-size: var(--fs-sm); padding: 4px 8px; background: var(--bg); border-radius: var(--r-sm); align-self: flex-start; }
.tl-change .old { color: var(--ink-2); text-decoration: line-through; }
.tl-change .new { font-weight: 600; }
.tl-note { font-size: var(--fs-sm); color: var(--ink-2); }

/* Toast + sheet */
.toast { background: var(--ink); color: #fff; padding: 10px 10px 10px 14px; border-radius: var(--r-lg); box-shadow: var(--shadow-float); font-size: var(--fs-sm); }
.toast > .ic { color: #93D9AC; }
.toast-x { color: #A9AFBA; border-radius: 6px; }
.toast-x:hover { background: rgba(255,255,255,.12); color: #fff; }
.sheet { background: rgba(15,17,21,.32); backdrop-filter: blur(2px); }
.sheet-card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-float); padding: 18px 20px 8px; }
.sheet-head h2 { font-size: var(--fs-md); font-weight: 600; }
.sheet-close { border-radius: var(--r-sm); color: var(--ink-2); }
.sheet-close:hover { background: var(--sunken); }
.keys > div { padding: 10px 0; border-top: 1px solid var(--line); font-size: var(--fs-sm); }
.keys kbd { font-family: var(--font-id); font-size: 11px; line-height: 20px; min-width: 22px; text-align: center; padding: 0 5px; border-radius: 5px; background: var(--sunken); color: var(--ink); }

@media (max-width: 1320px) {
  :root { --cols: minmax(0, 5fr) minmax(0, 7fr); --areas: "pdf step" "pdf values" "pdf w9" "pdf timeline"; }
  .pane.step { position: static; }
}
@media (max-width: 1080px) { .pane.step { position: static; } }
@media (max-width: 860px) {
  .chrome { position: static; padding: 0 16px; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "demo demo" "brand sample" "nav nav"; }
  .demo { margin: 0 -16px; padding: 6px 16px !important; }
  .demo-reset { margin-left: 0; }
  .nav { overflow-x: auto; padding-bottom: 8px; }
  .fact { padding: 0 16px; }
}
</style>
</head>
<body>
<div id="app" class="app" data-chrome="bar"></div>
<script src="record-detail.js"></script>
<script>RecordDetail.mount({ kbdHints: false });</script>
</body>
</html>
