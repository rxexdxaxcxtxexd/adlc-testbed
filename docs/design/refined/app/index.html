    sample_id: 'SMP-' + pending.id, source: 'correction', certificate_id: pending.id,
    expected_json: JSON.stringify(values), corrected_by: who, note: String(note || '').trim(), time: time, active: true
  };
}

// Writes one sample. A newer correction of the same certificate replaces the older row.
// Call it inside the script lock. The tab is made if an older Sheet does not have it yet.
function upsertSample(store, row) {
  store.ensureTab('calibration_samples', SCHEMA.calibration_samples);
  var old = findRow(store.readRows('calibration_samples'), 'certificate_id', row.certificate_id);
  if (old) store.updateRow('calibration_samples', 'certificate_id', row.certificate_id, row);
  else store.appendRow('calibration_samples', row);
}

// Active sample rows, shaped like a manifest sample so compareToManifest checks them unchanged.
// A row counts only when active is TRUE; a person sets it to FALSE to drop a bad sample.
function correctionCalibrationEntries(rows) {
  return rows.filter(function (row) {
    return row.active === true || String(row.active).toLowerCase() === 'true';
  }).map(function (row) {
    var expected;
    try {
      expected = JSON.parse(row.expected_json);
    } catch (e) {
      throw new Error(row.sample_id + ': expected_json is not valid JSON. Fix it or set active to FALSE.');
    }
    return { file: row.certificate_id, problem: 'From correction', readable: true, expected: expected, link: row.pdf_link };
  });
}

// Jobs: load a record from the Store, run the compliance core, save the result,
// and hand effects to the Mailer and the Calendar. deps = { store, reader, mailer, clock, calendar, newToken }.

var STATUS_LABEL = {
  awaiting: 'Awaiting certificate', needs_review: 'Needs review', in_review: 'In review', compliant: 'Compliant',
  expiring_soon: 'Expiring soon', expired: 'Expired', closed: 'Closed'
};

function findRow(rows, column, value) {
  return rows.filter(function (r) { return r[column] === value; })[0] || null;
}

function certFromRow(row) {
  var limits = {};
  COI_LIMITS.forEach(function (f) { limits[f] = row[f + '_usd'] === '' ? null : row[f + '_usd']; });
  var values = row.check_result === '' && row.insured_name === '' ? null : {
    insured_name: row.insured_name, limits: limits,
    additional_insured_endorsement: row.additional_insured_endorsement === true,
    project_address: row.project_address === true, certificate_holder: row.certificate_holder === true,
    cancellation_notice_days: row.cancellation_notice_days === '' ? null : row.cancellation_notice_days,
    expiration_date: row.expiration_date
  };
  var cert = {
    id: row.certificate_id, fingerprint: row.file_fingerprint, received: row.received_date,
    confidence: row.confidence, values: values, expiration_date: row.expiration_date || null,
    replaces: row.replaces_certificate_id || null, decision: row.decision, outcome: row.outcome,
    decision_note: row.decision_note || '', calendar_event_id: row.calendar_event_id || ''
  };
  if (row.check_result) cert.check = { pass: row.check_result === 'pass', deficiencies: JSON.parse(row.deficiencies || '[]') };
  if (row.queue_stage) cert.stage = row.queue_stage;
  if (row.queue_reason) cert.reason = row.queue_reason;
  return cert;
}

function certToRow(cert, recordId) {
  var v = cert.values || { limits: {} };
  var row = {
    certificate_id: cert.id, record_id: recordId, received_date: cert.received, file_fingerprint: cert.fingerprint,
    queue_stage: cert.stage || '', queue_reason: cert.reason || '', confidence: cert.confidence,
    insured_name: v.insured_name || '', additional_insured_endorsement: v.additional_insured_endorsement === true,
    project_address: v.project_address === true, certificate_holder: v.certificate_holder === true,
    cancellation_notice_days: v.cancellation_notice_days == null ? '' : v.cancellation_notice_days,
    expiration_date: cert.expiration_date || '',
    check_result: cert.check ? (cert.check.pass ? 'pass' : 'fail') : '',
    deficiencies: JSON.stringify(cert.check ? cert.check.deficiencies : []),
    decision: cert.decision || '', replaces_certificate_id: cert.replaces || '', outcome: cert.outcome || '',
    decision_note: cert.decision_note || '', calendar_event_id: cert.calendar_event_id || ''
  };
  COI_LIMITS.forEach(function (f) { row[f + '_usd'] = v.limits[f] == null ? '' : v.limits[f]; });
  return row;
}

// Builds the core's record shape from the Sheet rows. Give today to load what the sub billed in the current
// pay cycle (the pay check needs it); without it billedThisCycle is 0.
function loadRecord(store, recRow, today) {
  var sub = findRow(store.readRows('subcontractors'), 'sub_id', recRow.sub_id);
  var certs = store.readRows('certificates')
    .filter(function (c) { return c.record_id === recRow.record_id; })
    .map(certFromRow);
  var byId = function (id) { return certs.filter(function (c) { return c.id === id; })[0] || null; };
  return {
    sub: { name: sub.name, email: sub.email, scope: sub.scope_of_work, w9: recRow.w9_on_file === true },
    closed: recRow.closed === true,
    current: byId(recRow.current_certificate_id),
    pending: byId(recRow.queued_certificate_id),
    history: certs.filter(function (c) { return c.id !== recRow.current_certificate_id && c.id !== recRow.queued_certificate_id; }),
    hold: { on: recRow.payment_hold === true, reasons: JSON.parse(recRow.payment_hold_reasons || '[]') },
    billedThisCycle: today ? billedInCycle(store, recRow.project_id, recRow.sub_id, currentPayCycle(store, today)) : 0,
    nudges: { d30: recRow.reminder_30d_sent === true, d7: recRow.reminder_7d_sent === true },
    log: [],
    status: recRow.status
  };
}

// Writes the core's new record back: certificate rows, the compliance record row, the activity log.
function saveRecord(store, recordId, record, now, pdfLink, eventType) {
  var existing = store.readRows('certificates').map(function (c) { return c.certificate_id; });
  [record.current, record.pending].concat(record.history).filter(Boolean).forEach(function (cert) {
    var row = certToRow(cert, recordId);
    if (existing.indexOf(cert.id) < 0) store.appendRow('certificates', Object.assign(row, { pdf_link: pdfLink }));
    else store.updateRow('certificates', 'certificate_id', cert.id, row);
  });
  store.updateRow('compliance_records', 'record_id', recordId, {
    status: record.status,
    current_certificate_id: record.current ? record.current.id : '',
    queued_certificate_id: record.pending ? record.pending.id : '',
    payment_hold: record.hold.on, payment_hold_reasons: JSON.stringify(record.hold.reasons),
    w9_on_file: record.sub.w9, reminder_30d_sent: record.nudges.d30, reminder_7d_sent: record.nudges.d7,
    closed: record.closed, last_updated: now
  });
  record.log.forEach(function (entry) {
    store.appendRow('activity_log', { record_id: recordId, time: now, who: entry.who, event_type: entry.notice || eventType || 'status_change', summary: entry.text });
  });
}

// Effects name a role; the project and subcontractor rows give the address.
// A draft is held for the accountant, never sent; the deficiency path (ticket 06) shows it.
function sendEffects(mailer, effects, project, record) {
  var to = {
    'Subcontractor': record.sub.email, 'Accountant': project.accountant_email,
    'Project manager': project.project_manager_email, 'Leadership': project.leadership_email
  };
  effects.filter(function (e) { return e.kind !== 'draft'; }).forEach(function (e) {
    mailer.send(to[e.to], 'Certificate of insurance: ' + record.sub.name, e.text);
  });
}

// Brings the calendar in line with the record after a save: the event of a replaced certificate goes,
// and a current certificate with no event gets one (docs/decisions.md, Phase 5). A calendar failure never
// undoes the save. It is logged, and the daily job tries again. Call outside the lock.
function applyCalendar(deps, recordId, project, record, changes) {
  changes.forEach(function (c) {
    try {
      if (c.action === 'delete') {
        deps.calendar.deleteEvent(c.eventId);
        return;
      }
      var eventId = deps.calendar.createAllDay('Policy expires: ' + record.sub.name + ' (' + project.name + ')', c.date);
      withScriptLock(function () {
        deps.store.updateRow('certificates', 'certificate_id', c.certificateId, { calendar_event_id: eventId });
      });
    } catch (err) {
      var message = String(err && err.message ? err.message : err);
      withScriptLock(function () {
        deps.store.appendRow('activity_log', {
          record_id: recordId, time: deps.clock.now(), who: 'System', event_type: 'calendar_failed',
          summary: 'The calendar event for ' + c.certificateId + ' could not be ' + (c.action === 'delete' ? 'removed' : 'created') + '. ' + message
        });
      });
    }
  });
}

// One certificate, start to finish. file = { name, fingerprint, link } plus, for the
// real Reader, blob (the PDF). The reading
// happens before the lock is taken, so a slow read never blocks other writers.
// A reading with usage came from a model call, so it writes one ai_calls row (Metering.gs), even when the save
// fails. A canned reading has no usage and writes none. A request that fails outright is not billed and writes none.
// A failed ai_calls write is logged and never undoes the save.
function processCertificate(deps, uploadToken, file) {
  var reading = deps.reader.read(file);
  var call = { purpose: 'read', outcome: reading.readable ? 'ok' : 'unreadable', outcome_reason: reading.reason || '' };
  function meter() {
    if (!reading.usage) return;
    try { recordAiCall(deps.store, deps.clock, deps.newToken, GEMINI_MODEL, reading.usage, call); }
    catch (err) { console.log('The ai_calls row was not written. ' + String(err && err.message ? err.message : err)); }
  }
  var result;
  try {
    result = withScriptLock(function () {
      var store = deps.store;
      var recRow = findRow(store.readRows('compliance_records'), 'upload_token', uploadToken);
      if (!recRow || recRow.closed === true) throw new Error('No open compliance record for this upload link.');
      var project = findRow(store.readRows('projects'), 'project_id', recRow.project_id);
      var record = loadRecord(store, recRow);
      var certId = nextId(store, 'certificates', 'certificate_id', 'CERT-');
      call.record_id = recRow.record_id;
      var event = {
        type: 'certificate_received',
        file: { id: certId, fingerprint: file.fingerprint, readable: reading.readable, confidence: reading.confidence, values: reading.values },
        recordLink: recordLinkFor(deps, recRow.record_id)
      };
      var out = nextStatus(record, event, deps.clock.today(), project.review_mode, TOLERANCE_MATRIX);
      if (out.refused) throw new Error(out.refused);
      saveRecord(store, recRow.record_id, out.record, deps.clock.now(), file.link);
      // A duplicate file adds no certificate, so its call names none.
      var kept = [out.record.current, out.record.pending].concat(out.record.history).filter(function (c) { return c && c.id === certId; });
      call.certificate_id = kept.length ? certId : '';
      return { recordId: recRow.record_id, project: project, record: out.record, effects: out.effects, calendar: calendarChanges(record, out.record) };
    });
  } catch (err) {
    call.outcome = 'error';
    call.outcome_reason = String(err && err.message ? err.message : err);
    meter();
    throw err;
  }
  meter();
  // A new deficiency: draft the notice and the correction request once, outside the lock (src/Draft.gs).
  var effects = withDeficiencyDraft(deps, result.recordId, result.record, result.effects, recordLinkFor(deps, result.recordId));
  sendEffects(deps.mailer, effects, result.project, result.record);
  applyCalendar(deps, result.recordId, result.project, result.record, result.calendar);
  var saved = result.record.pending || result.record.current;
  return { record_id: result.recordId, certificate_id: saved ? saved.id : '', status: result.record.status };
}

// One row per compliance record: subcontractor, status, expiry, last action.
function worklistRows(deps, projectId) {
  var store = deps.store;
  var today = deps.clock.today();
  var log = store.readRows('activity_log');
  var out = store.readRows('compliance_records')
    .filter(function (r) { return r.project_id === projectId; })
    .map(function (recRow) {
      var record = loadRecord(store, recRow);
      var entries = log.filter(function (a) { return a.record_id === recRow.record_id; });
      return {
        record_id: recRow.record_id,
        subcontractor: record.sub.name,
        status: STATUS_LABEL[deriveStatus(record, today)],
        expiry: record.current ? record.current.expiration_date : '',
        payment_hold: record.hold.on,
        hold_reasons: record.hold.reasons,
        last_updated: recRow.last_updated,
        last_action_who: entries.length ? entries[entries.length - 1].who : '',
        last_action_time: entries.length ? entries[entries.length - 1].time : '',
        last_action: entries.length ? entries[entries.length - 1].summary : '',
        waiting: waitingLabel(record),
        next: nextStep(record),
        deficiency_count: record.pending && record.pending.check ? record.pending.check.deficiencies.length : 0,
        sample: 'Sample data'
      };
    });
  // Records that need a person come first. Ties keep Sheet order.
  return out.map(function (row, i) { return { row: row, i: i }; })
    .sort(function (a, b) { return (!!b.row.waiting - !!a.row.waiting) || (a.i - b.i); })
    .map(function (x) { return x.row; });
}

// Compliance core: status and lifecycle. Pure: no Google services, no page code.
// Dates are ISO strings (YYYY-MM-DD) in the script time zone.

var MS_PER_DAY = 86400000;

function addDays(iso, n) {
  var d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

function daysUntil(from, to) {
  return Math.round((Date.parse(to + 'T00:00:00Z') - Date.parse(from + 'T00:00:00Z')) / MS_PER_DAY);
}

// Status is derived, never set by hand: it follows the current certificate, the queue and the date.
function deriveStatus(r, today) {
  if (r.closed) return 'closed';
  if (r.current) {
    var d = daysUntil(today, r.current.expiration_date);
    if (d < 0) return 'expired';
    if (d <= 30) return 'expiring_soon';
    return 'compliant';
  }
  if (r.pending) return r.pending.stage === 'needs_review' ? 'needs_review' : 'in_review';
  return 'awaiting';
}

var CONFIDENCE_GATE = 0.85;

// Expiring soon counts as compliant for payment hold (docs/decisions.md, Phase 1).
function isCompliantStatus(s) {
  return s === 'compliant' || s === 'expiring_soon';
}

var HOLD_REASON = {
  awaiting: 'No certificate received', needs_review: 'Certificate needs review',
  in_review: 'Certificate waiting for a decision', closed: 'Record closed'
};

function holdReasons(r, today) {
  var s = deriveStatus(r, today);
  var reasons = [];
  if (!isCompliantStatus(s)) {
    if (s === 'expired') reasons.push(r.pending ? 'Policy expired; renewal not yet approved' : 'Policy expired');
    else reasons.push(HOLD_REASON[s]);
  }
  if (!r.sub.w9) reasons.push('No W-9 on file');
  return reasons;
}

function newRecord(sub, billedThisCycle) {
  return {
    sub: sub, closed: false, current: null, pending: null, history: [], hold: { on: false, reasons: [] },
    billedThisCycle: billedThisCycle || 0, nudges: { d30: false, d7: false }, log: [], status: 'awaiting'
  };
}

// Seam: nextStatus(record, event, today, mode, matrix) returns { record, effects } or
// { record, effects: [], refused }. Effects are messages (to, kind, text); adapters send them.
function nextStatus(record, event, today, mode, matrix) {
  var r = JSON.parse(JSON.stringify(record));
  var effects = [];
  // notice is the event_type of a line that records a sent notice (NOTICE_TYPES in Notifications.gs).
  function log(who, text, notice) {
    var entry = { date: today, who: who, text: text };
    if (notice) entry.notice = notice;
    r.log.push(entry);
  }
  function send(to, kind, text) { effects.push({ to: to, kind: kind, text: text }); }
  function refuse(why) { return { record: record, effects: [], refused: why }; }
  function deficiencyText(cert) { return cert.check.deficiencies.map(function (d) { return d.text; }).join('; '); }

  var recordLink = event.recordLink || '';

  function accept(cert, how, note) {
    var renewal = !!r.current;
    if (r.current) r.history.push(Object.assign({}, r.current, { outcome: 'Replaced by ' + cert.id }));
    r.current = Object.assign({}, cert, { decision: how });
    if (note) r.current.decision_note = note;
    delete r.current.stage;
    delete r.current.reason;
    r.pending = null;
    r.nudges = { d30: false, d7: false };
    log('System', cert.id + ' accepted (' + how + '). Expires ' + cert.expiration_date + '.', renewal ? 'notice_renewal_accepted' : 'notice_certificate_approved');
    send('Subcontractor', 'email', 'Your certificate ' + cert.id + ' is approved.');
    send('Accountant', 'notice', r.sub.name + ': ' + cert.id + ' filed and approved (' + how + ').');
  }

  function route(cert) {
    cert.check = evaluateCoi(cert.values, r.sub.scope, matrix, { insuredName: r.sub.name });
    if (!cert.check.pass) {
      r.pending = Object.assign(cert, { stage: 'deficiency' });
      var count = cert.check.deficiencies.length;
      log('System', count + (count === 1 ? ' deficiency' : ' deficiencies') + ' found. Sent to the project manager.', 'notice_deficiency');
      send('Project manager', 'email', r.sub.name + ': ' + deficiencyText(cert) + '. Waive or reject?' + (recordLink ? ' Open the record: ' + recordLink : ''));
    } else if (mode === 'review_all') {
      r.pending = Object.assign(cert, { stage: 'approval' });
      log('System', 'Passed every check. Ready for approval.');
    } else {
      accept(cert, mode === 'automatic' ? 'approved automatically (automatic mode)' : 'approved automatically');
    }
  }

  switch (event.type) {
    case 'certificate_received': {
      if (r.closed) return refuse('This record is closed. The upload is refused.');
      var f = event.file;
      var all = [r.current, r.pending].concat(r.history).filter(Boolean);
      if (all.some(function (c) { return c.fingerprint === f.fingerprint; })) {
        log('System', 'Duplicate file received and ignored. Nothing changed.', 'notice_duplicate');
        send('Subcontractor', 'notice', 'We already have this certificate. No action needed.');
        break;
      }
      if (r.pending) {
        r.history.push(Object.assign({}, r.pending, { outcome: 'Replaced in the queue by a newer upload' }));
        log('System', r.pending.id + ' was still in the queue; the newer upload replaces it.');
        r.pending = null;
      }
      var cert = {
        id: f.id, fingerprint: f.fingerprint, received: today, values: f.values, confidence: f.confidence,
        expiration_date: f.values ? f.values.expiration_date : null, replaces: r.current ? r.current.id : null
      };
      if (!f.readable) {
        r.pending = Object.assign(cert, { stage: 'needs_review', reason: 'Unreadable file' });
        log('System', 'Unreadable file. Sent to the accountant queue.');
        send('Accountant', 'draft', 'Draft for the subcontractor, held for you: "Please resend your certificate as a standard PDF."');
        break;
      }
      if (f.confidence < CONFIDENCE_GATE) {
        r.pending = Object.assign(cert, { stage: 'needs_review', reason: 'Low-confidence reading (' + f.confidence.toFixed(2) + ', below ' + CONFIDENCE_GATE + ')' });
        log('System', 'Reading confidence ' + f.confidence.toFixed(2) + ' is below ' + CONFIDENCE_GATE + '. Sent to the accountant queue.');
        break;
      }
      route(cert);
      break;
    }
    case 'reading_confirmed': {
      if (!r.pending || !r.pending.values || r.pending.reason === 'Unreadable file') {
        return refuse('There is no readable certificate waiting to be checked.');
      }
      var correctionNote = String(event.note || '').trim();
      if (!correctionNote) return refuse('A correction needs a note. Write what you changed and why.');
      var who = event.who || 'Accountant';
      var corrected = Object.assign({}, r.pending, { values: event.values, confidence: 1, expiration_date: event.values.expiration_date, confirmedBy: who });
      delete corrected.stage;
      delete corrected.reason;
      var changes = correctionChanges(r.pending.values || { limits: {} }, event.values);
      if (!changes.length) log(who, 'Confirmed the reading of ' + corrected.id + ' with no changes. Note: ' + correctionNote);
      changes.forEach(function (c, i) {
        var line = c + ' on ' + corrected.id + '. Note: ' + correctionNote;
        // The caller wrote this correction to the calibration test set (src/Flywheel.gs).
        if (event.addedToTestSet && i === changes.length - 1) line += (/[.!?]$/.test(line) ? ' ' : '. ') + 'Added to the test set.';
        log(who, line);
      });
      r.pending = null;
      route(corrected);
      break;
    }
    case 'resend_requested': {
      if (!r.pending || r.pending.reason !== 'Unreadable file') return refuse('There is no unreadable file waiting.');
      r.history.push(Object.assign({}, r.pending, { outcome: 'Unreadable; resend requested' }));
      r.pending = null;
      log(event.who || 'Accountant', 'Asked the subcontractor to resend.', 'notice_resend_request');
      send('Subcontractor', 'email', resendText(event.uploadLink));
      break;
    }
    case 'approve': {
      if (!r.pending || r.pending.stage !== 'approval') {
        return refuse('Nothing is waiting for approval. A deficiency needs a waive or reject from the project manager instead.');
      }
      log(event.who || 'Accountant', 'Approved ' + r.pending.id + '.');
      accept(r.pending, 'approved by the accountant');
      break;
    }
    case 'waive': {
      if (!r.pending || r.pending.stage !== 'deficiency') return refuse('There is no deficiency waiting for a decision.');
      var note = String(event.note || '').trim();
      if (!note) return refuse('A waiver needs a note. Write why this deficiency is acceptable.');
      log(event.who || 'Project manager', 'Waived: ' + deficiencyText(r.pending) + '. Note: ' + note);
      accept(r.pending, 'waived by the project manager', note);
      break;
    }
    case 'reject': {
      if (!r.pending || r.pending.stage !== 'deficiency') return refuse('There is no deficiency waiting for a decision.');
      r.history.push(Object.assign({}, r.pending, { outcome: 'Rejected' }));
      log(event.who || 'Project manager', 'Rejected ' + r.pending.id + '. Correction request sent.', 'notice_correction_request');
      send('Subcontractor', 'email', correctionText(r.pending.check.deficiencies, event.uploadLink));
      r.pending = null;
      break;
    }
    case 'day_passed': {
      if (r.closed) break;
      if (r.current && !r.pending) {
        var d = daysUntil(today, r.current.expiration_date);
        var renewalLink = event.uploadLink ? ' Upload your renewal here: ' + event.uploadLink : '';
        // One reminder a day at most (docs/decisions.md, Phase 5): inside 7 days only the follow-up goes,
        // and the 30-day reminder counts as sent.
        if (d >= 0 && d <= 7 && !r.nudges.d7) {
          r.nudges = { d30: true, d7: true };
          send('Subcontractor', 'email', 'Reminder: your policy expires ' + r.current.expiration_date + '.' + renewalLink);
          log('System', '7-day follow-up sent.', 'notice_reminder_7d');
        } else if (d >= 0 && d <= 30 && !r.nudges.d30) {
          r.nudges.d30 = true;
          send('Subcontractor', 'email', 'Your policy expires ' + r.current.expiration_date + '. Please send your renewal.' + renewalLink);
          log('System', '30-day renewal reminder sent.', 'notice_reminder_30d');
        }
      }
      // Compared with the stored status, so a day the job missed still logs the expiry.
      if (record.status !== 'expired' && deriveStatus(r, today) === 'expired') log('System', 'Policy expired.');
      break;
    }
    case 'pay_check': {
      if (r.closed) break;
      // Only a change is logged and mailed, so the daily job does not repeat itself (docs/decisions.md, Phase 5).
      if (!r.billedThisCycle) {
        if (r.hold.on) {
          r.hold = { on: false, reasons: [] };
          log('System', 'Payment hold cleared: no bill this cycle.');
        }
        break;
      }
      var reasons = holdReasons(r, today);
      if (reasons.length && !r.hold.on) {
        r.hold = { on: true, reasons: reasons };
        log('System', 'Pay check: on payment hold (' + reasons.join('; ') + ').', 'notice_payment_hold');
        send('Accountant', 'report', 'Payment hold list: ' + r.sub.name + ', ' + formatUsd(r.billedThisCycle) + '. ' + reasons.join('; ') + '.');
      }
      break;
    }
    case 'w9_set': {
      var wantW9 = !!event.onFile;
      if (r.sub.w9 === wantW9) return refuse('The W-9 is already marked ' + (wantW9 ? 'on file' : 'missing') + '.');
      r.sub.w9 = wantW9;
      log(event.who || 'Accountant', wantW9 ? 'Marked W-9 on file.' : 'Marked W-9 missing.');
      break;
    }
    case 'close': {
      if (r.closed) return refuse('This record is already closed.');
      if (r.pending) return refuse('A certificate is waiting in the queue. Decide it first, then close the record.');
      r.closed = true;
      log('Accountant', 'Closed the record. Tracking stops; history is kept for audit.');
      break;
    }
    default:
      return refuse('Unknown action.');
  }

  // A payment hold releases itself once its reasons are gone.
  if (r.hold.on) {
    var still = holdReasons(r, today);
    if (!still.length) {
      r.hold = { on: false, reasons: [] };
      log('System', 'Payment hold released.', 'notice_payment_cleared');
      send('Accountant', 'notice', r.sub.name + ' is cleared for payment.');
    } else {
      r.hold.reasons = still;
    }
  }
  r.status = deriveStatus(r, today);
  return { record: r, effects: effects };
}

// The calendar work a change of current certificate needs. Pure. A new current certificate gets an
// event, the replaced one loses its event, and a current certificate that has none yet gets one
// (this is how the daily job fills a gap). Each change is { action, certificateId, eventId or date }.
function calendarChanges(before, after) {
  var changes = [];
  var was = before.current;
  var now = after.current;
  if (was && (!now || was.id !== now.id) && was.calendar_event_id) {
    changes.push({ action: 'delete', certificateId: was.id, eventId: was.calendar_event_id });
  }
  if (now && !now.calendar_event_id) {
    changes.push({ action: 'create', certificateId: now.id, date: now.expiration_date });
  }
  return changes;
}

// The email a subcontractor gets when a file could not be read. link is optional.
function resendText(link) {
  return 'Please resend your certificate as a standard PDF.' + (link ? ' Upload it here: ' + link : '');
}

// The email a subcontractor gets when the project manager rejects a certificate: every
// deficiency with the value found and the value required. link is optional.
function correctionText(deficiencies, link) {
  return 'Your certificate does not meet the project requirements. Please send a corrected certificate.\n' +
    deficiencies.map(function (d) { return '- ' + d.text; }).join('\n') +
    (link ? '\nUpload it here: ' + link : '');
}

var CORRECTION_LABEL ={ insured_name: 'Insured name', expiration_date: 'Expiry date' };
var CORRECTION_BOOLEANS = ['additional_insured_endorsement', 'project_address', 'certificate_holder'];

// What an accountant changed in a reading, as one text per changed value, old to new.
// Pure. Unchanged values give no text.
function correctionChanges(before, after) {
  var changes = [];
  function note(label, from, to) {
    if (from !== to) changes.push('Changed ' + label + ' from ' + from + ' to ' + to);
  }
  var money = function (n) { return n == null ? 'Not shown' : formatUsd(n); };
  var printed = function (b) { return b === true ? 'Printed' : 'Not printed'; };
  note(CORRECTION_LABEL.insured_name, before.insured_name || 'Not shown', after.insured_name || 'Not shown');
  COI_LIMITS.forEach(function (f) { note(COI_LABEL[f], money((before.limits || {})[f]), money((after.limits || {})[f])); });
  CORRECTION_BOOLEANS.forEach(function (f) { note(COI_LABEL[f], printed(before[f]), printed(after[f])); });
  var days = function (n) { return n == null ? 'Not shown' : n + ' days'; };
  note(COI_LABEL.cancellation_notice_days, days(before.cancellation_notice_days), days(after.cancellation_notice_days));
  note(CORRECTION_LABEL.expiration_date, before.expiration_date || 'Not shown', after.expiration_date || 'Not shown');
  return changes;
}

var TILE_WORD = { red: 'At risk', yellow: 'Watch', green: 'On track' };

// Seam: projectTile(records, today). Counts and colors follow docs/metric-definitions.md;
// colors are evaluated red, then yellow, then green.
function projectTile(records, today) {
  var open = records.filter(function (r) { return !r.closed; });
  var st = open.map(function (r) { return deriveStatus(r, today); });
  var held = open.filter(function (r) { return r.hold && r.hold.on; });
  var count = function (pred) { return open.filter(pred).length; };
  var t = {
    expected_count: open.length,
    compliant_count: count(function (r, i) { return isCompliantStatus(st[i]); }),
    expired_count: count(function (r, i) { return st[i] === 'expired'; }),
    expiring_30d_count: count(function (r, i) { return st[i] === 'expiring_soon' && !r.pending; }),
    // The latest certificate is the one in the queue; an accepted one has no open limit deficiency.
    below_limits_count: count(function (r) {
      return !!(r.pending && r.pending.check && r.pending.check.deficiencies.some(function (d) { return d.kind === 'limit'; }));
    }),
    dollars_on_hold_usd: held.reduce(function (sum, r) { return sum + (r.billedThisCycle || 0); }, 0)
  };
  var waiting = count(function (r, i) { return st[i] === 'awaiting' || !!r.pending; });
  var color;
  if (t.expired_count > 0 || held.length > 0) color = 'red';
  else if (t.expiring_30d_count > 0 || waiting > 0) color = 'yellow';
  else if (t.compliant_count === t.expected_count) color = 'green';
  else color = 'yellow';
  return Object.assign({ color: color, word: TILE_WORD[color] }, t);
}

// Every ID generation and Sheet write runs inside the script lock.
var LOCK_WAIT_MS = 10000;

function withScriptLock(work) {
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(LOCK_WAIT_MS)) throw new Error('Another run is saving changes. Try again in a moment.');
  try {
    return work();
  } finally {
    lock.releaseLock();
  }
}

// Next ID in a tab, such as CERT-004 after CERT-003. Call only inside withScriptLock.
function nextId(store, tab, column, prefix) {
  var max = store.readRows(tab).reduce(function (m, row) {
    var n = parseInt(String(row[column]).replace(prefix, ''), 10);
    return isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return prefix + ('00' + (max + 1)).slice(-3);
}

// Metering: one ai_calls row per model call (docs/decisions.md, Phase 6). Code counts the tokens and the cost.

// usage = Gemini usageMetadata. Returns the call row without time and IDs. Pure.
// Thinking tokens bill at the output rate. A model with no MODEL_PRICES row gives cost_usd null, never 0.
function meterCall(model, usage, purpose) {
  var u = usage || {};
  var price = MODEL_PRICES[model];
  var input = u.promptTokenCount || 0;
  var output = u.candidatesTokenCount || 0;
  var thinking = u.thoughtsTokenCount || 0;
  return {
    purpose: purpose, model: model,
    input_tokens: input, output_tokens: output, thinking_tokens: thinking,
    cost_usd: price ? (input * price.input_per_m + (output + thinking) * price.output_per_m) / 1e6 : null
  };
}

// Appends one ai_calls row and returns its call_id. newId() gives the ID (Utilities.getUuid in production).
// meta = { purpose, record_id, certificate_id, outcome, outcome_reason }. Share Proj writes nothing and returns ''.
// Takes the script lock, so call it outside withScriptLock.
function recordAiCall(store, clock, newId, model, usage, meta) {
  if (isDemoMode()) return '';
  var m = meta || {};
  var call = meterCall(model, usage, m.purpose);
  return withScriptLock(function () {
    var callId = newId();
    store.appendRow('ai_calls', {
      call_id: callId, time: clock.now(), purpose: call.purpose, model: call.model,
      record_id: m.record_id || '', certificate_id: m.certificate_id || '',
      input_tokens: call.input_tokens, output_tokens: call.output_tokens, thinking_tokens: call.thinking_tokens,
      cost_usd: call.cost_usd === null ? '' : call.cost_usd,
      outcome: m.outcome || '', outcome_reason: m.outcome_reason || ''
    });
    return callId;
  });
}

// Notification log (ticket 19). A read-only view of the emails the workflow sends, and of the planned ones it does not send yet.
// The rule (docs/decisions.md, Phase 5): the log reports what the code does. A notice the code sends shows as sent or
// waiting. A planned notice the code does not send shows as "Not sent" and its trigger says it is not built.
// Nothing here sends anything. notificationLog reads rows through deps.store and calls no mail, Drive,
// Calendar or model service. Names for events are the glossary names (GLOSSARY.md, Notifications).

// Notices the code logs, one activity_log event_type each (docs/decisions.md, Phase 5). saveRecord writes the
// type when nextStatus marks a log line with it. The old catch-all types are in LEGACY_NOTICE_TYPES.
var NOTICE_TYPES = {
  notice_deficiency: { event: 'Deficiency found', to_role: 'Project manager' },
  notice_resend_request: { event: 'Resend request', to_role: 'Subcontractor contact' },
  notice_correction_request: { event: 'Correction request', to_role: 'Subcontractor contact' },
  notice_reminder_30d: { event: 'Expiring in 30 days', to_role: 'Subcontractor contact' },
  notice_reminder_7d: { event: 'Expiring in 7 days', to_role: 'Subcontractor contact' },
  notice_payment_hold: { event: 'Payment hold notice', to_role: 'Accountant' },
  notice_certificate_approved: { event: 'Certificate approved', to_role: 'Subcontractor contact' },
  notice_renewal_accepted: { event: 'Renewal accepted', to_role: 'Subcontractor contact' },
  notice_duplicate: { event: 'Duplicate notice', to_role: 'Subcontractor contact' },
  notice_payment_cleared: { event: 'Cleared for payment notice', to_role: 'Accountant' }
};

// The notices that go to a subcontractor or the project manager. The directory's last notification reads these.
var DIRECTORY_NOTICE_TYPES = ['notice_deficiency', 'notice_resend_request', 'notice_correction_request',
  'notice_reminder_30d', 'notice_reminder_7d', 'notice_certificate_approved', 'notice_renewal_accepted', 'notice_duplicate'];

// Before ticket 19 a notice was logged under whatever type the action had, and the summary was the only clue.
// The live Sheet still holds those rows.
var LEGACY_NOTICE_TYPES = ['status_change', 'certificate_received', 'reading_confirmed', 'resend_requested', 'reject', 'pay_check'];
var LEGACY_NOTICE_SUMMARIES = [
  { type: 'notice_reminder_30d', pattern: /30-day renewal reminder sent\./ },
  { type: 'notice_reminder_7d', pattern: /7-day follow-up sent\./ },
  { type: 'notice_resend_request', pattern: /Asked the subcontractor to resend\./ },
  { type: 'notice_correction_request', pattern: /Correction request sent\./ },
  { type: 'notice_deficiency', pattern: /Sent to the project manager\./ },
  { type: 'notice_payment_hold', pattern: /Pay check: on payment hold/ }
];

// The notice type of an activity-log row, or '' when the row is not a notice.
function noticeTypeOf(entry) {
  if (NOTICE_TYPES[entry.event_type]) return entry.event_type;
  if (LEGACY_NOTICE_TYPES.indexOf(entry.event_type) < 0) return '';
  var hit = LEGACY_NOTICE_SUMMARIES.filter(function (s) { return s.pattern.test(entry.summary); })[0];
  return hit ? hit.type : '';
}

var DIGEST_EVENT = 'COI Sub-Contract Payment Holds - Digest';

// Glossary names, in the order the screen lists them.
var NOTIFICATION_EVENTS = ['Certificate received', 'Deficiency found', 'Low-confidence reading', 'Expiring in 30 days',
  'Expiring in 7 days', 'Payment hold notice', 'Renewal accepted', DIGEST_EVENT, 'Upload link', 'Resend request',
  'Correction request', 'Certificate approved', 'Duplicate notice', 'Cleared for payment notice'];

// The event_type of a log row: one per event, whether the row comes from the activity log or from record state.
var EVENT_TYPE = {
  'Certificate received': 'certificate_received', 'Deficiency found': 'deficiency_found', 'Low-confidence reading': 'low_confidence_reading',
  'Expiring in 30 days': 'expiring_30d', 'Expiring in 7 days': 'expiring_7d', 'Payment hold notice': 'payment_hold_notice',
  'Renewal accepted': 'renewal_accepted', 'COI Sub-Contract Payment Holds - Digest': 'payment_holds_digest',
  'Upload link': 'upload_link', 'Resend request': 'resend_request', 'Correction request': 'correction_request',
  'Certificate approved': 'certificate_approved', 'Duplicate notice': 'duplicate_notice', 'Cleared for payment notice': 'cleared_for_payment_notice'
};

// The approval values a row can carry. Each one is true of what the code does.
//   'Internal, no approval'   Goes to staff. The code sends it with no person in the loop.
//   'Person approves'         A person acts first. A draft waits for that person (status "Waiting for approval").
//                             approved_by names the person only when the activity log records that person's action.
//   'Automatic (daily job)'   The daily job sends it. No person is in the loop.
//   'Automatic (review mode)' The code sends it on its own because the project's review mode lets the certificate through.
//   'Automatic (on upload)'   The upload job sends it on its own when a file arrives.
//   'Not built yet'           A planned notice. The code does not send it (status "Not sent").
var APPROVAL_INTERNAL = 'Internal, no approval';
var APPROVAL_PERSON = 'Person approves';
var APPROVAL_DAILY = 'Automatic (daily job)';
var APPROVAL_REVIEW_MODE = 'Automatic (review mode)';
var APPROVAL_UPLOAD = 'Automatic (on upload)';
var APPROVAL_NOT_BUILT = 'Not built yet';
var PLANNED = 'Planned, not built. ';

var NOTIFICATION_BANNER = 'Preview. These emails are drafted for review.';
var NOTIFICATION_FOOTER = '\n\nHarborline Builders compliance team';
var SAMPLE_UPLOAD_LINK = 'https://example.com/upload?t=sample-link';
var SAMPLE_RECORD_LINK = 'https://example.com/coi?as=project_manager&record=';
var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// 'Oct 8, 2026' from '2026-10-08'.
function dateLabel(iso) {
  var p = String(iso).slice(0, 10).split('-');
  return MONTH_NAMES[parseInt(p[1], 10) - 1] + ' ' + parseInt(p[2], 10) + ', ' + p[0];
}

// The latest Thursday on or before the date. The planned digest would go out on Thursday at 6:00 AM.
function latestThursday(iso) {
  var dow = new Date(iso + 'T00:00:00Z').getUTCDay();
  return addDays(iso, -((dow - 4 + 7) % 7));
}

function firstName(full) {
  return String(full || '').split(' ')[0];
}

// The newest certificate with a check result, for the gaps shown in an email.
function certificateWithGaps(model) {
  var all = [model.pending, model.current].concat(model.history.slice().reverse()).filter(Boolean);
  return all.filter(function (c) { return c.check && c.check.deficiencies.length; })[0] || null;
}

function gapLines(cert) {
  return cert ? cert.check.deficiencies.map(function (d) { return '- ' + d.text; }).join('\n') : '';
}

// The stored draft for a notice, read from the ai_drafts rows. Returns { by, draft }: by is the label
// (AI only when the stored wording passes the check again; otherwise Template) and draft is the wording, or null.
function storedNotice(rows, cert, kind) {
  if (!cert) return { by: 'Template', draft: null };
  var found = draftFromRows(rows, cert.id, kind);
  if (!found) return { by: 'Template', draft: null };
  var draft = usableDraft(found, cert.check.deficiencies);
  return { by: draft ? 'AI' : 'Template', draft: draft };
}

// deps = { store, clock }. Returns the log described in docs/design/round-4-demo-polish-brief.md, section 7.
function notificationLog(deps) {
  var store = deps.store;
  var today = deps.clock.today();
  var projects = store.readRows('projects');
  var subs = store.readRows('subcontractors');
  var records = store.readRows('compliance_records');
  var log = store.readRows('activity_log');
  var drafts = draftRows(store);
  var cycle = currentPayCycle(store, today);
  var out = [];

  var staged = [];
  log.forEach(function (a) {
    var type = noticeTypeOf(a);
    if (type) staged.push({ entry: a, type: type });
  });
  function hasLogged(recordId, type) {
    return staged.some(function (s) { return s.entry.record_id === recordId && s.type === type; });
  }

  // The person an activity-log row names, or '' when the row is by the system or has no role.
  function personOf(who) {
    return /\((Accountant|Project manager|Leadership)\)$/.test(who) ? who : '';
  }
  // The person whose approve or waive action the log holds for a record, before the row at index.
  function approverBefore(recordId, index) {
    for (var i = Math.min(index, log.length) - 1; i >= 0; i--) {
      if (log[i].record_id === recordId && /^(Approved |Waived:)/.test(log[i].summary) && personOf(log[i].who)) return log[i].who;
    }
    return '';
  }

  function add(ctx, e) {
    var staff = ctx.staff;
    var toRole = e.to_role;
    var to = { name: '', email: '' };
    if (toRole === 'Subcontractor contact') to = { name: ctx.sub.contact_name, email: ctx.sub.email };
    else if (toRole === 'Project manager') to = { name: staff.project_manager_name, email: staff.project_manager_email };
    else if (toRole === 'Accountant') to = { name: staff.accountant_name, email: staff.accountant_email };
    else if (toRole === 'Leadership') to = { name: staff.leadership_name, email: staff.leadership_email };
    var approval = e.approval;
    var status = e.status;
    // A person is named only when the activity log records that person's action.
    var approvedBy = approval === APPROVAL_PERSON && status === 'Sent' ? (e.approved_by || '') : '';
    var body = 'Hello ' + firstName(to.name) + ',\n\n' + e.message + NOTIFICATION_FOOTER;
    out.push({
      id: '', event_type: EVENT_TYPE[e.event], event: e.event, trigger: e.trigger, time: e.time,
      project_id: staff.project_id, project: staff.name, record_id: ctx.record_id, sub_name: ctx.sub.name,
      to_role: toRole, to_name: to.name, to_email: to.email,
      drafted_by: e.drafted_by || 'Template', approval: approval, approved_by: approvedBy, status: status,
      subject: e.subject, body: body
    });
  }

  records.forEach(function (row) {
    var staff = projects.filter(function (p) { return p.project_id === row.project_id; })[0];
    var sub = subs.filter(function (s) { return s.sub_id === row.sub_id; })[0];
    if (!staff || !sub) return;
    var model = loadRecord(store, row, today);
    var status = deriveStatus(model, today);
    var ctx = { staff: staff, sub: sub, record_id: row.record_id };
    var drafted = String(row.last_updated || today + 'T00:00:00');
    var subject = 'Certificate of insurance: ' + sub.name;
    var where = sub.name + ', ' + staff.name;
    var shown = model.pending || model.current;
    var certId = shown ? shown.id : '';
    var gaps = certificateWithGaps(model);

    // Notices the activity log holds. Each one is an email the code sent, or a draft a person must send.
    staged.filter(function (s) { return s.entry.record_id === row.record_id; }).forEach(function (s) {
      var a = s.entry;
      var meta = NOTICE_TYPES[s.type];
      var common = { event: meta.event, to_role: meta.to_role, time: String(a.time), status: 'Sent' };
      var person = personOf(a.who);
      if (s.type === 'notice_deficiency') {
        var count = (/^(\d+) deficienc/.exec(a.summary) || [])[1];
        var pmDraft = storedNotice(drafts, gaps, 'deficiency_notice');
        add(ctx, Object.assign(common, {
          trigger: (count ? count + (count === '1' ? ' deficiency' : ' deficiencies') : 'Deficiencies') + ' found on ' + (gaps ? gaps.id : certId),
          drafted_by: pmDraft.by, approval: APPROVAL_INTERNAL, subject: 'Decision needed: ' + where,
          message: pmDraft.draft ? assembleDeficiencyNotice(sub.name, gaps.check.deficiencies, pmDraft.draft, SAMPLE_RECORD_LINK + row.record_id)
            : sub.name + ' has gaps against the project requirements.\n' + gapLines(gaps) + '\n\nWaive or reject? Open the record: ' + SAMPLE_RECORD_LINK + row.record_id
        }));
      } else if (s.type === 'notice_resend_request') {
        add(ctx, Object.assign(common, { trigger: 'Unreadable file', approval: APPROVAL_PERSON, approved_by: person, subject: subject,
          message: resendText(SAMPLE_UPLOAD_LINK) }));
      } else if (s.type === 'notice_correction_request') {
        var fixDraft = storedNotice(drafts, gaps, 'correction_request');
        add(ctx, Object.assign(common, { trigger: 'Rejected by the project manager', drafted_by: fixDraft.by, approval: APPROVAL_PERSON, approved_by: person, subject: subject,
          message: !gaps ? correctionText([], SAMPLE_UPLOAD_LINK)
            : fixDraft.draft ? assembleCorrectionRequest(gaps.check.deficiencies, fixDraft.draft, SAMPLE_UPLOAD_LINK)
            : correctionText(gaps.check.deficiencies, SAMPLE_UPLOAD_LINK) }));
      } else if (s.type === 'notice_reminder_30d' || s.type === 'notice_reminder_7d') {
        var is7 = s.type === 'notice_reminder_7d';
        var expiry = model.current ? model.current.expiration_date : '';
        add(ctx, Object.assign(common, { trigger: is7 ? 'Policy expires within 7 days' : 'Policy expires within 30 days', approval: APPROVAL_DAILY, subject: subject,
          message: (is7 ? 'Reminder: your policy expires ' : 'Your policy expires ') + (expiry ? dateLabel(expiry) : 'soon') +
            (is7 ? '.' : '. Please send your renewal.') + ' Upload your renewal here: ' + SAMPLE_UPLOAD_LINK }));
      } else if (s.type === 'notice_certificate_approved' || s.type === 'notice_renewal_accepted') {
        var renewed = s.type === 'notice_renewal_accepted';
        var acceptedId = (/^(\S+) accepted/.exec(a.summary) || [])[1] || certId;
        var byPerson = /approved by the accountant|waived by the project manager/.test(a.summary);
        var approver = byPerson ? approverBefore(row.record_id, log.indexOf(a)) : '';
        add(ctx, Object.assign(common, {
          trigger: (renewed ? 'Renewal ' : 'Certificate ') + acceptedId + ' accepted',
          approval: byPerson ? APPROVAL_PERSON : APPROVAL_REVIEW_MODE, approved_by: approver, subject: subject,
          message: renewed ? 'Your renewal ' + acceptedId + ' is approved. It expires ' + (model.current ? dateLabel(model.current.expiration_date) : 'later') + '.'
            : 'Your certificate ' + acceptedId + ' is approved.' }));
      } else if (s.type === 'notice_duplicate') {
        add(ctx, Object.assign(common, { trigger: 'The same file arrived twice', approval: APPROVAL_UPLOAD, subject: subject,
          message: 'We already have this certificate. No action needed.' }));
      } else if (s.type === 'notice_payment_cleared') {
        add(ctx, Object.assign(common, { trigger: 'Every payment hold reason is gone', approval: APPROVAL_INTERNAL, subject: 'Cleared for payment: ' + where,
          message: sub.name + ' is cleared for payment.' }));
      } else {
        var billed = billedInCycle(store, row.project_id, row.sub_id, cycle);
        var reasons = (/\((.*)\)\.$/.exec(a.summary) || [])[1] || model.hold.reasons.join('; ');
        add(ctx, Object.assign(common, { trigger: 'Pay check: ' + reasons, approval: APPROVAL_INTERNAL, subject: 'Payment hold: ' + where,
          message: sub.name + ' is on payment hold. ' + reasons + '.' + (billed ? ' Billed this pay cycle: ' + formatUsd(billed) + '.' : '') }));
      }
    });

    // Entries the record's state gives when the log holds no notice for them. A notice the code does not send is
    // "Not sent", with the design kept as a preview.
    var notBuilt = { status: 'Not sent', approval: APPROVAL_NOT_BUILT };
    if (model.pending) {
      add(ctx, Object.assign({ event: 'Certificate received', to_role: 'Subcontractor contact', time: drafted,
        trigger: PLANNED + 'Would send when a certificate is uploaded', subject: subject,
        message: 'We received your certificate ' + model.pending.id + ' for ' + staff.name + '. We are checking it now. You do not need to do anything yet.' }, notBuilt));
    }
    if (model.pending && model.pending.stage === 'deficiency') {
      var found = model.pending.check.deficiencies.length + (model.pending.check.deficiencies.length === 1 ? ' deficiency' : ' deficiencies') + ' found on ' + model.pending.id;
      var pendingPm = storedNotice(drafts, model.pending, 'deficiency_notice');
      var pendingFix = aiDraftsOn() ? storedNotice(drafts, model.pending, 'correction_request') : { by: 'Template', draft: null };
      if (!hasLogged(row.record_id, 'notice_deficiency')) {
        add(ctx, { event: 'Deficiency found', to_role: 'Project manager', time: drafted, status: 'Sent', drafted_by: pendingPm.by, approval: APPROVAL_INTERNAL,
          trigger: found, subject: 'Decision needed: ' + where,
          message: pendingPm.draft ? assembleDeficiencyNotice(sub.name, model.pending.check.deficiencies, pendingPm.draft, SAMPLE_RECORD_LINK + row.record_id)
            : sub.name + ' has gaps against the project requirements.\n' + gapLines(model.pending) + '\n\nWaive or reject? Open the record: ' + SAMPLE_RECORD_LINK + row.record_id });
      }
      add(ctx, Object.assign({ event: 'Deficiency found', to_role: 'Subcontractor contact', time: drafted, drafted_by: 'Template',
        trigger: PLANNED + 'Would send with the project manager copy. ' + found,
        subject: subject,
        message: 'We checked certificate ' + model.pending.id + ' against the project requirements. The project manager is deciding what happens next. You do not need to do anything yet.\n' + gapLines(model.pending) }, notBuilt));
      add(ctx, { event: 'Correction request', to_role: 'Subcontractor contact', time: drafted, drafted_by: pendingFix.by, approval: APPROVAL_PERSON,
        status: 'Not sent', trigger: 'Sent only if the project manager rejects the certificate', subject: subject,
        message: pendingFix.draft ? assembleCorrectionRequest(model.pending.check.deficiencies, pendingFix.draft, SAMPLE_UPLOAD_LINK)
          : correctionText(model.pending.check.deficiencies, SAMPLE_UPLOAD_LINK) });
    }
    if (model.pending && model.pending.stage === 'needs_review' && /^Low-confidence/.test(model.pending.reason || '')) {
      var percent = Math.round(model.pending.confidence * 100);
      add(ctx, Object.assign({ event: 'Low-confidence reading', to_role: 'Accountant', time: drafted,
        trigger: PLANNED + 'Would send when a reading is below the limit. Read at ' + percent + '% confidence', subject: 'Needs review: ' + where,
        message: model.pending.id + ' for ' + sub.name + ' was read at ' + percent + '% confidence, below the ' + Math.round(CONFIDENCE_GATE * 100) + '% limit. Check the reading before anything else happens.' }, notBuilt));
    }
    if (isUnreadable(model.pending)) {
      // The code holds this draft for the accountant. It goes out when the accountant chooses to send it.
      add(ctx, { event: 'Resend request', to_role: 'Subcontractor contact', time: drafted, approval: APPROVAL_PERSON, status: 'Waiting for approval',
        trigger: 'Unreadable file', subject: subject, message: resendText(SAMPLE_UPLOAD_LINK) });
    }
    if (model.pending && model.pending.stage === 'approval' && model.pending.replaces) {
      // The renewal email goes when a person approves the renewal.
      add(ctx, { event: 'Renewal accepted', to_role: 'Subcontractor contact', time: drafted, approval: APPROVAL_PERSON, status: 'Waiting for approval',
        trigger: 'Renewal passed every check; waiting for approval', subject: subject,
        message: 'Your renewal ' + model.pending.id + ' is approved. It expires ' + dateLabel(model.pending.expiration_date) + '.' });
    }
    if (model.current && model.current.replaces && !model.pending && !hasLogged(row.record_id, 'notice_renewal_accepted')) {
      var byAccountant = /approved by the accountant|waived by the project manager/.test(model.current.decision || '');
      add(ctx, { event: 'Renewal accepted', to_role: 'Subcontractor contact', time: drafted, status: 'Sent',
        approval: byAccountant ? APPROVAL_PERSON : APPROVAL_REVIEW_MODE, approved_by: byAccountant ? approverBefore(row.record_id, log.length) : '',
        trigger: 'Renewal ' + model.current.id + ' accepted', subject: subject,
        message: 'Your renewal ' + model.current.id + ' is approved. It expires ' + dateLabel(model.current.expiration_date) + '.' });
    }
    if (!model.closed && !model.pending && model.current) {
      var days = daysUntil(today, model.current.expiration_date);
      var expiry = model.current.expiration_date;
      var daily = ' The daily job sends it at its next run.';
      if (days >= 0 && days <= 30 && !hasLogged(row.record_id, 'notice_reminder_30d') && days > 7) {
        add(ctx, { event: 'Expiring in 30 days', to_role: 'Subcontractor contact', time: addDays(expiry, -30) + 'T06:00:00', approval: APPROVAL_DAILY,
          status: model.nudges.d30 ? 'Sent' : 'Not sent', trigger: 'Policy expires ' + dateLabel(expiry) + (model.nudges.d30 ? '' : '.' + daily), subject: subject,
          message: 'Your policy expires ' + dateLabel(expiry) + '. Please send your renewal. Upload your renewal here: ' + SAMPLE_UPLOAD_LINK });
      }
      if (days >= 0 && days <= 30 && !hasLogged(row.record_id, 'notice_reminder_7d')) {
        // Inside 7 days the follow-up goes out. Before that it is a drafted entry the daily job sends on the 7-day mark.
        add(ctx, { event: 'Expiring in 7 days', to_role: 'Subcontractor contact', approval: APPROVAL_DAILY,
          time: days <= 7 ? addDays(expiry, -7) + 'T06:00:00' : drafted,
          status: days > 7 ? 'Not sent' : (model.nudges.d7 ? 'Sent' : 'Not sent'),
          trigger: days > 7 ? 'Scheduled for ' + dateLabel(addDays(expiry, -7)) + ', 7 days before expiry' : 'Policy expires ' + dateLabel(expiry) + (model.nudges.d7 ? '' : '.' + daily),
          subject: subject,
          message: 'Reminder: your policy expires ' + dateLabel(expiry) + '. Upload your renewal here: ' + SAMPLE_UPLOAD_LINK });
      }
    }
    if ((status === 'expired' || model.hold.on) && !hasLogged(row.record_id, 'notice_payment_hold')) {
      var owed = billedInCycle(store, row.project_id, row.sub_id, cycle);
      var expired = status === 'expired';
      var why = model.hold.reasons.length ? model.hold.reasons.join('; ') : 'Policy expired';
      add(ctx, { event: 'Payment hold notice', to_role: 'Accountant', time: expired ? addDays(model.current.expiration_date, 1) + 'T06:00:00' : drafted,
        status: 'Sent', approval: APPROVAL_INTERNAL, trigger: expired ? 'Policy expired ' + dateLabel(model.current.expiration_date) : 'Pay check: ' + why, subject: 'Payment hold: ' + where,
        message: sub.name + ' is on payment hold. ' + why + '.' + (owed ? ' Billed this pay cycle: ' + formatUsd(owed) + '.' : '') });
    }
    if (status === 'awaiting' && log.some(function (a) { return a.record_id === row.record_id && a.event_type === 'record_created'; })) {
      add(ctx, Object.assign({ event: 'Upload link', to_role: 'Subcontractor contact', time: drafted,
        trigger: PLANNED + 'Would send when the record is created', subject: subject,
        message: 'Please upload your certificate of insurance for ' + staff.name + ' here: ' + SAMPLE_UPLOAD_LINK }, notBuilt));
    }
  });

  // The weekly digest: one entry for the accountants, with every held subcontractor from the payment hold list.
  // No code sends it yet, so it shows as "Not sent".
  var active = projects.filter(function (p) { return p.status === 'active'; });
  var holds = portfolioHoldList(deps);
  var names = [], emails = [];
  active.forEach(function (p) {
    if (names.indexOf(p.accountant_name) < 0) { names.push(p.accountant_name); emails.push(p.accountant_email); }
  });
  var lines = holds.rows.map(function (h) { return '- ' + h.subcontractor + ', ' + h.project + ': ' + h.amount + '. ' + h.reasons.join('; ') + '.'; });
  var digestBody = holds.rows.length
    ? 'Hello ' + names.map(firstName).join(' and ') + ',\n\nThese subcontractors are on payment hold for the ' + dateLabel(holds.pay_date) + ' pay run.\n' +
      lines.join('\n') + '\n\nTotal on hold: ' + holds.total + '.' + NOTIFICATION_FOOTER
    : 'Hello ' + names.map(firstName).join(' and ') + ',\n\n' + holds.empty + NOTIFICATION_FOOTER;
  out.push({
    id: '', event_type: EVENT_TYPE[DIGEST_EVENT], event: DIGEST_EVENT, trigger: PLANNED + 'Would send weekly, Thursday 6:00 AM',
    time: latestThursday(today) + 'T06:00:00',
    project_id: '', project: 'All active projects', record_id: '', sub_name: '',
    to_role: 'Accountant', to_name: names.join(', '), to_email: emails.join(', '),
    drafted_by: 'Template', approval: APPROVAL_NOT_BUILT, approved_by: '', status: 'Not sent',
    subject: DIGEST_EVENT + (holds.pay_date ? ': ' + dateLabel(holds.pay_date) + ' pay run' : ''), body: digestBody
  });

  // Newest first. Equal times keep the order built above.
  var rows = out.map(function (r, i) { return { r: r, i: i }; })
    .sort(function (a, b) { return String(b.r.time).localeCompare(String(a.r.time)) || (a.i - b.i); })
    .map(function (x, n) { x.r.id = 'NTF-' + String(n + 1).padStart(3, '0'); return x.r; });
  return {
    rows: rows, events: NOTIFICATION_EVENTS.slice(),
    source: 'activity_log, compliance_records, certificates, subcontractors, projects',
    last_updated: rows.length ? rows[0].time : '', sample: 'Sample data', banner: NOTIFICATION_BANNER
  };
}

// Payment hold: which pay cycle is current, what a sub billed in it, and the payment hold list.
// The pay check itself is the pay_check event in nextStatus; the daily job runs it (docs/decisions.md, Phase 5).

// The current pay cycle is the earliest pay date that is today or later ('' when there is none).
// pay_cycle holds the pay date as YYYY-MM-DD, so plain text order is date order.
function currentPayCycle(store, today) {
  var dates = store.readRows('pay_applications')
    .map(function (p) { return String(p.pay_cycle); })
    .filter(function (d) { return d !== '' && d >= today; })
    .sort();
  return dates.length ? dates[0] : '';
}

// What one sub billed on one project in one cycle. Several rows for the same cycle add up.
function billedInCycle(store, projectId, subId, cycle) {
  if (!cycle) return 0;
  return store.readRows('pay_applications')
    .filter(function (p) { return p.project_id === projectId && p.sub_id === subId && String(p.pay_cycle) === cycle; })
    .reduce(function (sum, p) { return sum + (Number(p.amount_billed_usd) || 0); }, 0);
}

// The payment hold list for one project: every held sub who billed in the current cycle, the amount,
// every reason, the source tabs and the newest last_updated among the held records (docs/decisions.md, Phase 5).
// Largest amount first; equal amounts keep Sheet order.
function paymentHoldList(deps, projectId) {
  var store = deps.store;
  var cycle = currentPayCycle(store, deps.clock.today());
  var subName = {};
  store.readRows('subcontractors').forEach(function (s) { subName[s.sub_id] = s.name; });
  var rows = [];
  var newest = '';
  if (cycle) {
    // One row per sub: the bill is the sub's, so a sub with two held records counts it once
    // (docs/metric-definitions.md, dollars_on_hold_usd). The row opens the first held record and lists every reason.
    var rowOf = {};
    store.readRows('compliance_records').forEach(function (r) {
      if (r.project_id !== projectId || r.payment_hold !== true || r.closed === true) return;
      var amount = billedInCycle(store, projectId, r.sub_id, cycle);
      if (!amount) return;
      var reasons = JSON.parse(r.payment_hold_reasons || '[]');
      var seen = rowOf[r.sub_id];
      if (seen) {
        reasons.forEach(function (reason) { if (seen.reasons.indexOf(reason) < 0) seen.reasons.push(reason); });
      } else {
        rows.push(rowOf[r.sub_id] = {
          record_id: r.record_id, subcontractor: subName[r.sub_id] || r.sub_id, amount: formatUsd(amount), amount_usd: amount,
          reasons: reasons
        });
      }
      if (String(r.last_updated) > newest) newest = String(r.last_updated);
    });
  }
  rows = rows.map(function (row, i) { return { row: row, i: i }; })
    .sort(function (a, b) { return (b.row.amount_usd - a.row.amount_usd) || (a.i - b.i); })
    .map(function (x) { return x.row; });
  var total = rows.reduce(function (sum, row) { return sum + row.amount_usd; }, 0);
  var empty = '';
  if (!cycle) empty = 'No pay date from today on has a pay application. Nothing to hold.';
  else if (!rows.length) empty = 'No one is on payment hold for the pay date ' + cycle + '.';
  return {
    pay_date: cycle, rows: rows, total: formatUsd(total), total_usd: total,
    source: 'pay_applications, compliance_records', last_updated: newest, empty: empty, sample: 'Sample data'
  };
}

// Portfolio figures use the same record core and hold list as the detail page.
function latestModeChange(store, projectId) {
  var rows = store.readRows('activity_log').filter(function (r) {
    return r.record_id === projectId && r.event_type === 'review_mode_changed';
  }).sort(function (a, b) { return String(b.time).localeCompare(String(a.time)); });
  return rows.length ? { who: rows[0].who, time: rows[0].time } : null;
}

function portfolioView(deps) {
  deps = readViewDeps(deps);
  var today = deps.clock.today();
  var store = deps.store;
  var active = store.readRows('projects').filter(function (p) { return p.status === 'active'; });
  var metrics = ['expected_count', 'compliant_count', 'expired_count', 'expiring_30d_count', 'below_limits_count', 'dollars_on_hold_usd'];
  var totals = {}, updated = {};
  metrics.forEach(function (m) { totals[m] = 0; updated[m] = ''; });
  var projects = active.map(function (p) {
    var rows = store.readRows('compliance_records').filter(function (r) { return r.project_id === p.project_id && r.closed !== true; });
    var models = rows.map(function (row) { return loadRecord(store, row, today); });
    var tile = projectTile(models, today);
    var hold = paymentHoldList(deps, p.project_id);
    tile.dollars_on_hold_usd = hold.total_usd;
    tile.waiting_count = models.filter(function (m) { return !!waitingLabel(m); }).length;
    var last = {};
    metrics.forEach(function (m) { last[m] = ''; });
    rows.forEach(function (row, i) {
      var model = models[i], status = deriveStatus(model, today);
      function stamp(metric, applies) {
        if (applies && String(row.last_updated) > last[metric]) last[metric] = String(row.last_updated);
      }
      stamp('expected_count', true);
      stamp('compliant_count', isCompliantStatus(status));
      stamp('expired_count', status === 'expired');
      stamp('expiring_30d_count', status === 'expiring_soon' && !model.pending);
      stamp('below_limits_count', !!(model.pending && model.pending.check && model.pending.check.deficiencies.some(function (d) { return d.kind === 'limit'; })));
    });
    last.dollars_on_hold_usd = hold.last_updated;
    metrics.forEach(function (m) {
      totals[m] += tile[m];
      if (last[m] > updated[m]) updated[m] = last[m];
    });
    return Object.assign(tile, {
      project_id: p.project_id, name: p.name, review_mode: p.review_mode,
      staff: { accountant: p.accountant_name, project_manager: p.project_manager_name, leadership: p.leadership_name },
      last_updated: last, source: 'compliance_records, certificates',
      hold_source: hold.source, pay_date: hold.pay_date, sample: 'Sample data'
    });
  });
  return { today: today, projects: projects, totals: totals, last_updated: updated,
    source: 'compliance_records, certificates', hold_source: 'pay_applications, compliance_records', sample: 'Sample data' };
}

// Cache Sheet reads within one view request. Every figure uses the same rows.
function readViewDeps(deps) {
  var cache = {};
  return Object.assign({}, deps, { store: { readRows: function (tab) {
    if (!cache[tab]) cache[tab] = deps.store.readRows(tab);
    return cache[tab];
  } } });
}

function worklistView(deps, projectId) {
  deps = readViewDeps(deps);
  var projects = deps.store.readRows('projects').filter(function (p) {
    return projectId === 'all' ? p.status === 'active' : p.project_id === projectId;
  });
  if (!projects.length && projectId !== 'all') throw new Error('No such project.');
  var rows = [];
  projects.forEach(function (p) {
    worklistRows(deps, p.project_id).forEach(function (r) { r.project = p.name; r.project_id = p.project_id; rows.push(r); });
  });
  rows.sort(function (a, b) { return (!!b.waiting - !!a.waiting); });
  var project = projects[0];
  return { project_id: projectId, project: projectId === 'all' ? 'All active projects' : project.name,
    review_mode: projectId === 'all' ? null : project.review_mode, review_modes: REVIEW_MODES,
    mode_set: projectId === 'all' ? null : latestModeChange(deps.store, projectId), rows: rows };
}

function portfolioHoldList(deps) {
  deps = readViewDeps(deps);
  var projects = deps.store.readRows('projects').filter(function (p) { return p.status === 'active'; });
  var rows = [], updated = '';
  projects.forEach(function (project) {
    var list = paymentHoldList(deps, project.project_id);
    list.rows.forEach(function (r) { rows.push(Object.assign({}, r, {project:project.name,project_id:project.project_id})); });
    if (list.last_updated > updated) updated = list.last_updated;
  });
  rows.sort(function (a, b) { return b.amount_usd - a.amount_usd; });
  var total = rows.reduce(function (sum, row) { return sum + row.amount_usd; },0);
  var cycle = currentPayCycle(deps.store, deps.clock.today());
  return {rows:rows,total:formatUsd(total),total_usd:total,pay_date:cycle,last_updated:updated,
    source:'pay_applications, compliance_records',empty:cycle ? 'No one is on payment hold for the pay date ' + cycle + '.' : 'No current pay cycle.',sample:'Sample data'};
}

// Everything the list screens show, from one read of each tab. The page keeps it and filters it
// per project, so a click between screens needs no server call. A write refreshes it.
function appData(deps) {
  deps = readViewDeps(deps);
  var portfolio = portfolioView(deps);
  var holds = { all: portfolioHoldList(deps) };
  portfolio.projects.forEach(function (p) {
    holds[p.project_id] = paymentHoldList(deps, p.project_id);
    p.mode_set = latestModeChange(deps.store, p.project_id);
  });
  return { portfolio: portfolio, worklist: worklistView(deps, 'all'), holds: holds, roi: roiLines(ROI_INPUTS) };
}

// Directory (ticket 18, ticket 19). A sent notice is an activity-log entry for the subcontractor's record
// whose notice type (noticeTypeOf, Notifications.gs) is one of DIRECTORY_NOTICE_TYPES: a notice to the
// subcontractor or the project manager. noticeTypeOf also reads an old row logged under a legacy event_type
// by its summary, so the live Sheet's old rows still count.
function sentNoticeType(entry) {
  var type = noticeTypeOf(entry);
  return type && DIRECTORY_NOTICE_TYPES.indexOf(type) >= 0 ? type : '';
}

// One row per subcontractor: company, trade, contact, email, phone, status, certificate IDs, last notice.
// A subcontractor on several projects shows the worst status across its open records.
// Worst first: expired, then needs review and in review, awaiting, expiring soon, compliant.
// A subcontractor with only closed records shows Closed.
var STATUS_SEVERITY = { expired: 5, needs_review: 4, in_review: 4, awaiting: 3, expiring_soon: 2, compliant: 1, closed: 0 };

function worstStatus(statuses) {
  return statuses.reduce(function (worst, s) {
    return worst === null || STATUS_SEVERITY[s] > STATUS_SEVERITY[worst] ? s : worst;
  }, null);
}

function directoryRows(deps) {
  deps = readViewDeps(deps);
  var today = deps.clock.today();
  var records = deps.store.readRows('compliance_records');
  var certs = deps.store.readRows('certificates');
  var log = deps.store.readRows('activity_log');
  return deps.store.readRows('subcontractors').map(function (sub) {
    var mine = records.filter(function (r) { return r.sub_id === sub.sub_id; });
    var ids = mine.map(function (r) { return r.record_id; });
    var open = mine.filter(function (r) { return r.closed !== true; });
    if (!open.length) open = mine.slice(0, 1);
    var worst = worstStatus(open.map(function (r) { return deriveStatus(loadRecord(deps.store, r), today); }));
    var notice = log.filter(function (a) { return ids.indexOf(a.record_id) >= 0 && sentNoticeType(a); })
      .sort(function (a, b) { return String(b.time).localeCompare(String(a.time)); })[0];
    return {
      sub_id: sub.sub_id, company: sub.name, trade: sub.trade, contact: sub.contact_name, email: sub.email, phone: sub.phone,
      status: worst ? STATUS_LABEL[worst] : '',
      certificate_ids: certs.filter(function (c) { return ids.indexOf(c.record_id) >= 0; }).map(function (c) { return c.certificate_id; }),
      // Each certificate with the record it sits on, so the page can link a certificate to its record.
      certificates: certs.filter(function (c) { return ids.indexOf(c.record_id) >= 0; }).map(function (c) {
        return { certificate_id: c.certificate_id, record_id: c.record_id, expiration_date: c.expiration_date || '' };
      }),
      record_ids: ids,
      last_notification: notice ? NOTICE_TYPES[sentNoticeType(notice)].event : '',
      last_notification_time: notice ? notice.time : ''
    };
  });
}

function directoryView(deps) {
  deps = readViewDeps(deps);
  var rows = directoryRows(deps);
  var updated = '';
  deps.store.readRows('compliance_records').forEach(function (r) { if (String(r.last_updated) > updated) updated = String(r.last_updated); });
  return {
    last_updated: updated,
    rows: rows,
    subcontractor_count: rows.length,
    directory_compliant_count: rows.filter(function (r) { return r.status === STATUS_LABEL.compliant || r.status === STATUS_LABEL.expiring_soon; }).length,
    source: 'subcontractors',
    sample: 'Sample data'
  };
}

// Review queue: the accountant's actions, the leadership review mode, and the record detail view.
// Each action loads the record, runs the compliance core, saves the result and hands effects to
// the Mailer and the Calendar. deps = { store, reader, mailer, clock, calendar, newToken, uploadBaseUrl }.

var ROLES = {
  accountant: { label: 'Accountant', nameColumn: 'accountant_name', phrase: 'the accountant' },
  project_manager: { label: 'Project manager', nameColumn: 'project_manager_name', phrase: 'the project manager' },
  leadership: { label: 'Leadership', nameColumn: 'leadership_name', phrase: 'leadership' }
};

// Which role may do each action, and the words for the refusal.
var ACTION_ROLE = {
  approve: ['accountant'], correct: ['accountant'], resend: ['accountant'], w9: ['accountant'], set_mode: ['leadership'],
  waive: ['project_manager', 'leadership'], reject: ['project_manager', 'leadership']
};
var ACTION_VERB = {
  approve: 'approve a certificate', correct: 'correct a reading',
  resend: 'send a resend request', w9: 'mark a W-9', set_mode: 'change the review mode',
  waive: 'waive a deficiency', reject: 'reject a deficiency'
};

var REVIEW_MODES = { review_all: 'review all', review_deficiencies: 'review deficiencies', automatic: 'automatic' };

// "Dana Reyes (Accountant)" when the project names the person, else the role alone.
function actorName(project, role) {
  var r = ROLES[role];
  var name = project[r.nameColumn];
  return name ? name + ' (' + r.label + ')' : r.label;
}

// Returns the refusal text, or '' when the role may do the action.
function roleDenied(role, action) {
  if (!ROLES[role]) return 'Unknown role.';
  if (!ACTION_ROLE[action]) return 'Unknown action.';
  if (ACTION_ROLE[action].indexOf(role) < 0) {
    var who = ACTION_ROLE[action].map(function (k) { return ROLES[k].phrase; }).join(' or ');
    return 'Only ' + who + ' can ' + ACTION_VERB[action] + '.';
  }
  return '';
}

function uploadLinkFor(deps, recRow) {
  return deps.uploadBaseUrl ? deps.uploadBaseUrl + '?t=' + encodeURIComponent(recRow.upload_token) : '';
}

// The link in the deficiency email: the record, opened as the project manager (docs/decisions.md, Phase 3).
// Empty when the internal app address is not set; the email then goes without a link.
function recordLinkFor(deps, recordId) {
  return deps.internalBaseUrl ? deps.internalBaseUrl + '?record=' + encodeURIComponent(recordId) + '&as=project_manager' : '';
}

function isUnreadable(cert) {
  return !!cert && cert.reason === 'Unreadable file';
}

// What the accountant sees a record waiting for. Empty when nothing waits.
function waitingLabel(record) {
  var p = record.pending;
  if (!p) return '';
  if (p.stage === 'approval') return 'Waiting for approval';
  if (p.stage === 'deficiency') return 'Waiting for a decision on a deficiency';
  return isUnreadable(p) ? 'Unreadable file' : 'Needs review';
}

// The one action that clears what the record waits for: approve, correct, resend, or none.
function nextStep(record) {
  var p = record.pending;
  if (!p) return null;
  if (p.stage === 'approval') return 'approve';
  if (p.stage === 'needs_review') return isUnreadable(p) ? 'resend' : 'correct';
  if (p.stage === 'deficiency') return 'decide';
  return null;
}

var ACTION_DONE = {
  approve: 'Approved. The subcontractor has been emailed.',
  correct: 'Correction saved and the check run again.',
  resend: 'Resend request sent.',
  waive: 'Waived. The subcontractor has been emailed that the certificate is approved.',
  reject: 'Rejected. The correction request has been sent to the subcontractor.'
};

// action is approve, correct, resend, w9, waive or reject. payload.values holds the corrected reading
// for correct; payload.note holds the reason for waive; payload.onFile is the W-9 state.
// A browser reject includes payload.approved_text and payload.certificate_id from the preview. Returns { ok, message, status }.
// A refusal changes nothing.
function reviewAction(deps, recordId, role, action, payload) {
  var denied = action === 'set_mode' ? 'Unknown action.' : roleDenied(role, action);
  if (denied) return { ok: false, message: denied };
  var result = withScriptLock(function () {
    var store = deps.store;
    var recRow = findRow(store.readRows('compliance_records'), 'record_id', recordId);
    if (!recRow) return { ok: false, message: 'No such record.' };
    var project = findRow(store.readRows('projects'), 'project_id', recRow.project_id);
    var who = actorName(project, role);
    var event;
    if (action === 'approve') {
      event = { type: 'approve', who: who };
    } else if (action === 'correct') {
      var parsed = parseExtraction({ readable: true, unreadable_reason: null, confidence: 1, values: payload && payload.values });
      if (!parsed.readable) return { ok: false, message: 'The corrected values are not valid: ' + parsed.reason };
      var note = String(payload && payload.note || '').trim();
      if (!note) return { ok: false, message: 'A correction needs a note. Write what you changed and why.' };
      event = { type: 'reading_confirmed', who: who, note: note, values: parsed.values, recordLink: recordLinkFor(deps, recordId) };
    } else if (action === 'w9') {
      if (!payload || typeof payload.onFile !== 'boolean') return { ok: false, message: 'Say whether the W-9 is on file or missing.' };
      event = { type: 'w9_set', who: who, onFile: payload.onFile };
    } else if (action === 'waive') {
      event = { type: 'waive', who: who, note: payload && payload.note };
    } else if (action === 'reject') {
      var rejectLink = uploadLinkFor(deps, recRow);
      if (!rejectLink) return { ok: false, message: 'The upload page address is not set. Set Script Property ' + PROP_UPLOAD_BASE_URL + ' first.' };
      event = { type: 'reject', who: who, uploadLink: rejectLink };
    } else {
      var link = uploadLinkFor(deps, recRow);
      if (!link) return { ok: false, message: 'The upload page address is not set. Set Script Property ' + PROP_UPLOAD_BASE_URL + ' first.' };
      event = { type: 'resend_requested', who: who, uploadLink: link };
    }
    var before = loadRecord(store, recRow);
    // A correction that changed a value becomes a calibration sample (src/Flywheel.gs), and its log line says so.
    var sample = event.type === 'reading_confirmed' ? sampleFromCorrection(before.pending, event.values, who, event.note, deps.clock.now()) : null;
    if (sample) event.addedToTestSet = true;
    var out = nextStatus(before, event, deps.clock.today(), project.review_mode, TOLERANCE_MATRIX);
    if (out.refused) return { ok: false, message: out.refused };
    if (action === 'reject') {
      out.effects = withCorrectionDraft(store, before.pending, out.effects, event.uploadLink);
      if (payload && typeof payload.approved_text === 'string' &&
          (payload.certificate_id !== before.pending.id || !out.effects.some(function (e) { return e.text === payload.approved_text; }))) {
        return { ok: false, message: 'The correction request changed. Reopen the record and approve the current wording.' };
      }
    }
    saveRecord(store, recordId, out.record, deps.clock.now(), '', event.type);
    // Share Proj shows the same log line and writes no sample.
    if (sample && !isDemoMode()) {
      var sampleCert = findRow(store.readRows('certificates'), 'certificate_id', sample.certificate_id);
      upsertSample(store, Object.assign(sample, { record_id: recordId, pdf_link: sampleCert ? sampleCert.pdf_link : '' }));
    }
    return { ok: true, project: project, record: out.record, effects: out.effects, calendar: calendarChanges(before, out.record),
      uploadLink: event.uploadLink };
  });
  if (!result.ok) return { ok: false, message: result.message };
  // The lock fixes the approved wording before the record changes. Send that exact text.
  sendEffects(deps.mailer, result.effects, result.project, result.record);
  applyCalendar(deps, recordId, result.project, result.record, result.calendar);
  var done = action === 'w9' ? (result.record.sub.w9 ? 'W-9 marked on file.' : 'W-9 marked missing.') : ACTION_DONE[action];
  return { ok: true, message: done, status: result.record.status };
}

// Leadership changes a project's review mode. It applies to certificates that arrive afterwards;
// certificates already waiting keep waiting (docs/decisions.md, Phase 3).
function setReviewMode(deps, projectId, role, mode) {
  var denied = roleDenied(role, 'set_mode');
  if (denied) return { ok: false, message: denied };
  if (!REVIEW_MODES[mode]) return { ok: false, message: 'Unknown review mode.' };
  return withScriptLock(function () {
    var store = deps.store;
    var project = findRow(store.readRows('projects'), 'project_id', projectId);
    if (!project) return { ok: false, message: 'No such project.' };
    if (project.review_mode === mode) return { ok: false, message: 'The project is already on ' + REVIEW_MODES[mode] + '.' };
