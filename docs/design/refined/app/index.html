.btn { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 16px; border:0; border-radius:9px;

/* Worklist */

.action-card { display:inline-flex; align-items:center; gap:14px; min-height:52px; padding:8px 8px 8px 16px; border:0; border-radius:12px; background:var(--action-bg); color:var(--action-fg); text-align:left;
  box-shadow:inset 0 0 0 1px var(--action-ring); transition:transform var(--t1) var(--ease),background-color var(--t1),box-shadow var(--t1); }
@media (hover:hover) { .action-card:hover { transform:translateY(-1px); background:var(--action-bg-hover); box-shadow:inset 0 0 0 1px var(--action-ring-hover),0 6px 14px -8px rgba(138,90,11,.7); } }

.start { display:inline-flex; align-items:center; height:32px; padding:0 14px; border-radius:8px; background:var(--action-fg); color:#FFF7E6; font-size:13px; font-weight:600; }

.detail-grid { display:grid; grid-template-columns:minmax(280px,.95fr) minmax(420px,1.35fr) 300px; gap:48px; margin-top:30px; align-items:start; }

.step { position:relative; overflow:hidden; background:var(--surface); border-radius:18px; box-shadow:var(--raised); transition:transform var(--t4) var(--ease),box-shadow var(--t4) var(--ease); }

.step.swell { transform:scale(1.015); box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 4px rgba(60,45,25,.1),0 12px 28px -6px rgba(60,45,25,.16),0 40px 70px -24px rgba(60,45,25,.38),0 0 0 3px rgba(181,119,15,.28); }
.step-head { display:flex; align-items:flex-start; gap:12px; padding:20px 22px 0; }

.step-meta { font-size:12.5px; color:var(--muted); text-wrap:pretty; }
.who-chip { display:inline-flex; align-items:center; gap:8px; height:30px; padding:0 12px 0 4px; border-radius:15px; background:var(--well-soft); box-shadow:inset 0 0 0 1px rgba(30,27,22,.08); font-size:14px; font-weight:650; white-space:nowrap; }
.who-chip .av { width:22px; height:22px; border-radius:50%; display:inline-grid; place-items:center; background:var(--accent); color:var(--surface); font-size:10px; font-weight:600; }

.w9 { padding:0 4px; }

.bar { grid-column:1/-1; position:relative; height:4px; margin-top:8px; border-radius:2px; background:rgba(30,27,22,.1); }
.bar i { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:2px; background:var(--ink-2); transition:width var(--t4) var(--ease) 120ms; }

.checks { display:grid; gap:0; }
.checks .tr { display:grid; grid-template-columns:1.25fr 1fr 1fr 70px; gap:12px; padding:11px 10px; border-radius:8px; border-bottom:1px solid rgba(30,27,22,.07); font-size:13.5px;
  transition:background-color var(--t4) var(--ease); overflow-wrap:anywhere; }

.pdf summary { list-style:none; display:flex; align-items:center; gap:8px; cursor:pointer; font-size:15px; font-weight:600; border-radius:7px; padding:2px 0; }

/* Payment holds */
.holds-total { display:flex; gap:12px 28px; align-items:flex-end; flex-wrap:wrap; margin-top:26px; }

/* ROI */

.cases { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:16px; margin-top:24px; align-items:stretch; }
.case { padding:22px 24px; display:grid; gap:4px; align-content:start; border-radius:18px; }
.case .label { font-weight:600; }
.case.likely .label { color:var(--accent); }
.case .v { font-size:32px; font-weight:600; letter-spacing:-.03em; line-height:1.1; }
.case.likely .v { font-size:48px; letter-spacing:-.04em; }

.case.likely p { font-weight:550; color:var(--ink); }

.ptable td:first-child { font-weight:550; }

/* Toast */
.toast { position:fixed; left:50%; bottom:28px; z-index:50; overflow:hidden; display:flex; gap:14px; align-items:center; max-width:min(640px,calc(100vw - 32px));
  padding:12px 8px 12px 16px; background:var(--ink); color:var(--bg); font-size:13.5px; border-radius:12px; box-shadow:0 18px 40px -16px rgba(30,27,22,.6);
  opacity:0; transform:translate(-50%,12px); pointer-events:none; transition:opacity var(--t2) var(--ease),transform var(--t3) var(--ease); }

.toast.on .count { animation:countdown 4.5s linear forwards; }
.toast:hover .count { animation-play-state:paused; }

/* Dialogs */
dialog { width:min(620px,calc(100vw - 32px)); max-height:calc(100vh - 48px); max-height:calc(100dvh - 48px); overflow:auto; padding:30px 32px 24px; border:0; border-radius:18px; background:var(--surface); color:var(--ink);
  box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(60,45,25,.08),0 40px 80px -24px rgba(60,45,25,.45); }
dialog[open] { animation:dialog-in var(--t3) var(--ease) both; }
dialog::backdrop { background:rgba(30,27,22,.3); animation:fade-in var(--t2) var(--ease) both; }
dialog.wide { width:min(1080px,calc(100vw - 32px)); }

.full-cert { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(320px,1fr); gap:28px; align-items:start; }

/* Upload page */
.uploadhead { max-width:1440px; margin:0 auto; padding:22px 48px 0; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.uploadhead .logo { width:32px; height:32px; background:#1F2A19; color:#C9DBB2; box-shadow:none; }
.upload-main { max-width:640px; padding-top:48px; flex:none; }
.upload-main .chips { margin:14px 0 22px; }
.upload-card { padding:28px; }
.drop { display:grid; place-items:center; gap:12px; margin:16px 0; padding:30px 18px; text-align:center; transition:box-shadow var(--t1) var(--ease),background-color var(--t1); }

.form-error { margin:10px 0 0; font-size:13px; font-weight:550; color:var(--red); }
.steps { list-style:none; margin:18px 0 0; padding:0; display:grid; gap:6px; }
.steps li { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:10px; color:var(--muted); box-shadow:var(--strip); transition:background-color var(--t2),color var(--t2); }
.steps li.active { background:var(--action-bg); color:var(--action-fg); font-weight:600; box-shadow:inset 0 0 0 1px var(--action-ring); }
.steps li.done { color:var(--ink); }
.steps .mark { width:18px; height:18px; padding:0; display:grid; place-items:center; flex:none; border-radius:50%; background:none; color:inherit; }
.steps li.done .mark:before { content:''; width:9px; height:5px; border-left:2px solid var(--green); border-bottom:2px solid var(--green); transform:rotate(-45deg) translate(1px,-1px); }

.upload-done h2 { margin-bottom:6px; }
.upload-done h2.swap { animation:fade-x var(--t2) var(--ease); }
.drop-icon { width:46px; height:46px; display:grid; place-items:center; border-radius:13px; background:var(--surface); color:var(--accent); box-shadow:var(--raised); transition:transform var(--t2) var(--ease),color var(--t2); }

.drop.over .drop-icon { transform:translateY(-4px) scale(1.06); }
.drop.over .drop-icon .arrow { transform:translateY(-1.5px); }
.drop.has-file .drop-icon { color:var(--green); }
.drop.over { transform:scale(1.01); }

<script>
// Real adapters: the only code that calls Google services. Fakes.gs has the same interfaces.

// Store: Sheet tabs in one spreadsheet, files in the Drive tree under My Drive.
function SheetStore(spreadsheetId) {
  var ss = SpreadsheetApp.openById(spreadsheetId);
  var tz = Session.getScriptTimeZone();

  // Sheets turns ISO text into Dates; turn them back so the core only sees strings.
  // Many cells share a time, so each time is formatted once.
  var formatted = {};
  function cell(v) {
    if (!(v instanceof Date)) return v;
    var key = v.getTime();
    if (formatted[key] === undefined) {
      var isMidnight = v.getHours() === 0 && v.getMinutes() === 0 && v.getSeconds() === 0;
      formatted[key] = Utilities.formatDate(v, tz, isMidnight ? 'yyyy-MM-dd' : "yyyy-MM-dd'T'HH:mm:ss");
    }
    return formatted[key];
  }

  function sheet(tab) {
    var s = ss.getSheetByName(tab);
    if (!s) throw new Error('No Sheet tab named ' + tab + '. Run setupDemo first.');
    return s;
  }

  function folderAt(path) {
    var folder = DriveApp.getRootFolder();
    path.split('/').forEach(function (name) {
      var it = folder.getFoldersByName(name);
      folder = it.hasNext() ? it.next() : folder.createFolder(name);
    });
    return folder;
  }

  return {
    ensureTab: function (name, columns) {
      var existing = ss.getSheetByName(name);
      if (existing) {
        // An older tab gains any column added since it was built.
        var have = existing.getRange(1, 1, 1, existing.getLastColumn()).getValues()[0];
        columns.filter(function (c) { return have.indexOf(c) < 0; }).forEach(function (c, i) {
          existing.getRange(1, have.length + i + 1).setValue(c).setFontWeight('bold');
        });
        return;
      }
      var s = ss.insertSheet(name);
      s.getRange(1, 1, 1, columns.length).setValues([columns]).setFontWeight('bold');
      s.setFrozenRows(1);
    },
    ensureFolder: function (path) { folderAt(path); },
    writeFile: function (folderPath, name, content, mimeType) {
      var folder = folderAt(folderPath);
      var old = folder.getFilesByName(name);
      while (old.hasNext()) old.next().setTrashed(true);
      return folder.createFile(name, content, mimeType).getUrl();
    },
    writeBlob: function (folderPath, name, base64, mimeType) {
      var blob = Utilities.newBlob(Utilities.base64Decode(base64), mimeType, name);
      return folderAt(folderPath).createFile(blob).getUrl();
    },
    readRows: function (tab) {
      var values = sheet(tab).getDataRange().getValues();
      var header = values.shift();
      return values.map(function (row) {
        var o = {};
        header.forEach(function (c, i) { o[c] = cell(row[i]); });
        return o;
      });
    },
    appendRow: function (tab, row) {
      var s = sheet(tab);
      var header = s.getRange(1, 1, 1, s.getLastColumn()).getValues()[0];
      s.appendRow(header.map(function (c) { return row[c] === undefined ? '' : row[c]; }));
    },
    appendRows: function (tab, rows) {
      if (!rows.length) return;
      var s = sheet(tab);
      var header = s.getRange(1, 1, 1, s.getLastColumn()).getValues()[0];
      var values = rows.map(function (row) {
        return header.map(function (column) { return row[column] === undefined ? '' : row[column]; });
      });
      s.getRange(s.getLastRow() + 1, 1, values.length, header.length).setValues(values);
    },
    updateRow: function (tab, keyColumn, keyValue, patch) {
      var s = sheet(tab);
      var values = s.getDataRange().getValues();
      var header = values[0];
      var key = header.indexOf(keyColumn);
      for (var i = 1; i < values.length; i++) {
        if (cell(values[i][key]) !== keyValue) continue;
        var row = header.map(function (c, j) { return patch[c] === undefined ? values[i][j] : patch[c]; });
        s.getRange(i + 1, 1, 1, header.length).setValues([row]);
        return;
      }
      throw new Error('No ' + tab + ' row with ' + keyColumn + ' = ' + keyValue);
    }
  };
}

// Reader: sends the PDF inline to Gemini and turns the reply into a reading.
// file = { name, fingerprint, link }. The PDF itself is fetched from the Drive link.

// Drive file IDs appear in the link as /d/<id>/ or as ?id=<id>.
function driveFileIdFromLink(link) {
  var m = /\/d\/([\w-]+)/.exec(link || '') || /[?&]id=([\w-]+)/.exec(link || '');
  if (!m) throw new Error('No Drive file ID in link: ' + link);
  return m[1];
}

// The one place that knows the request shape. If Google moves to a new API, change this.
function buildModelRequest(base64Pdf) {
  return {
    url: 'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent',
    body: {
      contents: [{ parts: [
        { inline_data: { mime_type: 'application/pdf', data: base64Pdf } },
        { text: EXTRACTION_PROMPT }
      ] }],
      generationConfig: { temperature: 0, responseMimeType: 'application/json', responseJsonSchema: EXTRACTION_SCHEMA }
    }
  };
}

// loadBytes(file) -> PDF bytes. send({ url, body }) -> { status, text }. encode(bytes) -> base64.
// Real versions are in GeminiReader; tests pass fakes.
// Every reading carries reading.usage, the reply's usageMetadata, for metering. A 400 carries zero tokens.
function buildReader(loadBytes, send, encode) {
  return {
    read: function (file) {
      var res = send(buildModelRequest(encode(loadBytes(file))));
      if (res.status === 400 && /API key/i.test(res.text)) throw new Error('Gemini rejected the API key. Check Script Property ' + PROP_GEMINI_API_KEY + '.');
      if (res.status === 400) {
        return Object.assign(unreadableReading('The model service rejected the file (HTTP 400).'),
          { usage: { promptTokenCount: 0, candidatesTokenCount: 0, thoughtsTokenCount: 0 } });
      }
      if (res.status !== 200) throw new Error('Gemini request failed (HTTP ' + res.status + '): ' + String(res.text).slice(0, 200));
      var reply = JSON.parse(res.text);
      var usage = reply.usageMetadata || {};
      var candidates = reply.candidates;
      var parts = candidates && candidates[0] && candidates[0].content && candidates[0].content.parts;
      if (!parts || !parts.length || typeof parts[0].text !== 'string') return Object.assign(unreadableReading('The model returned no answer.'), { usage: usage });
      return Object.assign(parseExtraction(parts[0].text), { usage: usage });
    }
  };
}

function GeminiReader() {
  var key = PropertiesService.getScriptProperties().getProperty(PROP_GEMINI_API_KEY);
  return buildReader(
    function (file) { return DriveApp.getFileById(driveFileIdFromLink(file.link)).getBlob().getBytes(); },
    function (request) {
      if (!key) throw new Error('Script Property ' + PROP_GEMINI_API_KEY + ' is not set. Run the setup wizard.');
      var res = UrlFetchApp.fetch(request.url, {
        method: 'post', contentType: 'application/json', headers: { 'x-goog-api-key': key },
        payload: JSON.stringify(request.body), muteHttpExceptions: true
      });
      return { status: res.getResponseCode(), text: res.getContentText() };
    },
    function (bytes) { return Utilities.base64Encode(bytes); }
  );
}

// Drafter: asks Gemini for the wording of a deficiency notice or a correction request (src/Draft.gs).
// The model gets only the audience and each deficiency's id, kind and field label.
function buildDraftRequest(audience, deficiencies) {
  return {
    url: 'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent',
    body: {
      contents: [{ parts: [
        { text: DRAFT_PROMPT.replace('{audience}', audience) },
        { text: JSON.stringify(draftInput(audience, deficiencies)) }
      ] }],
      generationConfig: { temperature: 0.3, responseMimeType: 'application/json', responseJsonSchema: DRAFT_SCHEMA }
    }
  };
}

// send({ url, body }) -> { status, text }. draft() returns { draft, reason, usage }: draft is null when
// the call failed or the reply broke a rule, and reason says why. usage is Gemini's usageMetadata, or null.
// It never throws, so a failed draft never stops the upload job: the template goes instead.
function buildDrafter(send) {
  return {
    draft: function (audience, deficiencies) {
      var usage = null;
      function none(reason) { return { draft: null, reason: reason, usage: usage }; }
      try {
        var res = send(buildDraftRequest(audience, deficiencies));
        if (res.status !== 200) return none('The model service failed (HTTP ' + res.status + ').');
        var body;
        try { body = JSON.parse(res.text); } catch (err) { return none('The model reply was not valid JSON.'); }
        usage = body.usageMetadata || null;
        var parts = body.candidates && body.candidates[0] && body.candidates[0].content && body.candidates[0].content.parts;
        if (!parts || !parts.length || typeof parts[0].text !== 'string') return none('The model returned no answer.');
        var reply;
        try { reply = JSON.parse(parts[0].text); } catch (err) { return none('The model reply was not valid JSON.'); }
        var check = checkDraft(reply, draftIds(deficiencies));
        if (!check.ok) return none('Draft rejected: ' + check.reason + '.');
        var draft = {
          opening: reply.opening,
          explanations: reply.explanations.map(function (e) { return { id: e.id, text: e.text }; })
        };
        return { draft: draft, reason: '', usage: usage };
      } catch (err) {
        return none(String(err && err.message ? err.message : err));
      }
    }
  };
}

function GeminiDrafter() {
  var key = PropertiesService.getScriptProperties().getProperty(PROP_GEMINI_API_KEY);
  return buildDrafter(function (request) {
    if (!key) throw new Error('Script Property ' + PROP_GEMINI_API_KEY + ' is not set.');
    var res = UrlFetchApp.fetch(request.url, {
      method: 'post', contentType: 'application/json', headers: { 'x-goog-api-key': key },
      payload: JSON.stringify(request.body), muteHttpExceptions: true
    });
    return { status: res.getResponseCode(), text: res.getContentText() };
  });
}

// Mailer: plain-text email from the owner's account.
function GmailMailer() {
  return { send: function (to, subject, body) { MailApp.sendEmail(to, subject, body); } };
}

// Calendar: all-day events on the owner's default calendar. Noon is used so the day holds
// whichever zone the calendar reads the date in.
function GoogleCalendar() {
  return {
    createAllDay: function (title, isoDate) {
      var p = isoDate.split('-');
      var day = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
      return CalendarApp.getDefaultCalendar().createAllDayEvent(title, day).getId();
    },
    deleteEvent: function (eventId) {
      var event = CalendarApp.getDefaultCalendar().getEventById(eventId);
      if (event) event.deleteEvent();
    }
  };
}

// Cursor: the daily job's saved place, kept in Script Properties as JSON.
function ScriptCursor() {
  var props = PropertiesService.getScriptProperties();
  return {
    get: function () {
      var raw = props.getProperty(PROP_DAILY_CURSOR);
      return raw ? JSON.parse(raw) : null;
    },
    set: function (cursor) { props.setProperty(PROP_DAILY_CURSOR, JSON.stringify(cursor)); },
    clear: function () { props.deleteProperty(PROP_DAILY_CURSOR); }
  };
}

// Timers: the one-off timers that continue a daily pass. Each one fires once and is deleted by the next run.
function ScriptTimers() {
  return {
    scheduleContinuation: function (ms) { ScriptApp.newTrigger('continueDailyJob').timeBased().after(ms).create(); },
    clearContinuations: function () {
      ScriptApp.getProjectTriggers().forEach(function (t) {
        if (t.getHandlerFunction() === 'continueDailyJob') ScriptApp.deleteTrigger(t);
      });
    }
  };
}

// Clock: today and now in the script time zone.
function ScriptClock() {
  var tz = Session.getScriptTimeZone();
  return {
    today: function () { return Utilities.formatDate(new Date(), tz, 'yyyy-MM-dd'); },
    now: function () { return Utilities.formatDate(new Date(), tz, "yyyy-MM-dd'T'HH:mm:ss"); }
  };
}

// Calibration: read every sample PDF with the real Reader and compare each value to the
// manifest the generator wrote (docs/decisions.md, Phase 2). The owner runs runCalibration
// from the script editor after uploading test-fixtures/sample-cois/* to the Drive folder. It then reads
// every active row of calibration_samples, the samples from accountant corrections (src/Flywheel.gs).

// Files load alphabetically and share one scope, so nothing here reads another file's
// variable until a function runs.
var CALIBRATION_REPORT = 'calibration-report.md';

function calibrationFolderPath() { return DRIVE_ROOT + '/calibration'; }

function calibrationFields() {
  return ['insured_name']
    .concat(LIMIT_FIELDS.map(function (f) { return 'limits.' + f; }))
    .concat(FLAG_FIELDS, ['cancellation_notice_days', 'expiration_date']);
}

function valueAt(values, path) {
  return path.split('.').reduce(function (o, key) { return o == null ? undefined : o[key]; }, values);
}

// entry: one manifest sample. Returns { pass, confidenceOk, rows }.
function compareToManifest(reading, entry) {
  if (!entry.readable) {
    var ok = !reading.readable && reading.values === null && typeof reading.reason === 'string' && reading.reason.length > 0;
    return { pass: ok, confidenceOk: true, rows: [] };
  }
  if (!reading.readable) {
    return { pass: false, confidenceOk: false, rows: [{ field: 'readable', expected: true, found: false, pass: false }] };
  }
  var rows = calibrationFields().map(function (field) {
    var expected = valueAt(entry.expected, field);
    var found = valueAt(reading.values, field);
    return { field: field, expected: expected, found: found === undefined ? null : found, pass: found === expected };
  });
  var confidenceOk = reading.confidence >= CONFIDENCE_GATE;
  return { pass: confidenceOk && rows.every(function (r) { return r.pass; }), confidenceOk: confidenceOk, rows: rows };
}

// items: [{ file, problem, reading, result }]. Markdown, so it reads in the log and as a file.
// correctionItems (optional) are the samples from accountant corrections (src/Flywheel.gs). When there
// are any, the report has two sections and two totals; when there are none it reads as before.
function formatCalibrationReport(items, correctionItems) {
  var lines = ['# Calibration report', ''];
  var passed = function (list) { return list.filter(function (i) { return i.result.pass; }).length; };
  if (!correctionItems || !correctionItems.length) {
    lines = lines.concat(calibrationItemLines(items, '## '));
    lines.push('Total: ' + passed(items) + ' of ' + items.length + ' samples pass.');
    return lines.join('\n');
  }
  lines.push('## Hand-built set', '');
  lines = lines.concat(calibrationItemLines(items, '### '));
  lines.push('## From corrections', '');
  lines = lines.concat(calibrationItemLines(correctionItems, '### '));
  lines.push('Hand-built set: ' + passed(items) + ' of ' + items.length + ' pass.');
  lines.push('From corrections: ' + passed(correctionItems) + ' of ' + correctionItems.length + ' pass.');
  return lines.join('\n');
}

// One heading per sample, then its field table and any confidence note.
function calibrationItemLines(items, heading) {
  var lines = [];
  items.forEach(function (item) {
    var r = item.reading;
    var detail = r.readable ? 'confidence ' + r.confidence : 'unreadable: ' + r.reason;
    lines.push(heading + item.file + ' (' + item.problem + '): ' + (item.result.pass ? 'PASS' : 'FAIL') + ', ' + detail, '');
    if (item.result.rows.length) {
      lines.push('| Field | Manifest | Read | Result |', '|---|---|---|---|');
      item.result.rows.forEach(function (row) {
        lines.push('| ' + row.field + ' | ' + row.expected + ' | ' + row.found + ' | ' + (row.pass ? 'pass' : 'FAIL') + ' |');
      });
      lines.push('');
    }
    if (r.readable && !item.result.confidenceOk) {
      lines.push('Confidence ' + r.confidence + ' is below ' + CONFIDENCE_GATE + '.', '');
    }
  });
  return lines;
}

function calibrationFolder() {
  if (isDemoMode()) throw new Error(demoRefusal('calibrationFolder').message);
  return calibrationFolder_();
}

function calibrationFolder_() {
  var folder = DriveApp.getRootFolder();
  calibrationFolderPath().split('/').forEach(function (name) {
    var it = folder.getFoldersByName(name);
    folder = it.hasNext() ? it.next() : folder.createFolder(name);
  });
  return folder;
}

// Owner runs this from the script editor. Makes one Gemini call per sample.
// One calibration read, with its ai_calls row (purpose 'calibration').
function readAndMeter(deps, file) {
  var reading = deps.reader.read(file);
  recordAiCall(deps.store, deps.clock, deps.newToken, GEMINI_MODEL, reading.usage, {
    purpose: 'calibration', outcome: reading.readable ? 'ok' : 'unreadable', outcome_reason: reading.reason || ''
  });
  return reading;
}

function runCalibration() {
  if (isDemoMode()) return demoRefusal('runCalibration');
  return runCalibration_();
}

function runCalibration_() {
  var folder = calibrationFolder_();
  var manifestFiles = folder.getFilesByName('manifest.json');
  if (!manifestFiles.hasNext()) {
    throw new Error('manifest.json is not in the Drive folder ' + calibrationFolderPath() + '. Upload everything in test-fixtures/sample-cois/ there, then run again.');
  }
  var manifest = JSON.parse(manifestFiles.next().getBlob().getDataAsString());
  // Each read writes one ai_calls row with purpose 'calibration' (Metering.gs). Needs SHEET_ID, so run setupDemo first.
  var deps = realDeps(GeminiReader());
  var items = manifest.samples.map(function (entry) {
    var files = folder.getFilesByName(entry.file);
    if (!files.hasNext()) throw new Error(entry.file + ' is not in ' + calibrationFolderPath() + '.');
    var reading = readAndMeter(deps, { name: entry.file, fingerprint: '', link: files.next().getUrl() });
    return { file: entry.file, problem: entry.problem, reading: reading, result: compareToManifest(reading, entry) };
  });
  // Then every active sample from an accountant correction. Its PDF stays where the upload filed it.
  var store = deps.store;
  withScriptLock(function () { store.ensureTab('calibration_samples', SCHEMA.calibration_samples); });
  var samples = correctionCalibrationEntries(store.readRows('calibration_samples'));
  var correctionItems = samples.map(function (entry) {
    var reading = readAndMeter(deps, { name: entry.file, fingerprint: '', link: entry.link });
    return { file: entry.file, problem: entry.problem, reading: reading, result: compareToManifest(reading, entry) };
  });
  var report = formatCalibrationReport(items, correctionItems);
  var old = folder.getFilesByName(CALIBRATION_REPORT);
  while (old.hasNext()) old.next().setTrashed(true);
  folder.createFile(CALIBRATION_REPORT, report, MimeType.PLAIN_TEXT);
  console.log(report);
  return report;
}

// Entry points: the internal web app and the owner's setup run.

function realDeps(reader) {
  var props = PropertiesService.getScriptProperties().getProperties();
  var sheetId = props[PROP_SHEET_ID];
  if (!sheetId) throw new Error('Script Property ' + PROP_SHEET_ID + ' is not set. Run setupDemo first.');
  return {
    store: SheetStore(sheetId), reader: reader, mailer: GmailMailer(), clock: ScriptClock(), newToken: Utilities.getUuid,
    calendar: GoogleCalendar(), cursor: ScriptCursor(), timers: ScriptTimers(),
    uploadBaseUrl: props[PROP_UPLOAD_BASE_URL] || '',
    internalBaseUrl: props[PROP_INTERNAL_BASE_URL] || ''
  };
}

// Writes the run time of one page call to the execution log, so a slow call shows up by name.
function timed(name, fn) {
  var start = Date.now();
  try { return fn(); } finally { console.log(name + ' ' + (Date.now() - start) + ' ms'); }
}

// Owner runs this from the script editor: builds the Sheet and Drive tree, seeds the
// sample project and sends one canned certificate through the whole path. The editor's
// Execution log shows only printed lines, so the result is printed as well as returned.
function setupDemo() {
  if (isDemoMode()) return demoRefusal('setupDemo');
  return setupDemo_();
}

// Private version for the owner to run from the script editor, where demo mode does not apply.
function setupDemo_() {
  var message = buildDemo_();
  console.log(message);
  return message;
}

function buildDemo() {
  if (isDemoMode()) return demoRefusal('buildDemo');
  return buildDemo_();
}

function buildDemo_() {
  var props = PropertiesService.getScriptProperties();
  var deps = withScriptLock(function () {
    if (!props.getProperty(PROP_SHEET_ID)) {
      var created = SpreadsheetApp.create(DRIVE_ROOT + ' data');
      props.setProperty(PROP_SHEET_ID, created.getId());
    }
    var ss = SpreadsheetApp.openById(props.getProperty(PROP_SHEET_ID));
    // Dates read back in the Sheet's zone; match the script's so ISO dates do not shift.
    ss.setSpreadsheetTimeZone(Session.getScriptTimeZone());
    var d = realDeps(FakeReader(SAMPLE_READING));
    initProject(d.store);
    var blank = ss.getSheetByName('Sheet1');
    if (blank) ss.deleteSheet(blank);
    DriveApp.getFileById(ss.getId()).moveTo(DriveApp.getRootFolder().getFoldersByName(DRIVE_ROOT).next());
    return d;
  });

  if (deps.store.readRows('projects').length) {
    withScriptLock(function () { fillSampleNames(deps.store); });
    var rec = deps.store.readRows('compliance_records')[0];
    var certId = rec.queued_certificate_id || rec.current_certificate_id || 'No certificate';
    return 'Already seeded; nothing changed. ' + certId + ' is ' + rec.status + '.';
  }
  seedSampleProject(deps);
  var token = deps.store.readRows('compliance_records')[0].upload_token;
  var result = processCertificate(deps, token, { name: 'ridgeline-coi.pdf', fingerprint: 'sample-ridgeline-1', link: '' });
  return 'Seeded ' + SAMPLE_PROJECT.name + '. ' + result.certificate_id + ' is ' + result.status + '.';
}

// A request with a t parameter is an upload link; any other request gets the worklist
// (docs/decisions.md, Phase 2: one script project carries both deployments).
function doGet(e) {
  if (e && e.parameter && e.parameter.t !== undefined) return uploadPage(e.parameter.t);
  var page = HtmlService.createTemplateFromFile('src/Worklist');
  var initial = openingView(e && e.parameter);

// The daily job: recompute every compliance record from its certificate, the queue and the date, send the
// 30 and 7 day reminders, run the pay check, and keep each accepted certificate on the calendar (docs/decisions.md, Phase 5).
// deps = { store, mailer, clock, calendar, cursor, timers, uploadBaseUrl }.
// The cursor is the saved place { date, after, projects }: the date the pass started on, the number of the
// last record done, and a checked and changed count for each project.

function idNumber(id) {
  return parseInt(String(id).replace(/\D/g, ''), 10) || 0;
}

function countText(n, word) {

function dayChangedRecord(before, after) {

    JSON.stringify(before.hold) !== JSON.stringify(after.hold);
}

function logDaily(deps, recordId, eventType, summary) {
  withScriptLock(function () {

// One record: recompute, mail, save if changed, then bring the calendar in line. Returns whether it changed.
// The mail goes before the save, inside the lock. A mail failure then saves nothing, so the log never says
// "reminder sent" for a reminder that was not, and the next daily run tries again.
function checkOneRecord(deps, recordId, date) {
  var store = deps.store;
  var done = withScriptLock(function () {
    var recRow = findRow(store.readRows('compliance_records'), 'record_id', recordId);
    var project = findRow(store.readRows('projects'), 'project_id', recRow.project_id);
    var record = loadRecord(store, recRow, date);
    var out = nextStatus(record, { type: 'day_passed', uploadLink: uploadLinkFor(deps, recRow) }, date, project.review_mode, TOLERANCE_MATRIX);
    // The pay check follows the day check on the day's own result (docs/decisions.md, Phase 5, ticket 08).
    var pay = nextStatus(out.record, { type: 'pay_check' }, date, project.review_mode, TOLERANCE_MATRIX);
    out = { record: pay.record, effects: out.effects.concat(pay.effects) };
    sendEffects(deps.mailer, out.effects, project, out.record);
    var changed = dayChangedRecord(record, out.record);
    if (changed) saveRecord(store, recordId, out.record, deps.clock.now(), '');
    return { project: project, record: out.record, changed: changed, calendar: calendarChanges(record, out.record) };
  });
  applyCalendar(deps, recordId, done.project, done.record, done.calendar);
  return done.changed;
}

// One run of the daily job. startNew is true for the daily timer, which starts a fresh pass and drops an
// unfinished one, and false for a one-off timer, which continues the saved pass. Returns
// { status: 'continues', processed }, { status: 'done', checked, changed }, { status: 'refused' } or { status: 'none' }.
function processDailyBatch(deps, startNew) {
  var store = deps.store;
  // The one-off timer that started this run has done its job.
  deps.timers.clearContinuations();
  var saved = deps.cursor.get();
  if (!startNew && !saved) return { status: 'none' };
  if (!deps.uploadBaseUrl) {
    deps.cursor.clear();
    logDaily(deps, '', 'daily_refused', 'The daily check did not run. The upload page address is not set. Set Script Property ' + PROP_UPLOAD_BASE_URL + ' first.');
    return { status: 'refused' };
  }
  // A Sheet built before a column was added gets the column now. Without it a value saved for that column
  // is dropped without a word, and the daily job would add the same calendar event every day.
  if (startNew) {
    withScriptLock(function () {
      Object.keys(SCHEMA).forEach(function (tab) { store.ensureTab(tab, SCHEMA[tab]); });
    });
  }
  var pass = startNew ? { date: deps.clock.today(), after: 0, projects: {} } : saved;

  var projectOf = {};
  store.readRows('compliance_records').forEach(function (r) { projectOf[r.record_id] = r.project_id; });
  var waiting = Object.keys(projectOf)
    .filter(function (id) { return idNumber(id) > pass.after; })
    .sort(function (a, b) { return idNumber(a) - idNumber(b); });
  var batch = waiting.slice(0, DAILY_BATCH_SIZE);

  batch.forEach(function (id) {
    var tally = pass.projects[projectOf[id]] || (pass.projects[projectOf[id]] = { checked: 0, changed: 0 });
    tally.checked += 1;
    try {
      if (checkOneRecord(deps, id, pass.date)) tally.changed += 1;
    } catch (err) {
      logDaily(deps, id, 'daily_failed', 'The daily check failed for this record. ' + String(err && err.message ? err.message : err));
    }
    pass.after = idNumber(id);
  });

  if (waiting.length > batch.length) {
    deps.cursor.set(pass);
    deps.timers.scheduleContinuation(DAILY_RETRIGGER_MS);
    return { status: 'continues', processed: batch.length };
  }
  deps.cursor.clear();
  var checked = 0;
  var changed = 0;
  Object.keys(pass.projects).forEach(function (projectId) {
    var t = pass.projects[projectId];
    checked += t.checked;
    changed += t.changed;
    logDaily(deps, projectId, 'daily_check', 'Daily check ran: ' + countText(t.checked, 'record') + ' checked, ' + t.changed + ' changed.');
  });
  return { status: 'done', checked: checked, changed: changed };
}

// Demo mode (docs/decisions.md, Phase 5, ticket 14): a visitor's changes live in the visitor's browser only.
// An action runs the normal code against an overlay store. The overlay store reads the real rows plus the
// browser's changed rows, and keeps every write in memory. The changed rows go back to the browser, which
// keeps them in sessionStorage and sends them with each later call. Nothing is written to the master data.

// The key column of each tab whose rows a write can change. Rows of other tabs (activity_log) only add.
var DEMO_KEY = { projects: 'project_id', subcontractors: 'sub_id', compliance_records: 'record_id', certificates: 'certificate_id', uploads: 'upload_id' };

// The browser's changed rows are untrusted. Keep only known tabs and columns, and plain values.
var DEMO_MAX_ROWS = 2000;
function cleanOverlay(raw) {
  var rows = {};
  var kept = 0;
  var given = raw && typeof raw === 'object' && raw.rows && typeof raw.rows === 'object' ? raw.rows : {};
  Object.keys(SCHEMA).forEach(function (tab) {
    if (!Array.isArray(given[tab])) return;
    given[tab].forEach(function (row) {
      if (!row || typeof row !== 'object' || kept >= DEMO_MAX_ROWS) return;
      var clean = {};
      SCHEMA[tab].forEach(function (c) {
        var v = row[c];
        if (v === null || typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') clean[c] = v;
      });
      if (DEMO_KEY[tab] && (clean[DEMO_KEY[tab]] === undefined || clean[DEMO_KEY[tab]] === '')) return;
      (rows[tab] || (rows[tab] = [])).push(clean);
      kept += 1;
    });
  });
  return { rows: rows };
}

function demoIndexOf(rows, key, value) {
  for (var i = 0; i < rows.length; i++) if (rows[i][key] === value) return i;
  return -1;
}

// Same interface as the Store. Reads: the base rows with the overlay laid over them.
// Writes: kept in the overlay. Files: never written. The base store is only read, once per tab.
function OverlayStore(base, overlay) {
  var rows = cleanOverlay(overlay).rows;
  var cache = {};
  function copy(row) { return Object.assign({}, row); }
  function put(tab, row) {
    var list = rows[tab] || (rows[tab] = []);
    var key = DEMO_KEY[tab];
    var at = key ? demoIndexOf(list, key, row[key]) : -1;
    if (at >= 0) list[at] = Object.assign({}, list[at], row);
    else list.push(copy(row));
  }
  function readRows(tab) {
    if (!cache[tab]) cache[tab] = base.readRows(tab);
    var out = cache[tab].map(copy);
    var key = DEMO_KEY[tab];
    (rows[tab] || []).forEach(function (row) {
      var at = key ? demoIndexOf(out, key, row[key]) : -1;
      if (at >= 0) out[at] = Object.assign(out[at], row);
      else out.push(copy(row));
    });
    return out;
  }
  return {
    ensureTab: function () {},
    ensureFolder: function () {},
    writeFile: function () { return ''; },
    writeBlob: function () { return ''; },
    readRows: readRows,
    appendRow: function (tab, row) { put(tab, row); },
    appendRows: function (tab, list) { list.forEach(function (row) { put(tab, row); }); },
    updateRow: function (tab, keyColumn, keyValue, patch) {
      if (DEMO_KEY[tab] !== keyColumn) throw new Error('Demo mode cannot update ' + tab + ' by ' + keyColumn + '.');
      if (demoIndexOf(readRows(tab), keyColumn, keyValue) < 0) throw new Error('No ' + tab + ' row with ' + keyColumn + ' = ' + keyValue);
      var change = {};
      Object.keys(patch).forEach(function (c) { if (patch[c] !== undefined) change[c] = patch[c]; });
      change[keyColumn] = keyValue;
      put(tab, change);
    },
    overlay: function () { return cleanOverlay({ rows: rows }); }
  };
}

// deps for a demo call: the real reads, an overlay store, and fakes for mail, calendar, timers and the cursor.
// No Reader: nothing in demo mode reads a certificate with Gemini.
function demoDeps(real, overlay) {
  return Object.assign({}, real, {
    store: OverlayStore(real.store, overlay), reader: null, mailer: FakeMailer(), calendar: FakeCalendar(),
    cursor: FakeCursor(), timers: FakeTimers()

}

      var n = p * 35 + i;
      var id = String(n).padStart(3, '0');
      var baseScope = scopes[(i - 1) % scopes.length];
      var subName = leads[(n - 1) % leads.length] + ' ' + tails[baseScope][Math.floor((n - 1) / leads.length) % 4] + ' ' + forms[(n - 1) % 3];
      if (n === 1) subName = 'Ridgeline Roofing LLC';
      if (n === 3) subName = 'Cedar Masonry LLC';
      if (n === 14) subName = 'Brightway Electric Inc.';
      var scope = n === 14 ? 'electrical' : baseScope;
      // 20 first names and 28 last names only repeat as a pair every 140 records, so each contact is unique.
      var contact = firstNames[(n - 1) % firstNames.length] + ' ' + lastNames[(n - 1) % lastNames.length];
      // Phones are 555-0100 to 555-0199 only. There are 140 subcontractors, so numbers repeat by index:
      // (n - 1) % 100 gives records 1 and 101 the same phone, 555-0100.
      var phone = '555-01' + String((n - 1) % 100).padStart(2, '0');
      var values = JSON.parse(JSON.stringify(SAMPLE_READING.values));
      values.insured_name = subName;
      values.expiration_date = addDays(today, 180 + i * 3);
      if (scope !== 'roofing' && scope !== 'earthwork') values.limits.pollution_liability = null;
      if (scope === 'cleaning') values.limits.umbrella = null;
      var kind = 'compliant';
      if (p === 0 && i === 1) kind = 'deficiency';
      if (p === 0 && i === 2) kind = 'awaiting';
      if (p === 0 && i === 3) kind = 'expired';
      if (p === 0 && i === 14) kind = 'misread';
      if (p === 1 && i === 1) kind = 'expiring';
      if (p === 1 && i === 2) kind = 'low_confidence';
      if (p === 1 && i === 3) kind = 'unreadable';
      if (p === 2 && i === 1) kind = 'missing_w9';
      if (kind === 'expired') values.expiration_date = addDays(today, -8);
      if (kind === 'expiring') values.expiration_date = addDays(today, 18);
      if (kind === 'deficiency') {
        values.insured_name = 'Ridgeline Roofing Partners LLC';
        values.limits.umbrella = 1000000;
      }
      rows.push({ record_id: 'REC-' + id, sub_id: 'SUB-' + id, project_id: 'PRJ-00' + (p + 1),
        project: name, name: subName, scope: scope, trade: trades[scope], contact: contact, phone: phone, kind: kind, values: values,
        amount: kind === 'expired' ? 6250 : kind === 'missing_w9' ? 2800 : 0 });
    }
  });
  return rows;
}

// One page in an original sample layout. All content is ASCII, so string lengths are byte lengths.
function demoCertificatePdf(values, subName, projectName) {
  var lines = ['SAMPLE: fictional certificate', 'Certificate of insurance', 'Original demonstration form',
    'Insured: ' + values.insured_name, 'Subcontractor: ' + subName, 'Project: ' + projectName, ''];
  COI_LIMITS.forEach(function (field) { lines.push(COI_LABEL[field] + ': ' + (values.limits[field] == null ? 'Not shown' : formatUsd(values.limits[field]))); });
  lines.push('Additional insured endorsement: ' + (values.additional_insured_endorsement ? 'Printed' : 'Not printed'));
  lines.push('Project address: ' + (values.project_address ? 'Printed' : 'Not printed'));
  lines.push('Certificate holder: ' + (values.certificate_holder ? 'Harborline Builders' : 'Not printed'));
  lines.push('Cancellation notice: ' + values.cancellation_notice_days + ' days');
  lines.push('Expires: ' + values.expiration_date);
  var stream = lines.map(function (line, i) {
    var text = line.replace(/[\\()]/g, '\\$&');
    return 'BT /F1 ' + (i < 2 ? 15 : 10) + ' Tf 42 ' + (750 - i * 28) + ' Td (' + text + ') Tj ET';
  }).join('\n');
  var objects = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [4 0 R] /Count 1 >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R >> >> /Contents 5 0 R >>',
    '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream'];
  var pdf = '%PDF-1.4\n', offsets = [];
  objects.forEach(function (obj, i) { offsets.push(pdf.length); pdf += (i + 1) + ' 0 obj\n' + obj + '\nendobj\n'; });
  var xref = pdf.length;
  pdf += 'xref\n0 6\n0000000000 65535 f \n';
  offsets.forEach(function (o) { pdf += String(o).padStart(10, '0') + ' 00000 n \n'; });
  return pdf + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n';
}

// Fill only an empty data store. IDs and the current date determine the sample.
function seedDemoPortfolio(deps) {
  var target = deps.store;
  if (target.readRows('compliance_records').length || target.readRows('projects').length) {
    return { ok: false, message: 'The data store is not empty. Existing records were kept.' };
  }
  var store = FakeStore();
  Object.keys(SCHEMA).forEach(function (tab) { store.ensureTab(tab, SCHEMA[tab]); });
  var today = deps.clock.today(), now = deps.clock.now();
  var samples = demoPortfolioRows(today);
  var names = [];
  samples.forEach(function (s) { if (names.indexOf(s.project) < 0) names.push(s.project); });
  withScriptLock(function () {
    names.forEach(function (name, i) {
      var project = Object.assign({}, SAMPLE_PROJECT, { project_id: 'PRJ-00' + (i + 1), name: name, created_date: today });
      store.appendRow('projects', project);
    });
    samples.forEach(function (s) {
      var sub = { sub_id: s.sub_id, name: s.name, scope_of_work: s.scope, email: s.sub_id.toLowerCase() + '@example.com',
        contact_name: s.contact, phone: s.phone, trade: s.trade };
      store.appendRow('subcontractors', sub);
      var project = findRow(store.readRows('projects'), 'project_id', s.project_id);

      store.appendRow('compliance_records', { record_id: s.record_id, project_id: s.project_id, sub_id: s.sub_id,
        subcontract_number: 'SC-' + s.record_id.slice(4), upload_token: deps.newToken(), status: 'awaiting',
        payment_hold: false, payment_hold_reasons: '[]', w9_on_file: s.kind !== 'missing_w9',
        reminder_30d_sent: false, reminder_7d_sent: false, closed: false, last_updated: now });
      var record = newRecord({ name: s.name, email: sub.email, scope: s.scope, w9: s.kind !== 'missing_w9' }, s.amount);
      var pdf = '';
      function receive(values, confidence, mode, suffix) {
        var certId = 'CERT-' + s.record_id.slice(4) + (suffix || '');
        var event = { type: 'certificate_received', file: { id: certId, fingerprint: 'sample-' + certId, readable: s.kind !== 'unreadable',
          confidence: confidence, values: s.kind === 'unreadable' ? null : values } };
        record = nextStatus(record, event, today, mode, TOLERANCE_MATRIX).record;
        if (['deficiency', 'expired', 'expiring', 'low_confidence', 'misread', 'missing_w9'].indexOf(s.kind) >= 0) {
          var content = demoCertificatePdf(s.values, s.name, s.project);
          pdf = target.writeBlob(subFolderPath(project, sub) + '/certificates', certId + '.pdf', deps.encodePdf(content), 'application/pdf');
        }
        // The seed sends no email. The approval email of an accepted sample certificate was never sent, so the seed
        // does not log it as a notice (the notification log reports what the code does).
        record.log.forEach(function (entry) {
          if (entry.notice === 'notice_certificate_approved' || entry.notice === 'notice_renewal_accepted') delete entry.notice;
        });
        saveRecord(store, s.record_id, record, now, pdf, 'certificate_received');
        record.log = [];
      }
      if (s.kind !== 'awaiting') {
        if (s.kind === 'misread') {
          receive(s.values, 0.96, 'review_deficiencies', '-CURRENT');
          var wrong = JSON.parse(JSON.stringify(s.values)); wrong.limits.commercial_liability = 2000000;
          receive(wrong, 0.96, 'review_all', '');
        } else receive(s.values, s.kind === 'low_confidence' ? 0.72 : 0.93,
          ['deficiency', 'low_confidence', 'unreadable'].indexOf(s.kind) >= 0 ? 'review_all' : 'review_deficiencies', '');
      }
      if (s.amount) {
        store.appendRow('pay_applications', { project_id: s.project_id, sub_id: s.sub_id, pay_cycle: addDays(today, 7), amount_billed_usd: s.amount });
        record = nextStatus(record, { type: 'pay_check' }, today, 'review_all', TOLERANCE_MATRIX).record;
        saveRecord(store, s.record_id, record, now, '', 'pay_check');
      }
      if (s.kind === 'awaiting') store.appendRow('activity_log', { record_id: s.record_id, time: now, who: 'System', event_type: 'record_created', summary: 'Record created; awaiting certificate.' });
    });
    // Sample ai_calls rows, so Data trust shows the AI cost in Share Proj.
    // Shaped from the cost model in docs/research/c4-gemini-api-cost.md. Replace with measured rows after the first
    // Demo Proj calibration run.
    demoAiCallRows(store.readRows('certificates'), today, now).forEach(function (row) {
      store.appendRow('ai_calls', Object.assign({ call_id: deps.newToken() }, row));
    });
    Object.keys(SCHEMA).forEach(function (tab) {
      var rows = store.readRows(tab);
      if (target.appendRows) target.appendRows(tab, rows);
      else rows.forEach(function (row) { target.appendRow(tab, row); });
    });
  });
  return { ok: true, message: 'Created four fictional projects and 140 compliance records. No emails were sent.', projects: 4, records: samples.length };
}

// About 40 read calls this month, one per seeded certificate, near 1,700 tokens in and 300 out with a small fixed
// spread, so every seed run is the same. Cost comes from meterCall. Rows carry no call_id; the caller adds it.
// A call lands on a day from the 1st to yesterday, or at now on the 1st of the month.
function demoAiCallRows(certificates, today, now) {
  var dayOfMonth = Number(String(today).slice(8, 10));
  var monthStart = String(today).slice(0, 8) + '01';
  return certificates.slice(0, 40).map(function (cert, i) {
    var usage = { promptTokenCount: 1700 + (i * 37) % 121 - 60, candidatesTokenCount: 300 + (i * 13) % 41 - 20 };
    var call = meterCall(GEMINI_MODEL, usage, 'read');
    var hour = 8 + i % 9, minute = (i * 7) % 60;
    var time = dayOfMonth > 1 ? addDays(monthStart, i % (dayOfMonth - 1)) + 'T' + (hour < 10 ? '0' : '') + hour + ':' +
      (minute < 10 ? '0' : '') + minute + ':00' : now;
    var unreadable = cert.queue_reason === 'Unreadable file';
    return {
      time: time, purpose: call.purpose, model: call.model, record_id: cert.record_id, certificate_id: cert.certificate_id,
      input_tokens: call.input_tokens, output_tokens: call.output_tokens, thinking_tokens: call.thinking_tokens,
      cost_usd: call.cost_usd, outcome: unreadable ? 'unreadable' : 'ok', outcome_reason: unreadable ? 'The model could not read the certificate.' : ''
    };
  });
}

// Attach the seeded certificate PDF when first opened. Pending readings already have PDFs.
function ensureSamplePdfLink(deps, recordId) {

// The seeded certificate PDF a record shows, built in memory: { certificateId, folder, text }.
// Null when the shown certificate is not a seeded sample.
function samplePdf(store, recordId) {
  var row = findRow(store.readRows('compliance_records'), 'record_id', recordId);

// Demo mode: the PDF as base64 with nothing saved. A saved PDF is read from Drive; a seeded certificate with
// no saved PDF is built in memory. Reads the real rows only, never the browser's overlay, so a visitor
// cannot point the call at another Drive file.
function demoPdfData(deps, recordId, readDrive) {
  var link = recordPdfLink(deps, recordId);
  if (link) return readDrive(link);
  var sample = samplePdf(deps.store, recordId);
  return sample ? deps.encodePdf(sample.text) : '';
}

// AI drafts of the people-facing messages (docs/decisions.md, Phase 6). The model writes wording only:
// one opening sentence and one line per deficiency. Code writes every fact line, the closing and the link.
// The model receives no source amounts, dates or names. The check rejects common number, date, link and ID forms.
// The check cannot prove tone or facts or detect every personal name. A rejected draft uses the template.

// Who reads each kind of message.
var DRAFT_AUDIENCE = { deficiency_notice: 'project manager', correction_request: 'subcontractor' };

var DRAFT_OPENING_MAX = 200;
var DRAFT_EXPLANATION_MAX = 240;

var DRAFT_SCHEMA = {
  type: 'object', required: ['opening', 'explanations'],
  properties: {
    opening: { type: 'string' },
    explanations: { type: 'array', items: { type: 'object', required: ['id', 'text'],
      properties: { id: { type: 'string' }, text: { type: 'string' } } } }
  }
};

var DRAFT_PROMPT = [
  'You write short, plain emails for a construction firm\'s insurance compliance team.',
  'Audience: {audience}. Tone: polite, direct, no blame.',
  'You get a list of problems with a certificate of insurance, each with an id, a kind and the field it is about.',
  'Kind "limit" means a coverage limit is missing or too low. Kind "requirement" means something the project needs is not on the certificate.',
  'Write one opening sentence. Then, for each id, one sentence saying what fixes the problem, such as what to ask the insurance agent for.',
  'The system prints the facts above each of your sentences, so do not repeat them and do not count the problems.',
  'Never write a number, an amount, a date, a link or a name. The system adds those.',
  'Use each id you were given exactly once, and no other id.'
].join('\n');

// A deficiency has no id of its own (evaluateCoi returns { field, kind, text }). Its id is its position
// from 1 and its kind, such as D1-limit. evaluateCoi lists deficiencies in a fixed order and the
// certificate row stores that list, so the id of a stored deficiency never changes.
function draftIds(deficiencies) {
  return deficiencies.map(function (d, i) { return 'D' + (i + 1) + '-' + d.kind; });
}

// All the model is told about a certificate: the audience, and per deficiency its id, kind and field label.
function draftInput(audience, deficiencies) {
  var ids = draftIds(deficiencies);
  return {
    audience: audience,
    items: deficiencies.map(function (d, i) { return { id: ids[i], kind: d.kind, field_label: COI_LABEL[d.field] }; })
  };
}

// reply = the parsed model JSON. ids = the deficiency ids sent. Returns { ok, reason }. Pure.
// Only the text is checked for digits: the ids carry digits by design.
function checkDraft(reply, ids) {
  function fail(reason) { return { ok: false, reason: reason }; }
  if (!reply || typeof reply.opening !== 'string' || !Array.isArray(reply.explanations)) return fail('not the expected shape');
  var shapeOk = reply.explanations.every(function (e) { return e && typeof e.id === 'string' && typeof e.text === 'string'; });
  if (!shapeOk) return fail('not the expected shape');
  var texts = [reply.opening].concat(reply.explanations.map(function (e) { return e.text; }));
  if (texts.some(function (t) { return !t.trim(); })) return fail('empty text');
  if (texts.some(function (t) { return /[0-9]/.test(t); })) return fail('contains a number');
  if (texts.some(function (t) { return /[$€£]/.test(t); })) return fail('contains a currency sign');
  var numberWords = /\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundreds?|thousands?|millions?|billions?|trillions?|dozens?|half|halves|quarters?|percent|percentage|dollars?|cents?|euros?|pounds?)\b/i;
  if (texts.some(function (t) { return numberWords.test(t); })) return fail('contains a number word');
  // Lowercase "may" remains a modal verb. A capitalized May or a date phrase is rejected.
  var namedDates = /\b(january|jan|february|feb|march|mar|april|apr|june|jun|july|jul|august|aug|september|sept?|october|oct|november|nov|december|dec|monday|mon|tuesday|tues?|wednesday|wed|thursday|thu(?:rs?)?|friday|fri|saturday|sat|sunday|sun|today|tomorrow|yesterday|tonight)\b/i;
  if (texts.some(function (t) {
    return namedDates.test(t) || /\bMay\b/.test(t) || /\b(by|before|after|on|in|until|during|through|due|next|this|last)\s+may\b/i.test(t);
  })) return fail('contains a date');
  var links = /http|www\.|\b[a-z][a-z0-9+.-]*:\/\/|\b(mailto|javascript|data):|\b(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}\b/i;
  if (texts.some(function (t) { return links.test(t); })) return fail('contains a link');
  var embeddedIds = /\b(CERT|REC|PRJ|SUB|UPL|DRF|SMP|SC|POLICY|ID)[-_][a-z][a-z_-]*\b|\b[a-f]{8}(?:-[a-f]{4}){3}-[a-f]{12}\b/i;
  if (texts.some(function (t) { return embeddedIds.test(t); })) return fail('contains an id');
  var seen = [];
  for (var i = 0; i < reply.explanations.length; i++) {
    var id = reply.explanations[i].id;
    if (ids.indexOf(id) < 0) return fail('unknown id ' + id);
    if (seen.indexOf(id) >= 0) return fail('repeated id ' + id);
    seen.push(id);
  }
  var missing = ids.filter(function (id) { return seen.indexOf(id) < 0; })[0];
  if (missing) return fail('missing id ' + missing);
  if (reply.opening.length > DRAFT_OPENING_MAX) return fail('opening is over ' + DRAFT_OPENING_MAX + ' characters');
  var long = reply.explanations.some(function (e) { return e.text.length > DRAFT_EXPLANATION_MAX; });
  if (long) return fail('an explanation is over ' + DRAFT_EXPLANATION_MAX + ' characters');
  return { ok: true, reason: '' };
}

// Each fact line exactly as evaluateCoi wrote it, with the model's line for that deficiency under it.
function draftedLines(deficiencies, draft) {
  var ids = draftIds(deficiencies);
  var lines = [];
  deficiencies.forEach(function (d, i) {
    var said = draft.explanations.filter(function (e) { return e.id === ids[i]; })[0];
    lines.push('- ' + d.text);
    lines.push('  ' + said.text);
  });
  return lines;
}

// The email to the project manager. With draft null it is the template nextStatus sends, byte for byte. Pure.
function assembleDeficiencyNotice(subName, deficiencies, draft, recordLink) {
  var closing = 'Waive or reject?' + (recordLink ? ' Open the record: ' + recordLink : '');
  if (!draft) return subName + ': ' + deficiencies.map(function (d) { return d.text; }).join('; ') + '. ' + closing;
  return [subName + ': ' + draft.opening].concat(draftedLines(deficiencies, draft), [closing]).join('\n');
}

// The email to the subcontractor after a reject. With draft null it is correctionText, byte for byte. Pure.
function assembleCorrectionRequest(deficiencies, draft, uploadLink) {
  if (!draft) return correctionText(deficiencies, uploadLink);
  return [draft.opening].concat(draftedLines(deficiencies, draft), ['Please send a corrected certificate.'])
    .join('\n') + (uploadLink ? '\nUpload it here: ' + uploadLink : '');
}

// --- The ai_drafts tab ---

// Every ai_drafts row. A Sheet built before Phase 6 has no ai_drafts tab until the daily job adds it,
// and reads as no drafts. A missing draft means the template, so nothing is lost.
function draftRows(store) {
  try { return store.readRows('ai_drafts'); } catch (err) { return []; }
}

// The stored draft for a certificate and kind: { drafted_by, fallback_reason, draft }, or null. Pure.
function draftFromRows(rows, certificateId, kind) {
  var row = rows.filter(function (r) { return r.certificate_id === certificateId && r.kind === kind; })[0];
  if (!row) return null;
  var draft = null;
  if (row.drafted_by === 'AI') {
    try {
      draft = { opening: row.opening, explanations: JSON.parse(row.explanations_json || '[]') };
    } catch (err) {
      draft = null;
    }
  }
  return { drafted_by: row.drafted_by, fallback_reason: row.fallback_reason, draft: draft };
}

function findDraft(store, certificateId, kind) {
  return draftFromRows(draftRows(store), certificateId, kind);
}

// The model wording to show, or null for the template.
// Stored rows pass the same text and ID checks before display or send.
function usableDraft(found, deficiencies) {
  if (!found || found.drafted_by !== 'AI' || !found.draft) return null;
  return checkDraft(found.draft, draftIds(deficiencies)).ok ? found.draft : null;
}

// fields = { record_id, certificate_id, kind, drafted_by, fallback_reason, draft, call_id }. Writes once per
// certificate and kind: a second call for the same pair changes nothing. Call only inside withScriptLock.
function storeDraft(store, now, fields) {
  if (findDraft(store, fields.certificate_id, fields.kind)) return;
  store.appendRow('ai_drafts', {
    draft_id: nextId(store, 'ai_drafts', 'draft_id', 'DRF-'), record_id: fields.record_id, certificate_id: fields.certificate_id,
    kind: fields.kind, drafted_by: fields.drafted_by, fallback_reason: fields.fallback_reason || '',
    opening: fields.draft ? fields.draft.opening : '',
    explanations_json: fields.draft ? JSON.stringify(fields.draft.explanations) : '',
    call_id: fields.call_id || '', time: now
  });
}

// --- Wiring: the upload job drafts, the reject reads what was stored ---

// Drafts are on unless Script Property AI_DRAFTS is "off" (docs/decisions.md, Phase 6). Off forces the template.
function aiDraftsOn() {
  var v = PropertiesService.getScriptProperties().getProperty(PROP_AI_DRAFTS);
  return String(v == null ? '' : v).trim().toLowerCase() !== 'off';
}

// For a certificate that just landed in stage deficiency: draft both messages once and store them, AI or
// Template with the reason. The model call runs outside the lock; the rows are written under it.
// In Share Proj, or with no drafter in deps, it calls nothing, writes nothing and returns null.
function ensureDrafts(deps, recordId, cert) {
  if (!deps.drafter || isDemoMode()) return null;
  var deficiencies = cert.check.deficiencies;
  var on = aiDraftsOn();
  var made = {};
  Object.keys(DRAFT_AUDIENCE).forEach(function (kind) {
    if (findDraft(deps.store, cert.id, kind)) return;
    made[kind] = on ? deps.drafter.draft(DRAFT_AUDIENCE[kind], deficiencies)
      : { draft: null, reason: 'AI drafts are off (Script Property ' + PROP_AI_DRAFTS + ').', usage: null, skipped: true };
  });
  // One ai_calls row per model call that came back with usage (recordAiCall takes the lock itself). A skipped
  // draft or a request that failed outright has no usage and writes none.
  Object.keys(made).forEach(function (kind) {
    var m = made[kind];
    m.call_id = '';
    if (m.skipped || !m.usage) return;
    try {
      m.call_id = recordAiCall(deps.store, deps.clock, deps.newToken, GEMINI_MODEL, m.usage, {
        purpose: 'draft', record_id: recordId, certificate_id: cert.id,
        outcome: m.draft ? 'ok' : 'rejected', outcome_reason: m.reason
      });
    } catch (err) { console.log('The ai_calls row was not written. ' + String(err && err.message ? err.message : err)); }
  });
  withScriptLock(function () {
    Object.keys(made).forEach(function (kind) {
      var m = made[kind];
      storeDraft(deps.store, deps.clock.now(), {
        record_id: recordId, certificate_id: cert.id, kind: kind, call_id: m.call_id,
        drafted_by: m.draft ? 'AI' : 'Template', fallback_reason: m.reason, draft: m.draft
      });
    });
  });
  return {
    deficiency_notice: findDraft(deps.store, cert.id, 'deficiency_notice'),
    correction_request: findDraft(deps.store, cert.id, 'correction_request')
  };
}

// The effects with the text of one message swapped. nextStatus stays pure and emits the template text;
// the effect whose text is exactly that template is the one to swap.
function replaceEffectText(effects, template, text) {
  return effects.map(function (e) { return e.text === template ? Object.assign({}, e, { text: text }) : e; });
}

// Upload job, after the save and before sendEffects. When the deficiency email is about to go, draft both
// messages (once) and send the drafted notice. Any failure here sends the template: the email always goes.
function withDeficiencyDraft(deps, recordId, record, effects, recordLink) {
  var cert = record.pending;
  if (!cert || cert.stage !== 'deficiency' || !cert.check) return effects;
  var deficiencies = cert.check.deficiencies;
  var template = assembleDeficiencyNotice(record.sub.name, deficiencies, null, recordLink);
  if (!effects.some(function (e) { return e.text === template; })) return effects;
  var stored;
  try { stored = ensureDrafts(deps, recordId, cert); } catch (err) { stored = null; }
  var draft = stored && aiDraftsOn() ? usableDraft(stored.deficiency_notice, deficiencies) : null;
  if (!draft) return effects;
  return replaceEffectText(effects, template, assembleDeficiencyNotice(record.sub.name, deficiencies, draft, recordLink));
}

// The preview and send path use the same stored wording. Off forces the template. No model call.
function correctionRequestText(store, cert, uploadLink) {
  if (!cert || !cert.check) return '';
  var deficiencies = cert.check.deficiencies;
  var draft = usableDraft(findDraft(store, cert.id, 'correction_request'), deficiencies);
  if (draft && !aiDraftsOn()) draft = null;
  return assembleCorrectionRequest(deficiencies, draft, uploadLink);
}

// Reject, before sendEffects: use the same text as the approval preview. No model call.
function withCorrectionDraft(store, cert, effects, uploadLink) {
  if (!cert || !cert.check) return effects;
  return replaceEffectText(effects, correctionText(cert.check.deficiencies, uploadLink), correctionRequestText(store, cert, uploadLink));
}

// Compliance core: the comparison logic. Pure: no Google services.
// Every limit comes from the tolerance matrix; this file holds no dollar amounts
// (scripts/checks/dollar-amounts.js enforces it). Keep other code out of this file.

var COI_LIMITS = ['commercial_liability', 'aggregate', 'auto', 'umbrella', 'workers_comp', 'pollution_liability', 'professional_liability'];
var COI_CHECKS = ['additional_insured_endorsement', 'project_address', 'certificate_holder', 'insured_name_matches'];
var COI_LABEL = {
  commercial_liability: 'General liability', aggregate: 'Aggregate', auto: 'Auto', umbrella: 'Umbrella',
  workers_comp: "Workers' comp", pollution_liability: 'Pollution', professional_liability: 'Professional',
  additional_insured_endorsement: 'Additional insured endorsement', project_address: 'Project address',
  certificate_holder: 'Certificate holder', insured_name_matches: 'Insured name', cancellation_notice_days: 'Cancellation notice'
};

function formatUsd(n) {
  return '$' + Number(n).toLocaleString('en-US');
}

function normalizeName(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

function mergeRules(scope, matrix) {
  var rules = JSON.parse(JSON.stringify(matrix.default));
  var overrides = matrix.scopes[scope] || {};
  Object.keys(overrides).forEach(function (k) { rules[k] = Object.assign({}, rules[k], overrides[k]); });
  return rules;
}

// Seam: evaluateCoi(extracted, scope, matrix, context). context.insuredName is the subcontractor's name.
function evaluateCoi(extracted, scope, matrix, context) {
  var rules = mergeRules(scope, matrix);
  var v = Object.assign({}, extracted, {
    insured_name_matches: normalizeName(extracted.insured_name) === normalizeName(context && context.insuredName)
  });
  var limits = v.limits || {};
  var deficiencies = [];
  var lines = [];
  function line(field, found, required, pass) {
    lines.push({ field: field, label: COI_LABEL[field], found: found, required: required, pass: pass });
  }
  COI_LIMITS.forEach(function (f) {
    var rule = rules[f];
    if (!rule.required) return;
    var found = limits[f];
    var needs = rule.minimum != null ? formatUsd(rule.minimum) : 'Any amount';
    if (found == null) {
      deficiencies.push({ field: f, kind: 'limit', text: COI_LABEL[f] + ': not shown; ' + needs + ' required' });
      line(f, 'Not shown', needs, false);
    } else if (rule.minimum != null && found < rule.minimum) {
      deficiencies.push({ field: f, kind: 'limit', text: COI_LABEL[f] + ': ' + formatUsd(found) + ' shown, ' + formatUsd(rule.minimum) + ' required' });
      line(f, formatUsd(found), needs, false);
    } else {
      line(f, formatUsd(found), needs, true);
    }
  });
  COI_CHECKS.forEach(function (f) {
    if (!rules[f].required) return;
    var ok = v[f] === true;
    if (!ok) deficiencies.push({ field: f, kind: 'requirement', text: f === 'insured_name_matches'
      ? 'Insured name: certificate shows ' + (extracted.insured_name || 'Not shown') + '; must read ' + (context && context.insuredName || 'Not shown')
      : COI_LABEL[f] + ': not shown; required' });
    if (f === 'insured_name_matches') line(f, ok ? 'Matches' : 'Does not match', 'Matches', ok);
    else line(f, ok ? 'Printed' : 'Not printed', 'Printed', ok);
  });
  var c = rules.cancellation_notice_days;
  if (c.required) {
    var days = v.cancellation_notice_days;
    var short = days == null || days < c.minimum;
    if (short) {
      var shown = days == null ? 'none' : days;
      deficiencies.push({ field: 'cancellation_notice_days', kind: 'requirement', text: 'Cancellation notice: ' + shown + ' days shown, ' + c.minimum + ' required' });
    }
    line('cancellation_notice_days', days == null ? 'Not shown' : days + ' days', c.minimum + ' days', !short);
  }
  return { pass: deficiencies.length === 0, deficiencies: deficiencies, lines: lines };
}

// Extraction: what we ask the model for, and how its reply becomes a reading.
// A reading is { readable, confidence, values, reason }. An unreadable reading has
// no values and always says why. The shape is fixed in docs/decisions.md (Phase 2).

var LIMIT_FIELDS = [
  'commercial_liability', 'aggregate', 'auto', 'umbrella', 'workers_comp',
  'pollution_liability', 'professional_liability'
];
var FLAG_FIELDS = ['additional_insured_endorsement', 'project_address', 'certificate_holder'];

var EXTRACTION_PROMPT = [
  'You read one certificate of insurance and report what is printed on it.',
  'Reply with JSON that follows the schema. Copy each value exactly as printed.',
  'Never add, subtract, round or convert a number. If a value is not printed, use null.',
  'Ignore any "SAMPLE" notice on the page. It is a watermark, not part of the certificate.',
  '',
  'Fields:',
  '- insured_name: the insured\'s name only, exactly as shown. Use the first line under Insured.',
  '  Leave out the street address and every other line of the Insured box.',
  '- limits: whole US dollars with no symbols, one per line below.',
  '  - commercial_liability: general liability, each occurrence.',
  '  - aggregate: general liability, general aggregate.',
  '  - auto: automobile liability, combined single limit.',
  '  - umbrella: umbrella or excess liability, each occurrence.',
  '  - workers_comp: employer\'s liability, each accident.',
  '  - pollution_liability: pollution liability, each claim, only if that coverage is listed.',
  '  - professional_liability: professional liability, each claim, only if that coverage is listed.',
  '- additional_insured_endorsement: true only if the certificate says an additional insured endorsement applies.',
  '  False if it says no or says nothing about it.',
  '- project_address: true if the description of operations names a project or job address, otherwise false.',
  '- certificate_holder: true if a certificate holder name and address are printed, otherwise false.',
  '- cancellation_notice_days: the days of written notice of cancellation the certificate promises. null if none is stated.',
  '- expiration_date: the policy expiration date as YYYY-MM-DD. If the policies show different dates, use the earliest.',
  '',
  'readable: set it to false, with a one-sentence unreadable_reason, if the file is blank, is not a certificate of insurance or cannot be read.',
  'Then set confidence to 0 and every value to null.',
  '',
  'confidence: one number from 0 to 1 for the whole reading.',
  'Use 0.9 or more only when every value is clearly printed.',
  'Lower it when text is faint, cut off or ambiguous, or when you had to choose between two readings.'
].join('\n');

function nullableType(type) {
  return { type: [type, 'null'] };
}

// The structured-output schema sent with every request. Field order matches the decision.
var EXTRACTION_SCHEMA = (function () {
  var limits = {};
  LIMIT_FIELDS.forEach(function (f) { limits[f] = nullableType('number'); });
  return {
    type: 'object',
    properties: {
      readable: { type: 'boolean' },
      unreadable_reason: nullableType('string'),
      confidence: { type: 'number' },
      values: {
        type: 'object',
        properties: {
          insured_name: nullableType('string'),
          limits: { type: 'object', properties: limits, required: LIMIT_FIELDS },
          additional_insured_endorsement: nullableType('boolean'),
          project_address: nullableType('boolean'),
          certificate_holder: nullableType('boolean'),
          cancellation_notice_days: nullableType('number'),
          expiration_date: nullableType('string')
        },
        required: ['insured_name', 'limits'].concat(FLAG_FIELDS, ['cancellation_notice_days', 'expiration_date'])
      }
    },
    required: ['readable', 'unreadable_reason', 'confidence', 'values']
  };
})();

function unreadableReading(reason) {
  return { readable: false, confidence: 0, values: null, reason: reason };
}

// Dollars arrive as numbers or as text such as "$1,000,000". Returns the number, or undefined.
function toDollars(v) {
  if (typeof v === 'number') return isFinite(v) && v >= 0 ? v : undefined;
  if (typeof v !== 'string') return undefined;
  var text = v.trim().replace(/^\$\s?/, '').replace(/,/g, '');
  return /^\d+(\.\d+)?$/.test(text) ? Number(text) : undefined;
}

function isCalendarDate(text) {
  if (typeof text !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(text)) return false;
  var p = text.split('-').map(Number);
  var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  return d.getUTCFullYear() === p[0] && d.getUTCMonth() === p[1] - 1 && d.getUTCDate() === p[2];
}

// The model's reply (JSON text or an object) in; a clean reading out.
function parseExtraction(reply) {
  var data = reply;
  if (typeof reply === 'string') {
    try { data = JSON.parse(reply); } catch (e) { return unreadableReading('The reply was not valid JSON.'); }
  }
  if (!data || typeof data !== 'object' || Array.isArray(data)) return unreadableReading('The reply was not a JSON object.');
  if (typeof data.readable !== 'boolean') return unreadableReading('The reply did not say whether the file was readable.');
  if (!data.readable) {
    return unreadableReading(typeof data.unreadable_reason === 'string' && data.unreadable_reason.trim()
      ? data.unreadable_reason.trim() : 'The model could not read the certificate.');
  }
  var c = data.confidence;
  if (typeof c !== 'number' || !isFinite(c) || c < 0 || c > 1) return unreadableReading('Confidence must be a number from 0 to 1.');
  var v = data.values;
  if (!v || typeof v !== 'object' || Array.isArray(v)) return unreadableReading('The reply has no values object.');

  var values = {};
  var name = typeof v.insured_name === 'string' ? v.insured_name.trim() : v.insured_name;
  if (name === undefined || name === null || name === '') return unreadableReading('Missing field: insured_name.');
  if (typeof name !== 'string') return unreadableReading('insured_name must be text.');
  values.insured_name = name;

  if (v.limits === undefined) return unreadableReading('Missing field: limits.');
  if (!v.limits || typeof v.limits !== 'object' || Array.isArray(v.limits)) return unreadableReading('limits must be an object.');
  values.limits = {};
  for (var i = 0; i < LIMIT_FIELDS.length; i++) {
    var f = LIMIT_FIELDS[i];
    var raw = v.limits[f];
    if (raw === undefined) return unreadableReading('Missing field: limits.' + f + '.');
    if (raw === null) { values.limits[f] = null; continue; }
    var dollars = toDollars(raw);
    if (dollars === undefined) return unreadableReading('limits.' + f + ' is not a dollar amount.');
    values.limits[f] = dollars;
  }

  for (var j = 0; j < FLAG_FIELDS.length; j++) {
    var flag = FLAG_FIELDS[j];
    if (v[flag] === undefined) return unreadableReading('Missing field: ' + flag + '.');
    if (typeof v[flag] !== 'boolean') return unreadableReading(flag + ' must be true or false.');
    values[flag] = v[flag];
  }

  var days = v.cancellation_notice_days;
  if (days === undefined) return unreadableReading('Missing field: cancellation_notice_days.');
  if (typeof days === 'string' && /^\d+$/.test(days.trim())) days = Number(days);
  if (days !== null && !(typeof days === 'number' && isFinite(days) && days >= 0 && Math.floor(days) === days)) {
    return unreadableReading('cancellation_notice_days must be a whole number of days or null.');
  }
  values.cancellation_notice_days = days;

  if (v.expiration_date === undefined || v.expiration_date === null) return unreadableReading('Missing field: expiration_date.');
  if (!isCalendarDate(v.expiration_date)) return unreadableReading('expiration_date must be YYYY-MM-DD.');
  values.expiration_date = v.expiration_date;

  return { readable: true, confidence: c, values: values, reason: null };
}

// Fake adapters: same interfaces as the real ones in Adapters.gs, held in memory.
// Tests use all of them; ticket 02's deployed path uses FakeReader for a canned reading.

// Store: Sheet tabs as arrays of row objects, Drive as folder and file paths.
function FakeStore() {
  var tabs = {};
  var rows = {};
  var folders = [];
  var files = [];
  return {
    ensureTab: function (name, columns) {
      if (!tabs[name]) { tabs[name] = columns.slice(); rows[name] = []; return; }
      // An older tab gains any column added since it was built.
      columns.forEach(function (c) {
        if (tabs[name].indexOf(c) >= 0) return;
        tabs[name].push(c);
        rows[name].forEach(function (r) { r[c] = ''; });
      });
    },
    ensureFolder: function (path) {
      if (folders.indexOf(path) < 0) folders.push(path);
    },
    writeFile: function (folder, name, content, mimeType) {
      var path = folder + '/' + name;
      files = files.filter(function (f) { return f.path !== path; });
      files.push({ path: path, content: content, mimeType: mimeType });
      return 'fake://' + path;
    },
    writeBlob: function (folder, name, base64, mimeType) {
      return this.writeFile(folder, name, 'base64:' + base64, mimeType);
    },
    readRows: function (tab) {
      return rows[tab].map(function (r) { return Object.assign({}, r); });
    },
    appendRow: function (tab, row) {
      var clean = {};
      tabs[tab].forEach(function (c) { clean[c] = row[c] === undefined ? '' : row[c]; });
      rows[tab].push(clean);
    },
    updateRow: function (tab, keyColumn, keyValue, patch) {
      var row = rows[tab].filter(function (r) { return r[keyColumn] === keyValue; })[0];
      if (!row) throw new Error('No ' + tab + ' row with ' + keyColumn + ' = ' + keyValue);
      tabs[tab].forEach(function (c) { if (patch[c] !== undefined) row[c] = patch[c]; });
    },
    snapshot: function () {
      return { tabs: tabs, rows: rows, folders: folders, files: files };
    }
  };
}

// Reader: returns the canned reading it was given, whatever the file.
function FakeReader(reading) {
  return { read: function () { return JSON.parse(JSON.stringify(reading)); } };
}

// Mailer: keeps every message instead of sending it.
function FakeMailer() {
  var sent = [];
  return {
    send: function (to, subject, body) { sent.push({ to: to, subject: subject, body: body }); },
    sent: function () { return sent.slice(); }
  };
}

// Calendar: all-day events held in memory. An ID is EVT-1, EVT-2 and so on, never reused.
function FakeCalendar() {
  var events = [];
  var made = 0;
  return {
    createAllDay: function (title, isoDate) {
      made += 1;
      events.push({ id: 'EVT-' + made, title: title, date: isoDate });
      return 'EVT-' + made;
    },
    deleteEvent: function (eventId) {
      events = events.filter(function (e) { return e.id !== eventId; });
    },
    events: function () { return events.slice(); }
  };
}

// Cursor: the daily job's saved place, held in memory (Script Properties in the real one).
function FakeCursor() {
  var saved = null;
  return {
    get: function () { return saved === null ? null : JSON.parse(JSON.stringify(saved)); },
    set: function (cursor) { saved = JSON.parse(JSON.stringify(cursor)); },
    clear: function () { saved = null; }
  };
}

// Timers: remembers each run asked for and how often the old one-off timers were cleared.
function FakeTimers() {
  var scheduled = [];
  var cleared = 0;
  return {
    scheduleContinuation: function (ms) { scheduled.push(ms); },
    clearContinuations: function () { cleared += 1; },
    scheduled: function () { return scheduled.slice(); },
    cleared: function () { return cleared; }
  };
}

// Clock: a fixed day and time.
function FakeClock(isoDate, isoTime) {
  return {
    today: function () { return isoDate; },
    now: function () { return isoTime || isoDate + 'T09:00:00'; }
  };
}

// Correction flywheel (docs/decisions.md, Phase 6): when an accountant corrects a reading, the PDF link
// and the corrected values become a calibration sample. Calibration then tests the next model against
// the firm's own hard cases as well as the hand-built set.

// pending = the certificate before correction. values = the corrected values. Returns a sample row, or null
// when nothing changed (the model was right) or the file was unreadable (nothing to calibrate against).
// The caller adds record_id and pdf_link. One row per certificate, so the certificate ID names the sample.
function sampleFromCorrection(pending, values, who, note, time) {
  if (!pending || !pending.values || isUnreadable(pending) || !values) return null;
  if (!correctionChanges(pending.values, values).length) return null;
  return {
