    var change = 'from ' + REVIEW_MODES[project.review_mode] + ' to ' + REVIEW_MODES[mode] + '.';
    store.updateRow('projects', 'project_id', projectId, { review_mode: mode });
    store.appendRow('activity_log', {
      record_id: projectId, time: deps.clock.now(), who: actorName(project, role),
      event_type: 'review_mode_changed', summary: 'Changed review mode ' + change
    });
    return { ok: true, message: 'Review mode changed ' + change };
  });
}

// The certificate a record shows: the one waiting, else the current one.
function shownCertificate(record) {
  return record.pending || record.current;
}

// Drive link of the PDF the record shows, or '' when it has none. The page asks for a record,
// never for a link, so it cannot ask for another Drive file.
function recordPdfLink(deps, recordId) {
  var store = deps.store;
  var recRow = findRow(store.readRows('compliance_records'), 'record_id', recordId);
  if (!recRow) throw new Error('No such record.');
  var shown = shownCertificate(loadRecord(store, recRow));
  var certRow = shown ? findRow(store.readRows('certificates'), 'certificate_id', shown.id) : null;
  return certRow ? certRow.pdf_link : '';
}

// Everything the record page shows: the values against the requirements, the timeline,
// the confidence, the PDF link and, for an unreadable file, the resend draft.
function recordDetail(deps, recordId) {
  var store = deps.store;
  var recRow = findRow(store.readRows('compliance_records'), 'record_id', recordId);
  if (!recRow) throw new Error('No such record.');
  var project = findRow(store.readRows('projects'), 'project_id', recRow.project_id);
  var record = loadRecord(store, recRow, deps.clock.today());
  var shown = shownCertificate(record);
  var certRow = shown ? findRow(store.readRows('certificates'), 'certificate_id', shown.id) : null;
  var lines = shown && shown.values
    ? evaluateCoi(shown.values, record.sub.scope, TOLERANCE_MATRIX, { insuredName: record.sub.name }).lines
    : [];
  var confirmation = store.readRows('activity_log').filter(function (a) {
    return a.record_id === recordId && a.event_type === 'reading_confirmed' && shown && (a.summary.indexOf(' ' + shown.id + '.') >= 0 || a.summary.indexOf(' ' + shown.id + ' with no changes.') >= 0);
  });
  var draft = null;
  if (isUnreadable(record.pending)) {
    var link = uploadLinkFor(deps, recRow);
    draft = {
      to: record.sub.email, subject: 'Certificate of insurance: ' + record.sub.name,
      body: resendText(link), ready: !!link
    };
  }
  return {
    record_id: recordId,
    project_id: project.project_id,
    project: project.name,
    subcontractor: record.sub.name,
    scope: record.sub.scope,
    status: STATUS_LABEL[deriveStatus(record, deps.clock.today())],
    w9_on_file: record.sub.w9,
    closed: record.closed,
    review_mode: project.review_mode,
    waiting: waitingLabel(record),
    next: nextStep(record),
    expiry: record.current ? record.current.expiration_date : '',
    queued_expiry: record.pending ? record.pending.expiration_date : '',
    last_updated: recRow.last_updated,
    received: shown ? shown.received : '',
    payment_hold: record.hold.on,
    hold_reasons: record.hold.reasons,
    billed_this_cycle_usd: record.billedThisCycle,
    check_result: shown && shown.check ? (shown.check.pass ? 'Pass' : 'Fail') : 'Not checked',
    waived: !!(shown && shown.decision && shown.decision.indexOf('waived') === 0),
    rejection_text: correctionRequestText(store, shown, uploadLinkFor(deps, recRow)),
    staff: { accountant: project.accountant_name, project_manager: project.project_manager_name, leadership: project.leadership_name },
    certificate_id: shown ? shown.id : '',
    confidence: shown ? shown.confidence : null,
    confidence_label: confirmation.length ? 'Confirmed' : shown && typeof shown.confidence === 'number' ? (Math.floor(shown.confidence * 10000) / 100).toLocaleString('en-US', {maximumFractionDigits:2}) + '%' : 'Not shown',
    reading_confirmed_by: confirmation.length ? confirmation[confirmation.length - 1].who : '',
    pdf_link: certRow ? certRow.pdf_link : '',
    values: shown ? shown.values : null,
    lines: lines,
    limit_fields: COI_LIMITS.map(function (f) { return { field: f, label: COI_LABEL[f] }; }),
    draft: draft,
    timeline: store.readRows('activity_log')
      .filter(function (a) { return a.record_id === recordId; })
      .map(function (a) { return { time: a.time, who: a.who, summary: a.summary, event_type: a.event_type }; }).reverse(),
    sample: 'Sample data'
  };
}

// ROI arithmetic is pure. Missing inputs suppress the affected lines.
function roiLines(document) {
  var inputs = document && document.inputs || {};
  var costs = ['min_per_cert_tool', 'monthly_check_min_tool', 'hours_per_audit_tool', 'api_cost_per_year_usd', 'upkeep_hours_per_month'];
  var cases = ['low', 'likely', 'high'];
  var definitions = [
    ['hours_saved_value_usd', 'Staff time saved', ['min_per_cert_today', 'min_per_cert_tool', 'certs_per_year', 'monthly_check_min_today', 'monthly_check_min_tool', 'projects', 'hourly_rate_usd'],
      function (x) { return ((x.min_per_cert_today - x.min_per_cert_tool) * x.certs_per_year + (x.monthly_check_min_today - x.monthly_check_min_tool) * 12 * x.projects) / 60 * x.hourly_rate_usd; }],
    ['lapse_risk_avoided_usd', 'Lapse risk avoided', ['lapses_paid_per_year', 'cost_per_incident_usd', 'catch_rate'],
      function (x) { return x.lapses_paid_per_year * x.cost_per_incident_usd * x.catch_rate; }],
    ['audit_prep_saved_usd', 'Audit prep saved', ['hours_per_audit_today', 'hours_per_audit_tool', 'audits_per_year', 'hourly_rate_usd'],
      function (x) { return (x.hours_per_audit_today - x.hours_per_audit_tool) * x.audits_per_year * x.hourly_rate_usd; }],
    ['api_cost_usd', 'Certificate reading spend', ['api_cost_per_year_usd'], function (x) { return x.api_cost_per_year_usd; }],
    ['upkeep_cost_usd', 'Upkeep', ['upkeep_hours_per_month', 'hourly_rate_usd'], function (x) { return x.upkeep_hours_per_month * 12 * x.hourly_rate_usd; }],
    ['running_cost_usd', 'Running cost', ['api_cost_per_year_usd', 'upkeep_hours_per_month', 'hourly_rate_usd'],
      function (x) { return x.api_cost_per_year_usd + x.upkeep_hours_per_month * 12 * x.hourly_rate_usd; }]
  ];
  function valid(key) {
    var v = inputs[key];
    return !!(v && typeof v.basis === 'string' && /^(sourced|estimate):\s*\S/.test(v.basis) && !/placeholder/i.test(v.basis) &&
      cases.every(function (c) { return typeof v[c] === 'number' && isFinite(v[c]) && v[c] >= 0; }) &&
      v.low <= v.likely && v.likely <= v.high &&
      (key !== 'catch_rate' || v.high <= 1));
  }
  function values(c) {
    var x = {};
    Object.keys(inputs).forEach(function (key) {
      var chosen = c;
      if (c !== 'likely' && costs.indexOf(key) >= 0) chosen = c === 'low' ? 'high' : 'low';
      x[key] = inputs[key][chosen];
    });
    if (c !== 'likely') {
      [['certs_per_year', x.min_per_cert_today - x.min_per_cert_tool],
        ['projects', x.monthly_check_min_today - x.monthly_check_min_tool],
        ['audits_per_year', x.hours_per_audit_today - x.hours_per_audit_tool]].forEach(function (item) {
          if (item[1] < 0 && inputs[item[0]]) x[item[0]] = inputs[item[0]][c === 'low' ? 'high' : 'low'];
        });
    }
    if (c !== 'likely' && inputs.hourly_rate_usd) {
      var annualHours = ((x.min_per_cert_today - x.min_per_cert_tool) * x.certs_per_year +
        (x.monthly_check_min_today - x.monthly_check_min_tool) * 12 * x.projects) / 60 +
        (x.hours_per_audit_today - x.hours_per_audit_tool) * x.audits_per_year - x.upkeep_hours_per_month * 12;
      if (annualHours < 0) x.hourly_rate_usd = inputs.hourly_rate_usd[c === 'low' ? 'high' : 'low'];
    }
    return x;
  }
  var lines = definitions.map(function (d) {
    var missing = d[2].filter(function (key) { return !valid(key); });
    var row = { key: d[0], label: d[1], missing: missing, inputs: d[2] };
    cases.forEach(function (c) { row[c] = missing.length ? null : Math.round(d[3](values(c)) * 100) / 100; });
    return row;
  });
  var required = Object.keys(inputs);
  definitions.forEach(function (d) { d[2].forEach(function (key) { if (required.indexOf(key) < 0) required.push(key); }); });
  var missingNet = required.filter(function (key) { return !valid(key); });
  var net = { key: 'net_value_usd', label: 'Net value per year', inputs: required, missing: missingNet };
  cases.forEach(function (c) {
    net[c] = missingNet.length ? null : Math.round((lines[0][c] + lines[1][c] + lines[2][c] - lines[5][c]) * 100) / 100;
  });
  lines.push(net);
  return { lines: lines, net: net, inputs: inputs, last_updated: document && document.updated || '', source: 'ROI inputs',
    sample: 'Sample data', floor_note: 'Each input is at its least favourable value. Staff cost uses one rate for both savings and upkeep.',
    basis_note: 'Illustrative annual value from fictional inputs. This is an estimate, not measured savings.' };
}

var TRUST_GAP_ROLE = 'Accountant';
var TRUST_COUNTS = ['expected_count', 'compliant_count', 'expired_count', 'expiring_30d_count', 'dollars_on_hold_usd'];

// rows: one object per compliance record with project_id, sub_id, sub_name, accountant_name, closed,
// current_certificate_id, queued_certificate_id and current_expired (true when the current certificate's
// expiration date is before today; when absent, the stored status 'expired' is used).
// A record whose newest certificate is expired is not received. A certificate in the review queue is newer
// than the current one, so a queued renewal counts as received.
// Returns one entry per subcontractor, in first-seen order.
function expectedVsReceived(rows) {
  var order = [], bySub = {};
  rows.forEach(function (r) {
    if (r.closed === true) return;
    var s = bySub[r.sub_id];
    if (!s) {
      s = bySub[r.sub_id] = { sub_id: r.sub_id, sub_name: r.sub_name, expected: 0, received: 0, gap: 0,
        responsible_role: TRUST_GAP_ROLE, responsible: [] };
      order.push(r.sub_id);
    }
    s.expected += 1;
    var expired = r.current_expired !== undefined ? r.current_expired === true : r.status === 'expired';
    if (r.queued_certificate_id || (r.current_certificate_id && !expired)) {
      s.received += 1;
    } else if (r.accountant_name && s.responsible.indexOf(r.accountant_name) < 0) {
      s.responsible.push(r.accountant_name);
    }
    s.gap = s.expected - s.received;
  });
  return order.map(function (id) { return bySub[id]; });
}

// Stored status vs live dashboard. Recounts the dashboard figures from the stored status column, which the
// daily job writes, and compares each with dashboardCounts (derived live from the certificates).
// Each mismatch: expected = the recount, actual = the figure the dashboard shows.
// dollarsRecount is the dollars-on-hold recount from pay applications (see dollarsOnHoldRecount).
function reconcile(sourceRows, dashboardCounts, clock, dollarsRecount) {
  var open = sourceRows.filter(function (r) { return r.closed !== true; });
  function count(test) { return open.filter(test).length; }
  var recount = {
    expected_count: open.length,
    compliant_count: count(function (r) { return r.status === 'compliant' || r.status === 'expiring_soon'; }),
    expired_count: count(function (r) { return r.status === 'expired'; }),
    expiring_30d_count: count(function (r) { return r.status === 'expiring_soon' && !r.queued_certificate_id; }),
    dollars_on_hold_usd: dollarsRecount
  };
  var mismatches = [];
  TRUST_COUNTS.forEach(function (name) {
    if (recount[name] !== dashboardCounts[name]) mismatches.push({ count: name, expected: recount[name], actual: dashboardCounts[name] });
  });
  return { pass: mismatches.length === 0, mismatches: mismatches, checked_at: clock.now() };
}

// Dollars on hold, recounted from source rows: the pay applications in the current pay cycle that belong to
// an open record on an active project with payment_hold set. Each pay application row counts once.
function dollarsOnHoldRecount(store, today, activeProjectIds) {
  var cycle = currentPayCycle(store, today);
  if (!cycle) return 0;
  var held = {};
  store.readRows('compliance_records').forEach(function (r) {
    if (r.closed !== true && r.payment_hold === true && activeProjectIds.indexOf(r.project_id) >= 0) held[r.project_id + '|' + r.sub_id] = true;
  });
  return store.readRows('pay_applications').reduce(function (sum, p) {

// AI cost (docs/metric-definitions.md, Data trust checks). rows: the ai_calls tab. The window is the calendar
// month of today, from the time column. Spend and calls count every purpose; per certificate counts reads only.
// A blank cost_usd in the window means an unknown price: spend and per certificate are null, never $0.
// Sums round to a millionth of a dollar.
function aiCostSummary(rows, today) {
  var month = String(today).slice(0, 7);
  var spend = 0, calls = 0, readSpend = 0, reads = 0, unknown = false, readUnknown = false, updated = '';
  rows.forEach(function (r) {
    if (String(r.time) > updated) updated = String(r.time);
    if (String(r.time).slice(0, 7) !== month) return;
    var blank = r.cost_usd === '' || r.cost_usd === null || r.cost_usd === undefined;
    var cost = blank ? 0 : Number(r.cost_usd);
    calls += 1;
    spend += cost;
    if (blank) unknown = true;
    if (r.purpose === 'read') {
      reads += 1;
      readSpend += cost;
      if (blank) readUnknown = true;
    }
  });
  function micro(n) { return Math.round(n * 1e6) / 1e6; }
  return {
    month: month,
    ai_spend_month_usd: unknown ? null : micro(spend),
    ai_calls_month: calls,
    ai_cost_per_certificate_usd: readUnknown || !reads ? null : micro(readSpend / reads),
    price_unknown: unknown,
    source: 'ai_calls', last_updated: updated
  };
}

}

function findOpenRecord(store, token) {

// file = { name, size, header, fingerprint, base64 }. header is the first five characters of the file.
function acceptUpload(deps, token, file) {
  var store = deps.store;
  if (!findOpenRecord(store, token)) return { ok: false, message: UPLOAD_MSG_BAD_LINK };
  if (!/\.pdf$/i.test(file.name) || file.header !== '%PDF-') return { ok: false, message: UPLOAD_MSG_NOT_PDF };
  if (file.size > MAX_UPLOAD_BYTES) return { ok: false, message: UPLOAD_MSG_TOO_BIG };

  return withScriptLock(function () {
    var rec = findOpenRecord(store, token);
    if (!rec) return { ok: false, message: UPLOAD_MSG_BAD_LINK };
    var seen = store.readRows('certificates').some(function (c) {
      return c.record_id === rec.record_id && c.file_fingerprint === file.fingerprint;
    }) || store.readRows('uploads').some(function (u) {
      return u.upload_token === token && u.file_fingerprint === file.fingerprint;
    });
    if (seen) return { ok: true, duplicate: true, message: UPLOAD_MSG_DUPLICATE };

    var uploadId = nextId(store, 'uploads', 'upload_id', 'UPL-');
    var link = store.writeBlob(DRIVE_INBOX, uploadId + ' ' + file.name, file.base64, 'application/pdf');
    store.appendRow('uploads', {
      upload_id: uploadId, upload_token: token, received_time: deps.clock.now(), file_name: file.name,
      file_fingerprint: file.fingerprint, drive_link: link, processed: false, attempts: 0, last_error: ''
    });
    return { ok: true, duplicate: false, message: UPLOAD_MSG_SAVED, upload_id: uploadId };
  });
}

// One upload per run. A failure counts one attempt; the third marks the row failed and moves on.
function processNextUpload(deps) {
  var store = deps.store;
  var next = store.readRows('uploads').filter(function (u) { return u.processed === false || u.processed === ''; })[0];
  if (!next) return { status: 'none' };
  var attempts = (next.attempts === '' ? 0 : next.attempts) + 1;
  try {
    processCertificate(deps, next.upload_token, { name: next.file_name, fingerprint: next.file_fingerprint, link: next.drive_link });
  } catch (err) {
    var failed = attempts >= MAX_UPLOAD_ATTEMPTS;
    var message = String(err && err.message ? err.message : err);
    withScriptLock(function () {
      store.updateRow('uploads', 'upload_id', next.upload_id, { attempts: attempts, last_error: message, processed: failed ? 'failed' : false });
      if (failed) {
        var rec = findRow(store.readRows('compliance_records'), 'upload_token', next.upload_token);
        store.appendRow('activity_log', {
          record_id: rec ? rec.record_id : '', time: deps.clock.now(), who: 'System', event_type: 'upload_failed',
          summary: 'Upload ' + next.upload_id + ' failed ' + attempts + ' times and was skipped. ' + message, drive_link: next.drive_link
        });
      }
    });
    return { status: failed ? 'failed' : 'retry', upload_id: next.upload_id };
  }
  withScriptLock(function () {
    store.updateRow('uploads', 'upload_id', next.upload_id, { attempts: attempts, last_error: '', processed: true });
  });
  return { status: 'processed', upload_id: next.upload_id };
}

// A receipt exposes only the result for the upload that belongs to its token.
function uploadProgress(deps, token, uploadId) {
  var upload = findRow(deps.store.readRows('uploads'), 'upload_id', uploadId);
  var record = findRow(deps.store.readRows('compliance_records'), 'upload_token', token);
  if (!upload || !record || upload.upload_token !== token) return {state:'inactive',complete:true,message:'This upload receipt is not active. Contact the project team.'};
  if (upload.processed === 'failed') return {state:'failed',complete:true,message:'The certificate check could not finish. Contact the project team for help. Your file is saved.'};
  if (upload.processed !== true) return {state:'waiting',complete:false,message:'Your file is saved. Waiting for the certificate check.'};
  var certificate = deps.store.readRows('certificates').filter(function (c) {
    return c.record_id === record.record_id && c.file_fingerprint === upload.file_fingerprint;
  })[0];
  if (!certificate) return {state:'received',complete:true,message:'Your file is saved. The project team will review the result.'};
  if (certificate.queue_reason === 'Unreadable file') return {state:'unreadable',complete:true,message:'The certificate could not be read. Please resend a readable standard PDF.'};
  if (certificate.queue_stage === 'needs_review') return {state:'needs_review',complete:true,message:'The certificate was read. The project team must check the reading before approval.'};
  if (certificate.queue_stage === 'deficiency') return {state:'decision',complete:true,message:'The certificate was read. The project team must decide on the project requirements.'};
  if (certificate.queue_stage === 'approval') return {state:'approval',complete:true,message:'The certificate was read. It is waiting for the accountant to approve.'};
  return {state:'complete',complete:true,message:'The certificate check is complete. The project team recorded the result.'};
}

  // Notifications: a read-only preview of the automatic emails. Nothing here sends.

        closed ? {value:'Not approved', sub:'Not sent', st:'skip'} : {value:n.approved_by || 'A person', sub:'Approved', st:'done'};

      return '<li' + (animate ? ' class="row-in" style="animation-delay:' + wait(Math.min(i,12) * 40) + 'ms"' : '') + '><button class="note-item" data-note="' + esc(n.id) + '"' + (chosen && n.id === chosen.id ? ' aria-current="true"' : '') + '>' +
        '<span class="note-top"><strong>' + esc(n.event) + '</strong>' + badge(n.status) + '</span>' +
        '<span class="note-sub">' + esc(n.sub_name ? n.sub_name + ' · ' : '') + 'To ' + esc(n.to_name) + '</span><span class="note-sub">' + esc(stamp(n.time)) + (n.project ? ' · ' + esc(n.project) : '') + '</span></button></li>';
    }).join('') + '</ul>' : '<div class="empty"><h3>No matching emails</h3><p>Change the status or the event to see other emails.</p></div>') +
      '<div class="table-foot"><span>' + plural(found.length,'email','emails') + '</span><span class="source foot-source" title="' + esc(u.source) + '">' + esc(u.text) + ' · ' + esc(u.source) + '</span></div>';
    list.querySelectorAll('[data-note]').forEach(function (b) { b.onclick = function () {
      state.notes.id = b.dataset.note; renderNoteBody(false);
      if (narrowNotes()) { state.notes.scrollY = window.scrollY; setNotePane('detail'); document.getElementById('note-preview').scrollIntoView({block:'start'}); }
    }; });
    var pane = document.getElementById('note-preview');
    if (!chosen) { pane.innerHTML = '<div class="empty"><h3>Nothing selected</h3><p>No email matches these filters.</p></div>'; return; }
    var n = chosen, steps = noteSteps(n), ai = n.drafted_by === 'AI';
    pane.innerHTML = '<button type="button" class="btn back note-back" id="note-back">← Notifications</button><div class="note-meta"><span class="note-event">' + esc(n.event) + '</span>' + badge(n.status) + '<span class="mark' + (ai ? ' ai' : '') + '">' + (ai ? 'Drafted by AI' : 'Template') + '</span></div>' +
      '<h2>' + esc(n.subject) + '</h2>' +
      '<p class="note-to">To <strong>' + esc(n.to_name) + '</strong>' + (n.to_role ? ' (' + esc(n.to_role) + ')' : '') + ' · ' + esc(n.to_email) + '</p>' +
      '<dl class="note-facts"><div><dt>Trigger</dt><dd>' + esc(n.trigger) + '</dd></div><div><dt>Approval step</dt><dd>' + esc(n.approval) + '</dd></div></dl>' +
      '<ol class="note-track" aria-label="Progress">' + steps.map(function (s) {
        return '<li class="' + s.st + '"' + (s.st === 'now' ? ' aria-current="step"' : '') + '><span class="mk" aria-hidden="true">' + (s.st === 'done' ? '✓' : s.st === 'skip' ? '–' : '') + '</span><span class="lb">' + esc(s.label) + '</span><span class="vl">' + esc(s.value) + '</span><span class="sb">' + esc(s.sub) + '</span></li>';
      }).join('') + '</ol>' +
      '<div class="email" aria-label="Email text"><div class="email-head"><span>Subject</span><strong>' + esc(n.subject) + '</strong></div><div class="email-body">' + esc(n.body) + '</div></div>' +
      '<p class="footnote">' + esc(data.banner || NOTE_BANNER) + '</p>';
    document.getElementById('note-back').onclick = function () { setNotePane('list'); window.scrollTo(0,state.notes.scrollY); };
  }

  // Keyboard: ↑ ↓ (or j k) move, Enter opens, / searches, Esc blurs a field or goes back from a record.
  document.addEventListener('keydown',function (e) {
    if (dialog.open) return;
    var t = e.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
    if (e.key === 'Escape') {
      if (overlay() && state.sideOpen) { setSide(false); document.getElementById('side-expand').focus(); return; }
      if (typing) { t.blur(); return; }
      if (state.view === 'detail' && !state.busy) navigate('worklist');
      if (state.view === 'company' && !state.busy) navigate('directory');
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); search.focus(); return; }
    if (state.view !== 'worklist') return;
    var count = state.visible.length;
    if ((e.key === 'ArrowDown' || e.key === 'j') && count) { e.preventDefault(); state.cursor = Math.min(count - 1,state.cursor + 1); drawCursor(); scrollCursor(); }
    else if ((e.key === 'ArrowUp' || e.key === 'k') && count) { e.preventDefault(); state.cursor = Math.max(0,state.cursor - 1); drawCursor(); scrollCursor(); }
    else if (e.key === 'Enter' && state.cursor >= 0 && t.tagName !== 'BUTTON' && t.tagName !== 'A') { e.preventDefault(); openRecord(state.visible[state.cursor].record_id); }
  });
  function scrollCursor() { var row = view.querySelector('#work-rows tr.cursor'); if (row) row.scrollIntoView({block:'nearest'}); }

  // About view. It is reached from the sidebar foot, not from ORDER.
  NAV_LABEL.about = 'About';
  function showAbout() {
    if (state.busy || dialog.open) return;
    state.dir = 'fwd'; state.view = 'about'; state.cursor = -1; state.request++;
    if (state.search) { state.search = ''; search.value = ''; searchBox.classList.remove('has-text'); }
    renderSide(); setHead(NAV_LABEL.about, '', false); window.scrollTo(0,0);
    setView('<div class="surface about" style="padding:28px 32px">' +
      '<h2>How it works</h2>' +
      '<p class="thesis">AI reads, routes and drafts. Code calculates and decides. A person approves what matters. The model never does arithmetic.</p>' +
      '<h2>The 0.85 rule</h2>' +
      '<p>When the model reads a certificate with confidence below 0.85, a person checks the reading first. It never approves on its own.</p>' +
      '<p class="about-sample">All names are fictional.</p>' +
      '<p class="about-credit">Designed and built by Lucas Layden.</p></div>');
  }
  document.getElementById('about-link').onclick = showAbout;

  // Host API for the guided tour (Tour.html). The tour calls go() to switch screens and screen() to read the current one.
  // The record screen is the detail of a reading below the 0.85 gate. Worklist rows carry no confidence,
  // so a row the server routed to "Check the reading" stands in for it.
  function lowConfidenceRecord() {
    var rows = state.all ? state.all.rows : [];
    var row = rows.filter(function (r) { return r.next === 'correct' && r.status === 'Needs review'; })[0];
    if (row) return row.record_id;
    var seen = Object.keys(state.details).filter(function (id) { var d = state.details[id]; return d && typeof d.confidence === 'number' && d.confidence < 0.85; })[0];
    if (seen) return seen;
    row = rows.filter(function (r) { return !!r.waiting; })[0];
    return row ? row.record_id : null;
  }
  window.coiApp = {
    screen: function () { return state.view === 'detail' ? 'record' : state.view; },
    go: function (name) {
      if (name === 'record') { var id = lowConfidenceRecord(); if (id) openRecord(id); else navigate('worklist'); return; }
      if (name === 'about') { showAbout(); return; }
      // A screen this build does not have yet is ignored, and the tour shows the step's card in the centre.
      // The tour shows the whole portfolio, as the sidebar's "View all" does. Without this, a list keeps the
      // project of the record the tour opened before it, and Payment holds can show $0.
      if (name === 'worklist') { state.project = 'all'; state.filter = 'waiting'; }
      if (name === 'holds') state.project = 'all';
      if (ORDER.indexOf(name) >= 0) navigate(name);
    },
    // Asks the server for every screen the tour opens, in the background, so each tour step finds its data
    // already in the page. fetchView and fetchDetail share one request per screen, so a later visit waits on it.
    warm: function () {
      fetchView('directory',askDirectory,'rows',null,null);
      fetchView('notifications',askNotifications,'rows',null,null);
      var id = lowConfidenceRecord();
      if (id && !state.details[id] && !state.fetching[id]) fetchDetail(id);
    }
  };

  // Figures show at once from the data in the page, in both modes. In Share Proj with saved changes, one quiet
  // refresh then lays this tab's changes over them.
  if (INITIAL.data) useData(INITIAL.data);
  if (INITIAL.record) openRecord(INITIAL.record);
  else navigate(state.role === 'leadership' ? 'projects' : 'worklist');
  // A write after start-up brings its own fresh copy, so this refresh drops its answer: a late reply must not undo the write.
  if (INITIAL.data && DEMO && demoOverlay()) {
    var writesAtStart = state.writes || 0;
    rpc('getAppData',[],function (data) {
      if ((state.writes || 0) !== writesAtStart) return;
      useData(data); renderSide();
      if (!state.busy && !dialog.open && state.view !== 'detail') navigate(state.view,{quiet:true});
    },function () {});
  }
  setTimeout(function () { withPdfLib(function () {},function () {}); },1500);
})();
</script>

      target = fresh; ring.classList.remove('ct-dim');
    }
    var b = boxFor(target);
    if (!last || Math.abs(b.x - last.x) > .5 || Math.abs(b.y - last.y) > .5 || Math.abs(b.w - last.w) > .5 || Math.abs(b.h - last.h) > .5) {
      last = b; setRing(b); if (target) placeCard(b, false, false);
    }
  }

  function start(opts) {
    build(); hideWelcome(true); hideHint();
    if (isOpen) return;
    warm();
    opts = opts || {};
    returnTo = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
    isOpen = true; idx = -1; last = null; target = null; finished = false;
    ring.classList.remove('ct-off'); card.classList.remove('ct-off');
    setPlay(!!opts.autoplay);
    go(0);
    setTimeout(function () { card.focus({ preventScroll: true }); }, D ? 60 : 0);
    cancelAnimationFrame(raf); track();
  }

  function close(completed) {
    if (!isOpen) return;
    isOpen = false; token++; clearTimeout(timer); cancelAnimationFrame(raf);
    markSeen();
    ring.classList.add('ct-dim'); card.classList.add('ct-out');
    setTimeout(function () { if (!isOpen) { ring.classList.add('ct-off'); card.classList.add('ct-off'); ring.classList.remove('ct-dim'); showMain(true); } }, D ? 240 : 0);
    live.textContent = L.closed || '';
    var rb = q('[data-tour-replay]');
    var back = completed === true ? rb : (returnTo && document.contains(returnTo) ? returnTo : rb);
    if (back && back.focus) back.focus({ preventScroll: true });
    if (completed !== true) setTimeout(showHint, D ? 380 : 0);
  }

  /* Welcome card: first visit only. */
  function showWelcome() {
    if (welcome) return;
    warm();
    var rows = (W.demo || []).map(function (r, i) {
      return '<li class="ct-w-row" style="--i:' + i + '" data-tone="' + esc(r.tone) + '"><span class="ct-w-co">' + esc(r.name) + '</span>' +
        '<span class="ct-w-st"><span class="ct-w-from">' + esc(r.from) + '</span><span class="ct-w-to"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.3l2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' + esc(r.to) + '</span></span></li>';
    }).join('');
    welcome = document.createElement('div'); welcome.className = 'ct-welcome';
    welcome.innerHTML = '<div class="ct-veil" data-w="later"><span class="ct-orb ct-orb-a"></span><span class="ct-orb ct-orb-b"></span><span class="ct-orb ct-orb-c"></span></div>' +
      '<div class="ct-wcard" role="dialog" aria-modal="false" aria-labelledby="ct-w-title"><span class="ct-w-glow" aria-hidden="true"></span>' +
      '<div class="ct-w-hero" aria-hidden="true"><div class="ct-w-hero-top">' +
      '<span class="ct-w-live"><i></i>' + esc(W.demoLabel) + '</span></div><ul class="ct-w-rows">' + rows + '</ul></div>' +
      '<div class="ct-w-copy"><div class="ct-w-eyebrow">' + esc(W.eyebrow) + '</div><h2 class="ct-w-title" id="ct-w-title">' + esc(W.title) + '</h2><p class="ct-w-body">' + esc(W.body) + '</p>' +
      '<div class="ct-w-actions"><button type="button" class="ct-btn ct-next ct-w-go" data-w="start"><span>' + esc(W.start) + '</span><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16"><path d="M3 8h9M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '<button type="button" class="ct-btn ct-ghost" data-w="later">' + esc(W.later) + '</button></div>' + (W.minutes ? '<div class="ct-w-meta">' + esc(W.minutes) + '</div>' : '') + '</div></div>';
    document.body.appendChild(welcome);
    var cardEl = welcome.querySelector('.ct-wcard');
    void welcome.offsetWidth; welcome.classList.add('ct-in');
    if (!rm && window.matchMedia && matchMedia('(pointer: fine)').matches) {
      var tx = 0, ty = 0, cx = 0, cy = 0, wr = 0;
      var loop = function () {
        if (!welcome) return;
        cx += (tx - cx) * .08; cy += (ty - cy) * .08;
        cardEl.style.setProperty('--rx', (cy * -2.2).toFixed(3) + 'deg');
        cardEl.style.setProperty('--ry', (cx * 2.8).toFixed(3) + 'deg');
        cardEl.style.setProperty('--gx', (50 + cx * 38).toFixed(1) + '%');
        cardEl.style.setProperty('--gy', (30 + cy * 30).toFixed(1) + '%');
        welcome.style.setProperty('--px', (cx * 14).toFixed(1) + 'px');
        welcome.style.setProperty('--py', (cy * 10).toFixed(1) + 'px');
        wr = requestAnimationFrame(loop);
      };
      welcome.addEventListener('pointermove', function (ev) { tx = ev.clientX / window.innerWidth * 2 - 1; ty = ev.clientY / window.innerHeight * 2 - 1; });
      welcome.addEventListener('pointerleave', function () { tx = ty = 0; });
      loop();
    }
    var flips = welcome.querySelectorAll('.ct-w-row');
    Array.prototype.forEach.call(flips, function (r, i) { setTimeout(function () { if (r.isConnected) r.classList.add('ct-done'); }, rm ? 0 : 1000 + i * 520); });
    welcome.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-w]'); if (!b) return;
      // Either choice answers the welcome card, so it never shows again. Replay stays on the Tour button.
      if (b.getAttribute('data-w') === 'start') { markSeen(); start(); } else { hideWelcome(); markSeen(); setTimeout(showHint, D ? 260 : 0); }
    });
    setTimeout(function () { var st = welcome && welcome.querySelector('[data-w="start"]'); if (st) st.focus({ preventScroll: true }); }, 60);
  }
  function hideWelcome(instant) {
    if (!welcome) return;
    var w = welcome; welcome = null; w.classList.remove('ct-in'); w.classList.add('ct-leaving');
    setTimeout(function () { w.remove(); }, instant || !D ? 0 : 320);
  }

  /* One-time pointer to the replay button after a close. */
  function showHint() {
    var rb = q('[data-tour-replay]'); if (!rb) return;
    hideHint();
    var r = rb.getBoundingClientRect();
    hintRing = document.createElement('span'); hintRing.className = 'ct-hint-ring'; hintRing.setAttribute('aria-hidden', 'true');
    hintRing.style.cssText = 'left:' + (r.left - 3) + 'px;top:' + (r.top - 3) + 'px;width:' + (r.width + 6) + 'px;height:' + (r.height + 6) + 'px';
    document.body.appendChild(hintRing);
    void hintRing.offsetWidth; hintRing.classList.add('ct-in');
    if (live) live.textContent = C.hint || '';
    hideHint.t = setTimeout(hideHint, 3400);
    document.addEventListener('pointerdown', hideHint, { once: true });
  }
  function hideHint() {
    clearTimeout(hideHint.t);
    [hintRing].forEach(function (el) { if (!el) return; el.classList.remove('ct-in'); setTimeout(function () { el.remove(); }, 260); });
    hintRing = null;
  }

  window.addEventListener('keydown', function (e) {
    if (welcome && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); hideWelcome(); markSeen(); setTimeout(showHint, D ? 260 : 0); return; }
    if (!isOpen) return;
    var tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select';
    var hit = true;
    if (e.key === 'Escape') close();
    else if (typing || finished) hit = false;
    else if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') go(idx - 1);
    else if (e.key === 'p' || e.key === 'P') setPlay(!playing);
    else hit = false;
    if (hit) { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); }
  }, true);

  window.addEventListener('resize', function () { if (isOpen && !moving) last = null; if (hintRing) hideHint(); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-tour-replay]');
    if (b && !b.hasAttribute('data-tour-managed')) start();
  });

  window.CoiTour = { start: start, close: close, autoplay: function () { start({ autoplay: true }); }, isOpen: function () { return isOpen; }, welcome: showWelcome };

  function boot() {
    var tries = 0, init = typeof INITIAL === 'object' && INITIAL ? INITIAL : {};
    (function wait() {
      if (!app() && tries++ < 100) { setTimeout(wait, 50); return; }
      var seen = false; try { seen = localStorage.getItem(C.storageKey) === '1'; } catch (e) {}
      if (init.tour === 'play') setTimeout(function () { start({ autoplay: true }); }, 600);
      else if (!seen && !init.record) setTimeout(showWelcome, 700);
    })();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
