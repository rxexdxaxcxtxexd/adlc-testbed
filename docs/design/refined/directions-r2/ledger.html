body{background:var(--canvas);color:var(--ink);font:14px/1.55 var(--body-font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.chrome{background:var(--chrome);gap:var(--chrome-gap);padding:var(--chrome-pad)}
.brand{gap:12px}.brand>.icon{width:24px;height:24px}.brand strong{display:block;font-size:14px;font-weight:600}.brand span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.navigation{gap:4px}.navigation a{display:flex;align-items:center;min-height:44px;padding:8px 12px;text-decoration:none;font-size:12px;color:var(--muted)}
.navigation a:hover{color:var(--ink);background:var(--hover)}.navigation a[aria-current]{color:var(--ink);font-weight:600}
.demo{gap:12px;font-size:11px}.demo label{gap:8px;flex-wrap:wrap}.demo-label{font:600 10px/1.5 var(--mono-font);text-transform:uppercase;letter-spacing:.08em}
.demo select{max-width:100%;min-height:44px;background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:var(--control-radius);padding:7px 28px 7px 10px;font-size:12px}
.page{padding:var(--page-pad)}.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;font-size:12px;color:var(--muted);margin-bottom:var(--back-gap)}
.back:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.record-head{margin-bottom:var(--section-gap)}.header-top{gap:12px}.eyebrow{color:var(--muted);font:500 var(--label-size)/1.5 var(--label-font);letter-spacing:var(--label-tracking)}.record-id{font-family:var(--mono-font)}
.sample{font-size:11px;color:var(--muted)}
h1{font:var(--title-weight) var(--title-size)/1.08 var(--display-font);letter-spacing:var(--title-tracking);margin:var(--title-gap) 0 8px;overflow-wrap:anywhere}
.project-name{color:var(--muted);font-size:14px}.head-state{align-items:center;gap:14px;margin-top:var(--state-gap)}.waiting{font-size:13px}
.status{padding:var(--status-pad);border-radius:var(--status-radius);color:var(--tone);background:var(--tint);font-size:12px;font-weight:600}
.facts{gap:var(--fact-gap);margin-top:var(--facts-top);padding-top:var(--facts-pad)}.facts dt{color:var(--muted);font-size:11px}.facts dd{font-size:12px;margin-top:3px}
.trust{gap:4px 16px;color:var(--muted);font-size:10px;margin-top:var(--trust-gap);line-height:1.6}
.layout{gap:var(--layout-gap)}.pane{padding:var(--pane-pad)}.pane-head{gap:12px;margin-bottom:var(--head-gap);flex-wrap:wrap}
.pane h2{font:var(--heading-weight) var(--heading-size)/1.25 var(--heading-font);letter-spacing:var(--heading-tracking)}
.fine{color:var(--muted);font-size:11px;line-height:1.6}.text-link{color:var(--muted);font-size:11px;text-underline-offset:4px}.text-link:hover{color:var(--ink)}
.pdf-pages{gap:16px;margin-top:var(--pdf-gap)}.pdf-page{background:#f8f3e8;/* warm document paper */}.pdf-loading{min-height:420px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.step h2{font:var(--step-weight) var(--step-size)/1.15 var(--heading-font);letter-spacing:var(--step-tracking);margin-bottom:var(--step-gap)}
.step-body>p{margin-bottom:var(--body-gap)}.deficiencies{margin:var(--def-gap) 0}.deficiencies li{gap:9px;padding:var(--def-pad) 0}.failure-mark,.failure-word{color:var(--tone)}
.field-label{font-size:12px;margin:14px 0 7px;font-weight:600}.field-label span{font-weight:400;color:var(--muted)}
.field{padding:10px 12px;color:var(--ink);background:var(--field-bg);border:1px solid var(--edge);border-radius:var(--control-radius);min-height:44px;resize:vertical}
.field::placeholder{color:var(--muted);opacity:1}.field:hover{border-color:var(--ink)}
.actions{gap:10px;margin:var(--action-gap) 0}
.button{min-height:44px;padding:10px 18px;background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:var(--button-radius);font-size:13px;font-weight:600}
.button:hover:not(:disabled){background:var(--hover)}.button:active:not(:disabled){transform:translateY(1px)}
.button.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}.button.primary:hover:not(:disabled){background:var(--primary-hover)}
.button.decision{flex:1;background:var(--decision-bg);color:var(--decision-ink);border-color:var(--decision-edge)}.button.decision:hover:not(:disabled){background:var(--decision-hover)}
.button:disabled{opacity:.65}.text-button{background:transparent;border:0;color:var(--muted);padding:6px 0;font-size:11px;text-decoration:underline;text-underline-offset:4px}

summary::before{content:'+';margin-right:8px;font-family:var(--mono-font)}details[open] summary::before{content:'−'}
.email{background:var(--field-bg);padding:14px;font:11px/1.7 var(--mono-font)}.step>.fine{margin-top:var(--trust-gap)}
.refusal{color:var(--ink);border-left:2px solid var(--edge);padding:10px 12px;background:var(--hover);font-size:12px}
.confidence{margin-bottom:var(--confidence-gap)}.confidence-top{font-size:12px}.confidence-top>strong{font:var(--confidence-weight) var(--confidence-size)/1.2 var(--number-font)}
.confidence-track{height:var(--track-height);background:var(--rule);margin:10px 0}.confidence-fill{background:var(--ink)}
.confidence-mark{width:2px;background:var(--canvas);outline:1px solid var(--ink)}
.value-row{grid-template-columns:var(--value-columns);gap:var(--row-gap);min-height:var(--row-height);padding:var(--row-pad);border-bottom:var(--row-rule);font-size:var(--row-size)}
.value-row:last-child{border-bottom:0}.value-row[data-key]:hover{background:var(--hover)}
.table-head{min-height:30px;color:var(--muted);font:500 10px/1.5 var(--label-font)}
.found,.required{text-align:right}.result{justify-content:flex-end;font-size:11px;color:var(--tone);white-space:nowrap}
.label small{font-size:10px;line-height:1.5;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.money{font-family:var(--number-font)}.value-row .field{padding:6px 8px;font-size:12px;min-width:0}.value-row input{text-align:right}
.w9>p{font-size:13px}.timeline li{padding:var(--timeline-pad) 0;border-bottom:1px solid var(--rule)}.timeline li:last-child{border:0}
.timeline-meta{gap:5px 12px;color:var(--muted);font-size:10px;margin-bottom:5px}.timeline-meta strong{color:var(--ink);font-size:11px;font-weight:500}
.timeline li>p:last-child{font-size:12px}.timeline>.fine{margin-bottom:8px}
.toasts{bottom:24px;right:24px;width:min(420px,calc(100vw - 32px))}
.toast{gap:12px;background:var(--ink);color:var(--canvas);border:1px solid var(--edge);padding:12px 16px;border-radius:var(--toast-radius);font-size:13px}
.toast button{background:transparent;color:inherit;border:0;min-height:44px;min-width:44px;font-size:20px}
.skip{top:12px;left:12px;background:var(--ink);color:var(--canvas);padding:12px}
[data-tone="green"]{--tone:var(--green);--tint:var(--green-tint)}[data-tone="amber"]{--tone:var(--amber);--tint:var(--amber-tint)}[data-tone="red"]{--tone:var(--red);--tint:var(--red-tint)}
[data-tone="blue"]{--tone:var(--blue);--tint:var(--blue-tint)}[data-tone="violet"]{--tone:var(--violet);--tint:var(--violet-tint)}[data-tone="neutral"]{--tone:var(--neutral);--tint:var(--neutral-tint)}

--chrome-gap:24px;--chrome-pad:20px 48px 0;--page-pad:30px 64px 56px;--back-gap:24px;--section-gap:40px;--state-gap:20px;--fact-gap:48px;--facts-top:24px;--facts-pad:22px;--trust-gap:16px;--layout-gap:36px 56px;--pane-pad:0;--head-gap:18px;--pdf-gap:20px;
--status-pad:0;--status-radius:0;--control-radius:1px;--button-radius:3px;--toast-radius:1px;
--step-gap:22px;--body-gap:18px;--def-gap:20px;--def-pad:10px;--action-gap:22px;--decision-bg:transparent;--decision-ink:#292921;--decision-edge:#8e7d62;--decision-hover:#e6dcc9;

--duration-1:120ms;--duration-2:240ms;--duration-3:360ms;--ease:cubic-bezier(.16,1,.3,1);--distance-x:0px;--distance-y:5px;
--mobile-title:40px;--mobile-step:32px;--mobile-number:13px;--mobile-pane-pad:0}
.app{display:block}.chrome{align-items:center}.brand{flex:1}.navigation a[aria-current]{border-bottom:2px solid var(--ink)}
.demo{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);width:100%;padding:12px 0}.demo .text-button{margin-left:auto}
.record-head{border-bottom:1px solid var(--ink);padding-bottom:28px}.record-head .eyebrow{text-transform:uppercase}.facts{border-top:1px solid var(--rule)}
.status{background:transparent;font-variant:small-caps;font-size:15px;letter-spacing:.04em}.status .icon{width:10px;height:10px}
.layout{grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"step pdf" "values pdf" "w9 pdf" "timeline timeline";align-items:start}
.step{max-width:760px}.step .eyebrow{text-transform:uppercase;margin-bottom:6px}.step-body>p:first-child{max-width:650px}
.deficiencies li{border-top:1px solid var(--rule);font-size:14px}.deficiencies li:last-child{border-bottom:1px solid var(--rule)}.deficiencies .failure-mark{margin-top:3px}
.field{border-width:0 0 1px;padding:12px 0;background:transparent}.actions{max-width:380px}
.pdf{border-left:1px solid var(--rule);padding-left:24px}.pdf h2{font-size:21px}.pdf .pane-head{flex-direction:column;align-items:flex-start}
.pdf .text-link,.pdf>.fine{font-size:10px}.values{border-top:1px solid var(--ink);padding-top:28px}.confidence{max-width:400px}
.w9{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;border-top:1px solid var(--rule);padding-top:18px}.w9 .pane-head{margin:0}.w9 .trust{width:100%}
.timeline{border-top:1px solid var(--ink);padding-top:28px}.timeline ol{max-width:900px}
@media(max-width:1000px){.pdf{border-left:0;padding:0}.chrome{padding:20px}.demo .text-button{margin-left:0}}
@media(max-width:600px){.record-head{padding-bottom:24px}.w9{display:block}.w9 .pane-head{margin-bottom:8px}}
.button{transition:transform var(--duration-1) var(--ease)}
.pdf-page{animation:settle var(--duration-3) var(--ease) both}
